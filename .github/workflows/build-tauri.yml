name: Build and Sign Tauri App

on:
  workflow_dispatch:
  # Trigger after python binary build completes
  workflow_run:
    workflows: ["Build Python Binary"]
    types: [completed]

permissions:
  contents: write
  actions: read

defaults:
  run:
    shell: bash

jobs:
  build-tauri:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 720
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary-name: docuscope-x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary-name: docuscope-x86_64-pc-windows-msvc.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            binary-name: docuscope-x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
            binary-name: docuscope-aarch64-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Download PyInstaller binary from previous workflow
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: pyinstaller-binary-${{ matrix.target }}
          path: ./temp-binary/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download PyInstaller binary (manual/push trigger)
        if: github.event_name != 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: pyinstaller-binary-${{ matrix.target }}
          path: ./temp-binary/

      - name: Download PyInstaller directory (Windows only)
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        id: download-directory
        uses: actions/download-artifact@v4
        with:
          name: pyinstaller-directory-${{ matrix.target }}
          path: ./tauri/src-tauri/binaries/_internal/

      - name: Check PyInstaller directory download result (Windows only)
        if: matrix.os == 'windows-latest'
        run: |
          if [ "${{ steps.download-directory.outcome }}" == "success" ]; then
            echo "PyInstaller directory artifact downloaded successfully"
            if [ -d "./tauri/src-tauri/binaries/_internal/" ] && [ "$(ls -A ./tauri/src-tauri/binaries/_internal/)" ]; then
              echo "PyInstaller directory found and contains files"
              echo "HAS_INTERNAL_DIR=true" >> $GITHUB_ENV
            else
              echo "PyInstaller directory artifact exists but is empty"
              echo "HAS_INTERNAL_DIR=false" >> $GITHUB_ENV
            fi
          else
            echo "PyInstaller directory artifact not found - this is normal for single-file executables"
            echo "Using single-file executable mode"
            echo "HAS_INTERNAL_DIR=false" >> $GITHUB_ENV
          fi

      - name: Copy binary to Tauri binaries directory
        run: |
          mkdir -p ./tauri/src-tauri/binaries/
          
          # Debug: Check what was downloaded
          echo "Contents of temp-binary directory:"
          ls -la ./temp-binary/
          
          # Check if the expected binary exists
          if [[ ! -f "./temp-binary/${{ matrix.binary-name }}" ]]; then
            echo "ERROR: Expected binary './temp-binary/${{ matrix.binary-name }}' not found!"
            echo "Available files in temp-binary:"
            find ./temp-binary/ -type f -ls
            
            # Try to find any executable files
            echo "Looking for executable files:"
            find ./temp-binary/ -type f -executable -ls
            
            # Check if there's a file with similar name
            echo "All files in temp-binary:"
            ls -la ./temp-binary/
            exit 1
          fi
          
          # Copy the binary with the exact name Tauri expects
          # Tauri looks for binaries/docuscope-{target} based on the externalBin config
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            # Windows binaries need .exe extension
            cp ./temp-binary/${{ matrix.binary-name }} ./tauri/src-tauri/binaries/docuscope-${{ matrix.target }}.exe
            chmod +x ./tauri/src-tauri/binaries/docuscope-${{ matrix.target }}.exe
          else
            # Unix systems (macOS, Linux) don't need extension
            cp ./temp-binary/${{ matrix.binary-name }} ./tauri/src-tauri/binaries/docuscope-${{ matrix.target }}
            chmod +x ./tauri/src-tauri/binaries/docuscope-${{ matrix.target }}
          fi
          
          # Debug: List the binaries directory
          echo "Contents of binaries directory:"
          ls -la ./tauri/src-tauri/binaries/

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: |
            tauri/pnpm-lock.yaml
            tauri/package.json

      - name: Install Tauri dependencies
        working-directory: tauri
        run: pnpm install

      - name: Import Apple Developer certificate (macOS only)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Skip if certificate is not available
          if [[ -z "$APPLE_CERTIFICATE_P12" ]]; then
            echo "Apple Developer certificate not available, skipping code signing setup"
            exit 0
          fi
          
          # Generate a temporary keychain password
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          
          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          
          # Import certificate
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          
          # Set partition list to allow codesign to access the key
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          
          # Clean up
          rm certificate.p12

      - name: Build Tauri application
        working-directory: tauri
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
        run: pnpm tauri build --target ${{ matrix.target }}

      - name: Setup Certum Code Signing (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          echo "=== SETTING UP CERTUM CODE SIGNING FOR WINDOWS ==="
          echo "Installing SimplySign Desktop and configuring for automatic authentication"
          
          # Install SimplySign Desktop
          chmod +x ./.github/scripts/install-simplysign.sh
          ./.github/scripts/install-simplysign.sh
          
          # Configure registry for auto-login dialog
          echo "Configuring registry for automatic login dialog..."
          powershell -ExecutionPolicy Bypass -File "./.github/scripts/configure-simplysign-registry.ps1"
          
          echo "Certum signing environment ready"
        shell: bash

      - name: Authenticate Certum (Windows)
        if: matrix.os == 'windows-latest'
        env:
          CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}
          CERTUM_USERNAME: ${{ secrets.CERTUM_USERNAME }}
        run: |
          echo "=== CERTUM AUTHENTICATION ==="
          echo "Authenticating with Certum cloud certificate using TOTP"
          
          # Authenticate with Certum using our enhanced script
          powershell -ExecutionPolicy Bypass -File "./.github/scripts/Connect-SimplySign-Enhanced.ps1"
          
          echo "Authentication completed"
        shell: bash

      - name: Verify Certificate and Sign Windows Binaries
        if: matrix.os == 'windows-latest'
        env:
          CERTUM_CERTIFICATE_SHA1: ${{ secrets.CERTUM_CERTIFICATE_SHA1 }}
        run: |
          echo "=== CERTIFICATE VERIFICATION AND WINDOWS BINARY SIGNING ==="
          echo "Allowing connection to stabilize..."
          sleep 10
          
          echo "Comprehensive certificate availability check..."
          echo ""
          
          echo "=== Windows Certificate Store Analysis ==="
          powershell -Command "
            Write-Host 'Current User Personal Store:'
            Get-ChildItem -Path 'Cert:\\CurrentUser\\My' -ErrorAction SilentlyContinue | 
              Select-Object Subject, Issuer, Thumbprint, HasPrivateKey, NotAfter |
              Format-Table -AutoSize
            
            Write-Host 'Local Machine Personal Store:'
            Get-ChildItem -Path 'Cert:\\LocalMachine\\My' -ErrorAction SilentlyContinue |
              Select-Object Subject, Issuer, Thumbprint, HasPrivateKey, NotAfter |
              Format-Table -AutoSize
            
            Write-Host 'Searching for Certum-related certificates:'
            Get-ChildItem -Path 'Cert:\\CurrentUser\\*','Cert:\\LocalMachine\\*' -Recurse -ErrorAction SilentlyContinue |
              Where-Object { \$_.Subject -like '*Certum*' -or \$_.Issuer -like '*Certum*' -or \$_.Subject -like '*Code Signing*' } |
              Select-Object Subject, Issuer, Thumbprint, HasPrivateKey, NotAfter |
              Format-Table -AutoSize
            
            Write-Host 'Certificates with Code Signing capability:'
            Get-ChildItem -Path 'Cert:\\CurrentUser\\My','Cert:\\LocalMachine\\My' -ErrorAction SilentlyContinue |
              Where-Object { \$_.EnhancedKeyUsageList -like '*Code Signing*' } |
              Select-Object Subject, Issuer, Thumbprint, HasPrivateKey, NotAfter |
              Format-Table -AutoSize
          "
          
          echo ""
          echo "=== PKCS#11 Library Check ==="
          if [ -f "/c/Windows/System32/SimplySignPKCS.dll" ]; then
            echo "PKCS#11 library present: /c/Windows/System32/SimplySignPKCS.dll"
            ls -la "/c/Windows/System32/SimplySignPKCS.dll"
          else
            echo "PKCS#11 library not found"
          fi
          
          echo ""
          echo "=== SimplySign Desktop Status ==="
          powershell -Command "
            Write-Host 'SimplySign Desktop process status:'
            Get-Process -Name '*SimplySign*' -ErrorAction SilentlyContinue |
              Select-Object Name, Id, MainWindowTitle, Responding |
              Format-Table -AutoSize
          "
          
          echo ""
          echo "Certificate debugging completed - proceeding to signing..."
          echo ""
          
          # Sign all Windows Tauri binaries
          powershell -ExecutionPolicy Bypass -File "./.github/scripts/Sign-Tauri-Windows.ps1"
          
          echo "Windows binary signing completed"
        shell: bash

      - name: Notarize macOS app (macOS only)
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
        run: |
          # Skip if certificate is not available
          if [[ -z "$APPLE_CERTIFICATE_P12" ]]; then
            echo "Apple Developer certificate not available, skipping notarization"
            exit 0
          fi
          
          # Find the .app bundle
          APP_PATH=$(find ./tauri/src-tauri/target/${{ matrix.target }}/release/bundle/macos -name "*.app" | head -1)
          
          if [[ -n "$APP_PATH" ]]; then
            echo "=== Starting Tauri app notarization ==="
            echo "App path: $APP_PATH"
            echo "Target: ${{ matrix.target }}"
            echo "Timestamp: $(date)"
            echo "NOTE: Python binary was already notarized in the previous workflow"
            
            # Create a zip file for notarization
            echo "Creating zip file for notarization..."
            ditto -c -k --keepParent "$APP_PATH" "DocuScope CA.zip"
            echo "Zip file created: DocuScope CA.zip ($(ls -lh 'DocuScope CA.zip' | awk '{print $5}'))"
            
            # Submit for notarization with detailed feedback
            echo "=== Submitting Tauri app for notarization ==="
            echo "This should be faster since the Python binary is already notarized"
            echo "Apple ID: $APPLE_ID"
            echo "Team ID: $APPLE_TEAM_ID"
            echo "Submission time: $(date)"
            echo ""
            
            # Submit without --wait first to get submission ID
            echo "Submitting to Apple notarization service..."
            SUBMISSION_OUTPUT=$(xcrun notarytool submit "DocuScope CA.zip" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --output-format json)
            
            echo "Submission response:"
            echo "$SUBMISSION_OUTPUT"
            
            # Extract submission ID
            SUBMISSION_ID=$(echo "$SUBMISSION_OUTPUT" | grep -o '"id":"[^"]*"' | cut -d'"' -f4)
            echo "Submission ID: $SUBMISSION_ID"
            
            if [[ -n "$SUBMISSION_ID" ]]; then
              echo "=== Monitoring Tauri app notarization progress ==="
              echo "Checking status every 60 seconds..."
              
              while true; do
                STATUS_OUTPUT=$(xcrun notarytool info "$SUBMISSION_ID" \
                  --apple-id "$APPLE_ID" \
                  --password "$APPLE_PASSWORD" \
                  --team-id "$APPLE_TEAM_ID" \
                  --output-format json)
                
                STATUS=$(echo "$STATUS_OUTPUT" | grep -o '"status":"[^"]*"' | cut -d'"' -f4)
                echo "$(date): Status = $STATUS"
                
                case "$STATUS" in
                  "Accepted")
                    echo "=== Tauri app notarization SUCCESSFUL ==="
                    echo "Stapling notarization to app bundle..."
                    echo "NOTE: For .app bundles, we staple the app directly (not the zip)"
                    xcrun stapler staple "$APP_PATH"
                    echo "Verifying stapled app bundle..."
                    xcrun stapler validate "$APP_PATH"
                    echo "App bundle notarization stapled and verified successfully"
                    echo "Both Python binary and Tauri app are now fully notarized!"
                    break
                    ;;
                  "Rejected")
                    echo "=== Tauri app notarization FAILED ==="
                    echo "Full status output:"
                    echo "$STATUS_OUTPUT"
                    echo "Getting detailed log..."
                    xcrun notarytool log "$SUBMISSION_ID" \
                      --apple-id "$APPLE_ID" \
                      --password "$APPLE_PASSWORD" \
                      --team-id "$APPLE_TEAM_ID"
                    exit 1
                    ;;
                  "In Progress")
                    echo "$(date): Still processing... waiting 60 seconds"
                    sleep 60
                    ;;
                  *)
                    echo "$(date): Unknown status '$STATUS', waiting 60 seconds"
                    sleep 60
                    ;;
                esac
              done
            else
              echo "ERROR: Could not extract submission ID from response"
              exit 1
            fi
            
            # Clean up
            rm "DocuScope CA.zip"
            echo "=== Tauri app notarization process completed ==="
          else
            echo "No .app bundle found for notarization"
          fi

      - name: Update DMG with notarized app (macOS only)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
        run: |
          # Skip if certificate is not available
          if [[ -z "$APPLE_CERTIFICATE_P12" ]]; then
            echo "Apple Developer certificate not available, skipping DMG update"
            exit 0
          fi
          
          # Find the notarized standalone .app
          APP_PATH=$(find ./tauri/src-tauri/target/${{ matrix.target }}/release/bundle/macos -name "*.app" | head -1)
          
          # Find the DMG created by Tauri
          DMG_PATH=$(find ./tauri/src-tauri/target/${{ matrix.target }}/release/bundle/dmg -name "*.dmg" | head -1)
          
          if [[ -n "$APP_PATH" && -n "$DMG_PATH" ]]; then
            echo "=== Updating DMG with notarized app ==="
            echo "Notarized app: $APP_PATH"
            echo "Original DMG: $DMG_PATH"
            echo "Timestamp: $(date)"
            
            # Create temporary directory for DMG operations
            mkdir -p dmg-temp
            
            # Convert DMG to read-write format first (in case it's read-only)
            echo "Converting DMG to read-write format..."
            hdiutil convert "$DMG_PATH" -format UDRW -o "dmg-temp/temp-rw.dmg"
            
            # Mount the read-write DMG
            echo "Mounting DMG for update..."
            hdiutil attach "dmg-temp/temp-rw.dmg" -readwrite -mountpoint "dmg-temp/mount"
            
            # Remove the original (non-notarized) app from DMG
            echo "Removing original app from DMG..."
            rm -rf "dmg-temp/mount/DocuScope CA.app"
            
            # Copy the notarized app into the DMG
            echo "Copying notarized app into DMG..."
            cp -R "$APP_PATH" "dmg-temp/mount/"
            
            # Unmount the DMG
            echo "Unmounting updated DMG..."
            hdiutil detach "dmg-temp/mount"
            
            # Convert back to compressed read-only format and replace original
            echo "Converting back to compressed format..."
            hdiutil convert "dmg-temp/temp-rw.dmg" -format UDZO -o "dmg-temp/final.dmg"
            mv "dmg-temp/final.dmg" "$DMG_PATH"
            
            echo "=== DMG updated with notarized app ==="
            
            # Verify the updated DMG contains notarized app
            echo "=== Verifying updated DMG ==="
            hdiutil attach "$DMG_PATH" -readonly -mountpoint "dmg-temp/verify"
            
            if spctl -a -t exec -vv "dmg-temp/verify/DocuScope CA.app"; then
              echo "✅ DMG now contains properly notarized app"
              echo "✅ Notarization verification: PASSED"
            else
              echo "❌ DMG app verification failed"
              echo "❌ Notarization verification: FAILED"
              # Don't exit 1 here - let's see what we can learn
            fi
            
            # Additional verification - check if stapler ticket is present
            echo "=== Checking for stapler ticket in DMG app ==="
            if xcrun stapler validate "dmg-temp/verify/DocuScope CA.app" 2>/dev/null; then
              echo "✅ Stapler ticket found in DMG app"
            else
              echo "⚠️  Stapler ticket not found in DMG app (this might be expected)"
            fi
            
            hdiutil detach "dmg-temp/verify"
            
            # Clean up temporary files
            rm -rf dmg-temp
            
            echo "=== DMG update process completed successfully ==="
            echo "Final DMG: $DMG_PATH"
            echo "The DMG now contains the same notarized app bundle that was individually verified"
          else
            echo "Could not find required .app or .dmg files for DMG update"
            if [[ -z "$APP_PATH" ]]; then
              echo "Missing: Notarized .app bundle"
            fi
            if [[ -z "$DMG_PATH" ]]; then
              echo "Missing: Original DMG file"
            fi
          fi

      - name: Upload Tauri artifacts (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: docuscope-ca-desktop-${{ matrix.target }}
          path: |
            tauri/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            tauri/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          retention-days: 30

      - name: Upload Tauri artifacts (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: docuscope-ca-desktop-${{ matrix.target }}
          path: |
            tauri/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            tauri/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
          retention-days: 30

      - name: Upload Tauri artifacts (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: docuscope-ca-desktop-${{ matrix.target }}
          path: |
            tauri/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            tauri/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
          retention-days: 30
        # Note: Both the standalone .app and the DMG now contain the same notarized app bundle

  create-release:
    if: always() && needs.build-tauri.result == 'success'
    needs: build-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if this is a tag-triggered build
        id: check-tag
        run: |
          # Check if any tag exists at the current commit
          CURRENT_TAG=$(git tag --points-at HEAD | grep '^v' | head -1)
          if [[ -n "$CURRENT_TAG" ]]; then
            echo "Found tag: $CURRENT_TAG"
            echo "is-tag=true" >> $GITHUB_OUTPUT
            echo "tag-name=$CURRENT_TAG" >> $GITHUB_OUTPUT
          else
            echo "No version tag found at current commit"
            echo "is-tag=false" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        if: steps.check-tag.outputs.is-tag == 'true'
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        if: steps.check-tag.outputs.is-tag == 'true'
        run: |
          echo "=== Downloaded artifacts ==="
          find ./artifacts -type f -ls
          echo "=== Artifact summary ==="
          echo "DEB files: $(find ./artifacts -name "*.deb" | wc -l)"
          echo "AppImage files: $(find ./artifacts -name "*.AppImage" | wc -l)"
          echo "EXE files: $(find ./artifacts -name "*.exe" | wc -l)"
          echo "MSI files: $(find ./artifacts -name "*.msi" | wc -l)"
          echo "DMG files: $(find ./artifacts -name "*.dmg" | wc -l)"

      - name: Get version from pyproject.toml
        if: steps.check-tag.outputs.is-tag == 'true'
        id: get_version
        run: |
          version=$(grep "^version" pyproject.toml | head -1 | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create release changelog
        if: steps.check-tag.outputs.is-tag == 'true'
        run: |
          # Install git-cliff using curl for more reliable installation
          curl -L https://github.com/orhun/git-cliff/releases/download/v2.4.0/git-cliff-2.4.0-x86_64-unknown-linux-gnu.tar.gz | tar -xz
          chmod +x git-cliff-2.4.0/git-cliff
          ./git-cliff-2.4.0/git-cliff --latest > RELEASE_CHANGELOG.md || echo "# Release v${{ steps.get_version.outputs.version }}" > RELEASE_CHANGELOG.md

      - name: Create GitHub Release
        if: steps.check-tag.outputs.is-tag == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check-tag.outputs.tag-name }}
          name: DocuScope CA Desktop v${{ steps.get_version.outputs.version }}
          body_path: RELEASE_CHANGELOG.md
          files: ./artifacts/**/*
          draft: false
          prerelease: false
