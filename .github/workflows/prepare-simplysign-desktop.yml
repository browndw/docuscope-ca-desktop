name: Prepare SimplySign Desktop

on:
  workflow_dispatch:
    inputs:
      debug:
        description: 'Enable debug mode'
        required: false
        default: false
        type: boolean

jobs:
  prepare-simplysign:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install SimplySign Desktop
      run: |
        chmod +x ./.github/scripts/install-simplysign-bundle.sh
        ./.github/scripts/install-simplysign-bundle.sh
      shell: bash

    - name: Configure Automatic Authentication
      run: |
        chmod +x ./.github/scripts/configure-auto-auth.sh
        ./.github/scripts/configure-auto-auth.sh
      shell: bash

    - name: Package SimplySign Desktop
      run: |
        chmod +x ./.github/scripts/package-simplysign-bundle.sh
        ./.github/scripts/package-simplysign-bundle.sh
      shell: bash

    - name: Verify OAuth2 Dialog Detection
      run: |
        # Extract the package for verification
        unzip -q simplysign-desktop-package.zip
        # Test OAuth2 dialog detection
        chmod +x ./.github/scripts/verify-oauth2-dialog.sh
        ./.github/scripts/verify-oauth2-dialog.sh
      shell: bash
      continue-on-error: true

    - name: Upload SimplySign Desktop Artifact
      uses: actions/upload-artifact@v4
      with:
        name: simplysign-desktop-configured
        path: simplysign-desktop-package.zip
        retention-days: 7
        compression-level: 9
