name: Test Real Code Signing

on:
  workflow_dispatch:
  # Trigger after python binary build completes
  workflow_run:
    workflows: ["Build Python Binary"]
    types: [completed]
    branches: [main]

defaults:
  run:
    shell: bash

jobs:
  build-and-test-signing:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11.9"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v3
        with:
          path: .venv
          key: venv-${{ runner.os }}-3.11.9-${{ hashFiles('**/poetry.lock') }}

      - name: Cache PyInstaller build
        uses: actions/cache@v3
        with:
          path: |
            build/
            dist/
          key: pyinstaller-${{ runner.os }}-x86_64-pc-windows-msvc-${{ hashFiles('entrypoint.py', 'entrypoint.spec', 'requirements-deploy.txt') }}
          restore-keys: |
            pyinstaller-${{ runner.os }}-x86_64-pc-windows-msvc-

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root --with build

      - name: Build Python package
        run: poetry build

      - name: Install deployment requirements
        run: |
          poetry run pip install -r requirements-deploy.txt
          poetry run pip install pyinstaller

      - name: Create PyInstaller binary
        run: |
          echo "=== BUILDING PYTHON EXECUTABLE FOR SIGNING TEST ==="
          echo "Starting PyInstaller build..."
          echo "This may take several minutes, please be patient..."
          
          # Run PyInstaller with progress monitoring
          poetry run pyinstaller entrypoint.spec --log-level=WARN --noconfirm &
          PYINSTALLER_PID=$!
          
          # Monitor progress
          while kill -0 $PYINSTALLER_PID 2>/dev/null; do
            echo "PyInstaller build still running... ($(date))"
            sleep 30
          done
          
          # Wait for the process to complete
          wait $PYINSTALLER_PID
          PYINSTALLER_EXIT_CODE=$?
          
          if [ $PYINSTALLER_EXIT_CODE -eq 0 ]; then
            echo "✅ PyInstaller build completed successfully"
          else
            echo "❌ PyInstaller build failed with exit code $PYINSTALLER_EXIT_CODE"
            exit $PYINSTALLER_EXIT_CODE
          fi

      - name: Verify and prepare test binary
        run: |
          echo "=== PREPARING TEST BINARY ==="
          
          # Check for Windows executable
          if [ -f "./dist/entrypoint.exe" ]; then
            echo "✅ Windows executable created successfully"
            ls -la ./dist/entrypoint.exe
            echo "File size: $(ls -lh ./dist/entrypoint.exe | awk '{print $5}')"
            
            # Test basic execution
            echo "Testing executable functionality..."
            timeout 15 ./dist/entrypoint.exe --version 2>&1 || echo "Version test completed"
            
            # Create our signing target
            cp ./dist/entrypoint.exe ./docuscope-test-signing.exe
            echo "✅ Created signing target: docuscope-test-signing.exe"
            
          elif [ -f "./dist/entrypoint" ]; then
            echo "⚠️ Found Unix-style executable, copying for Windows test"
            cp ./dist/entrypoint ./docuscope-test-signing.exe
            
          else
            echo "❌ No executable found in dist directory!"
            echo "Contents of dist directory:"
            ls -la ./dist/
            exit 1
          fi
          
          echo "✅ Test binary ready for code signing"

      - name: Install SimplySign Desktop
        env:
          CERTUM_USERNAME: ${{ secrets.CERTUM_USERNAME }}
          CERTUM_PASSWORD: ${{ secrets.CERTUM_PASSWORD }}
          CERTUM_CERTIFICATE_SHA1: ${{ secrets.CERTUM_CERTIFICATE_SHA1 }}
        run: |
          echo "=== INSTALLING SIMPLYSIGN DESKTOP ==="
          echo "Using proven installation method from successful testing..."
          
          # Download SimplySign Desktop MSI
          CERTUM_INSTALLER="SimplySignDesktop.msi"
          echo "Downloading SimplySign Desktop MSI..."
          
          if curl -L "https://www.files.certum.eu/software/SimplySignDesktop/Windows/9.3.2.66/SimplySignDesktop-9.3.2.66-64-bit-en.msi" -o "$CERTUM_INSTALLER" --fail --max-time 60; then
            echo "✅ Downloaded SimplySign Desktop MSI ($(ls -lh "$CERTUM_INSTALLER" | awk '{print $5}'))"
          else
            echo "❌ Failed to download SimplySign Desktop"
            exit 1
          fi
          
          # Install with proven method (matching successful test)
          echo "Installing SimplySign Desktop..."
          echo "Full command: msiexec /i \"$CERTUM_INSTALLER\" /quiet /norestart /l*v install.log ALLUSERS=1 REBOOT=ReallySuppress"
          
          # Check for administrative privileges (like the successful test)
          ADMIN_RIGHTS=false
          if powershell -Command "([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)" 2>/dev/null; then
            echo "✅ Running with administrative privileges"
            ADMIN_RIGHTS=true
          else
            echo "⚠️ No explicit administrative privileges detected"
          fi
          
          # Use the exact method that worked: PowerShell with admin privileges
          if [ "$ADMIN_RIGHTS" = true ]; then
            echo "Running MSI installation with administrator privileges..."
            powershell -Command "Start-Process -FilePath 'msiexec.exe' -ArgumentList '/i', '\"$CERTUM_INSTALLER\"', '/quiet', '/norestart', '/l*v', 'install.log', 'ALLUSERS=1', 'REBOOT=ReallySuppress' -Wait -NoNewWindow -PassThru" &
            INSTALL_PID=$!
          else
            echo "Running MSI installation without explicit admin elevation..."
            timeout 300 msiexec /i "$CERTUM_INSTALLER" /quiet /norestart /l*v install.log ALLUSERS=1 REBOOT=ReallySuppress &
            INSTALL_PID=$!
          fi
          
          # Monitor with the same logic as successful test
          echo "Monitoring installation progress..."
          INSTALL_START_TIME=$(date +%s)
          sleep 10
          
          # Check if msiexec process is actually running (like successful test)
          if kill -0 $INSTALL_PID 2>/dev/null; then
            echo "MSI installation process is running (PID: $INSTALL_PID)"
            
            # Monitor for up to 3 minutes with status updates
            for i in {1..18}; do
              sleep 10
              CURRENT_TIME=$(date +%s)
              ELAPSED=$((CURRENT_TIME - INSTALL_START_TIME))
              
              if kill -0 $INSTALL_PID 2>/dev/null; then
                echo "Installation still running after ${ELAPSED} seconds..."
                
                # Check log file growth
                if [ -f "install.log" ]; then
                  LOG_SIZE=$(stat -c%s "install.log" 2>/dev/null || stat -f%z "install.log" 2>/dev/null || echo 0)
                  echo "  Log file size: $LOG_SIZE bytes"
                fi
              else
                echo "MSI installation completed after ${ELAPSED} seconds"
                break
              fi
            done
            
            # Final wait if still running
            if kill -0 $INSTALL_PID 2>/dev/null; then
              echo "Installation taking longer, waiting for completion..."
              wait $INSTALL_PID 2>/dev/null || echo "Installation process ended"
            fi
          else
            echo "MSI installation process ended quickly"
          fi
          
          # Quick success check using proven patterns
          INSTALLATION_SUCCESSFUL=false
          if [ -f "install.log" ]; then
            if grep -qi "Installation.*operation.*completed.*successfully\|Installation.*success.*or.*error.*status.*0\|MainEngineThread.*is.*returning.*0\|Windows.*Installer.*installed.*the.*product" install.log 2>/dev/null; then
              echo "✅ Installation successful (confirmed by log patterns)"
              INSTALLATION_SUCCESSFUL=true
            fi
          fi
          
          # Verify installation directory
          INSTALL_PATH="/c/Program Files/Certum/SimplySign Desktop"
          if [ -d "$INSTALL_PATH" ]; then
            echo "✅ SimplySign Desktop installed successfully"
            echo "✅ Virtual card emulation now active for code signing"
            INSTALLATION_SUCCESSFUL=true
          fi
          
          if [ "$INSTALLATION_SUCCESSFUL" = false ]; then
            echo "❌ Installation verification failed"
            echo "Last 10 lines of install log:"
            tail -10 install.log 2>/dev/null || echo "No install log available"
            exit 1
          fi

      - name: Test Certificate Access
        env:
          CERTUM_USERNAME: ${{ secrets.CERTUM_USERNAME }}
          CERTUM_PASSWORD: ${{ secrets.CERTUM_PASSWORD }}
          CERTUM_CERTIFICATE_SHA1: ${{ secrets.CERTUM_CERTIFICATE_SHA1 }}
        run: |
          echo "=== TESTING CERTIFICATE ACCESS ==="
          
          # Quick credential check
          if [[ -n "$CERTUM_USERNAME" && -n "$CERTUM_PASSWORD" && -n "$CERTUM_CERTIFICATE_SHA1" ]]; then
            echo "✅ All required credentials configured"
            echo "Target certificate SHA1: $CERTUM_CERTIFICATE_SHA1"
          else
            echo "⚠️ Missing credentials - will test with available certificates"
          fi
          
          # Check certificate stores (simplified)
          echo "Checking Windows Certificate Stores..."
          CERT_COUNT=$(powershell -Command "try { (Get-ChildItem -Path 'Cert:\\CurrentUser\\My' | Measure-Object).Count } catch { 0 }" 2>/dev/null || echo "0")
          echo "CurrentUser certificates: $CERT_COUNT"
          
          # Look for target certificate if provided
          if [[ -n "$CERTUM_CERTIFICATE_SHA1" ]]; then
            echo "Searching for target certificate..."
            CERT_FOUND=$(powershell -Command "Get-ChildItem -Path 'Cert:\\CurrentUser\\My' | Where-Object { \$_.Thumbprint -eq '$CERTUM_CERTIFICATE_SHA1' }" 2>/dev/null)
            if [ -n "$CERT_FOUND" ]; then
              echo "✅ Target certificate found in store!"
            else
              echo "⚠️ Target certificate not yet in store (may require authentication)"
            fi
          fi
          
          echo "✅ Certificate access test completed"

      - name: Authenticate with Certum Cloud Service
        env:
          CERTUM_USERNAME: ${{ secrets.CERTUM_USERNAME }}
          CERTUM_PASSWORD: ${{ secrets.CERTUM_PASSWORD }}
          CERTUM_CERTIFICATE_SHA1: ${{ secrets.CERTUM_CERTIFICATE_SHA1 }}
        run: |
          echo "=== AUTHENTICATING WITH CERTUM CLOUD SERVICE ==="
          
          if [[ -n "$CERTUM_USERNAME" && -n "$CERTUM_PASSWORD" ]]; then
            echo "✅ Credentials available - attempting cloud authentication"
            
            # Find SimplySign Desktop executable
            SIMPLYSIGN_EXE="/c/Program Files/Certum/SimplySign Desktop/SimplySignDesktop.exe"
            
            if [ -f "$SIMPLYSIGN_EXE" ]; then
              echo "✅ Found SimplySign Desktop: $SIMPLYSIGN_EXE"
              
              echo "Starting SimplySign Desktop for authentication..."
              # Start SimplySign Desktop in background to establish connection
              "$SIMPLYSIGN_EXE" &
              SIMPLYSIGN_PID=$!
              
              echo "Waiting for SimplySign Desktop to initialize..."
              sleep 15
              
              # Check if the process is running
              if kill -0 $SIMPLYSIGN_PID 2>/dev/null; then
                echo "✅ SimplySign Desktop is running (PID: $SIMPLYSIGN_PID)"
                
                # Try to authenticate using PowerShell and Windows Certificate Store
                echo "Attempting to authenticate and load certificates..."
                
                # Method 1: Try to trigger certificate loading via PowerShell
                echo "Method 1: Attempting certificate import via PowerShell..."
                powershell -Command "
                  try {
                    # Add certificate store refresh
                    \$store = New-Object System.Security.Cryptography.X509Certificates.X509Store('My', 'CurrentUser')
                    \$store.Open('ReadWrite')
                    \$store.Close()
                    
                    # Force refresh of certificate stores
                    Get-ChildItem -Path 'Cert:\\CurrentUser\\My' -Recurse | Out-Null
                    Get-ChildItem -Path 'Cert:\\LocalMachine\\My' -Recurse | Out-Null
                    
                    Write-Host 'Certificate store refresh completed'
                  } catch {
                    Write-Host 'Certificate refresh failed: ' \$_.Exception.Message
                  }
                "
                
                # Method 2: Try SimplySign Desktop command line authentication
                echo "Method 2: Attempting SimplySign Desktop CLI authentication..."
                
                # Try to use SimplySign CLI for authentication if available
                SIMPLYSIGN_CLI="/c/Program Files/Certum/SimplySign Desktop/proCertum SmartSign/proCertumCardManager.exe"
                if [ -f "$SIMPLYSIGN_CLI" ]; then
                  echo "Found SimplySign CLI: $SIMPLYSIGN_CLI"
                  echo "Attempting CLI authentication..."
                  timeout 30 "$SIMPLYSIGN_CLI" --help 2>&1 | head -10 || echo "CLI help completed"
                fi
                
                # Method 2b: Try manual authentication with credentials
                if [[ -n "$CERTUM_USERNAME" && -n "$CERTUM_PASSWORD" ]]; then
                  echo "Method 2b: Attempting manual authentication with credentials..."
                  
                  # Try to create a simple authentication request
                  echo "Testing credential format..."
                  echo "Username length: ${#CERTUM_USERNAME}"
                  echo "Password configured: $([ -n "$CERTUM_PASSWORD" ] && echo "Yes" || echo "No")"
                  echo "Certificate SHA1 configured: $([ -n "$CERTUM_CERTIFICATE_SHA1" ] && echo "Yes" || echo "No")"
                  
                  # Look for any Certum-specific configuration or authentication tools
                  CERTUM_CONFIG_PATHS=(
                    "/c/Program Files/Certum/SimplySign Desktop/config"
                    "/c/Users/$USER/AppData/Local/Certum"
                    "/c/Users/$USER/AppData/Roaming/Certum"
                    "/c/ProgramData/Certum"
                  )
                  
                  echo "Checking for Certum configuration directories..."
                  for config_path in "${CERTUM_CONFIG_PATHS[@]}"; do
                    if [ -d "$config_path" ]; then
                      echo "Found: $config_path"
                      ls -la "$config_path" 2>/dev/null | head -5 || echo "  (empty or no access)"
                    fi
                  done
                fi
                
                # Method 3: Try to trigger authentication through Java application
                JAVA_APP="/c/Program Files/Certum/SimplySign Desktop/proCertum SmartSign/proCertumCardManager.jar"
                JAVA_EXE="/c/Program Files/Certum/SimplySign Desktop/proCertum SmartSign/jre/bin/java.exe"
                if [ -f "$JAVA_APP" ] && [ -f "$JAVA_EXE" ]; then
                  echo "Method 3: Attempting Java-based authentication..."
                  echo "Command: java -jar proCertumCardManager.jar"
                  cd "/c/Program Files/Certum/SimplySign Desktop/proCertum SmartSign"
                  timeout 30 "$JAVA_EXE" -jar proCertumCardManager.jar --help 2>&1 | head -10 || echo "Java auth attempt completed"
                  cd - > /dev/null
                fi
                
                # Method 4: Extended wait with periodic certificate store checks
                echo "Method 4: Extended authentication with monitoring..."
                for i in {1..6}; do
                  echo "Authentication attempt $i/6..."
                  sleep 10
                  
                  # Check certificate stores
                  CERT_COUNT_CU=$(powershell -Command "try { (Get-ChildItem -Path 'Cert:\\CurrentUser\\My' | Measure-Object).Count } catch { 0 }" 2>/dev/null || echo "0")
                  CERT_COUNT_LM=$(powershell -Command "try { (Get-ChildItem -Path 'Cert:\\LocalMachine\\My' | Measure-Object).Count } catch { 0 }" 2>/dev/null || echo "0")
                  
                  echo "  CurrentUser certificates: $CERT_COUNT_CU"
                  echo "  LocalMachine certificates: $CERT_COUNT_LM"
                  
                  # Check for target certificate
                  if [[ -n "$CERTUM_CERTIFICATE_SHA1" ]]; then
                    TARGET_FOUND=$(powershell -Command "
                      \$cert1 = Get-ChildItem -Path 'Cert:\\CurrentUser\\My' | Where-Object { \$_.Thumbprint -eq '$CERTUM_CERTIFICATE_SHA1' }
                      \$cert2 = Get-ChildItem -Path 'Cert:\\LocalMachine\\My' | Where-Object { \$_.Thumbprint -eq '$CERTUM_CERTIFICATE_SHA1' }
                      if (\$cert1 -or \$cert2) { 'FOUND' } else { 'NOT_FOUND' }
                    " 2>/dev/null || echo "NOT_FOUND")
                    
                    if [ "$TARGET_FOUND" = "FOUND" ]; then
                      echo "  ✅ Target certificate detected! Breaking authentication loop."
                      break
                    fi
                  fi
                  
                  # Try to refresh certificate stores
                  if [ $((i % 2)) -eq 0 ]; then
                    echo "  Refreshing certificate stores..."
                    powershell -Command "
                      try {
                        Get-ChildItem -Path 'Cert:\\CurrentUser\\My' -Recurse | Out-Null
                        Get-ChildItem -Path 'Cert:\\LocalMachine\\My' -Recurse | Out-Null
                        Write-Host '  Certificate store refresh completed'
                      } catch {
                        Write-Host '  Certificate refresh failed: ' \$_.Exception.Message
                      }
                    "
                  fi
                done
                
                # Final certificate count check
                echo "Final authentication results:"
                CERT_COUNT_AFTER=$(powershell -Command "try { (Get-ChildItem -Path 'Cert:\\CurrentUser\\My' | Measure-Object).Count } catch { 0 }" 2>/dev/null || echo "0")
                echo "Certificate count after auth: $CERT_COUNT_AFTER"
                
                # Also check LocalMachine store
                CERT_COUNT_LM=$(powershell -Command "try { (Get-ChildItem -Path 'Cert:\\LocalMachine\\My' | Measure-Object).Count } catch { 0 }" 2>/dev/null || echo "0")
                echo "LocalMachine certificate count: $CERT_COUNT_LM"
                
                if [[ -n "$CERTUM_CERTIFICATE_SHA1" ]]; then
                  echo "Searching for target certificate after authentication..."
                  
                  # Check both CurrentUser and LocalMachine stores
                  CERT_FOUND_AFTER=$(powershell -Command "
                    \$cert1 = Get-ChildItem -Path 'Cert:\\CurrentUser\\My' | Where-Object { \$_.Thumbprint -eq '$CERTUM_CERTIFICATE_SHA1' }
                    \$cert2 = Get-ChildItem -Path 'Cert:\\LocalMachine\\My' | Where-Object { \$_.Thumbprint -eq '$CERTUM_CERTIFICATE_SHA1' }
                    if (\$cert1) { \$cert1 } elseif (\$cert2) { \$cert2 }
                  " 2>/dev/null)
                  
                  if [ -n "$CERT_FOUND_AFTER" ]; then
                    echo "✅ Target certificate now available after authentication!"
                    powershell -Command "
                      \$cert1 = Get-ChildItem -Path 'Cert:\\CurrentUser\\My' | Where-Object { \$_.Thumbprint -eq '$CERTUM_CERTIFICATE_SHA1' }
                      \$cert2 = Get-ChildItem -Path 'Cert:\\LocalMachine\\My' | Where-Object { \$_.Thumbprint -eq '$CERTUM_CERTIFICATE_SHA1' }
                      if (\$cert1) { \$cert1 | Format-Table Subject, Thumbprint, NotAfter }
                      if (\$cert2) { \$cert2 | Format-Table Subject, Thumbprint, NotAfter }
                    " 2>/dev/null
                  else
                    echo "⚠️ Target certificate still not accessible"
                    
                    # Show what certificates ARE available
                    echo "Available certificates in CurrentUser store:"
                    powershell -Command "Get-ChildItem -Path 'Cert:\\CurrentUser\\My' | Format-Table Subject, Thumbprint, NotAfter" 2>/dev/null || echo "None found"
                    
                    echo "Available certificates in LocalMachine store:"
                    powershell -Command "Get-ChildItem -Path 'Cert:\\LocalMachine\\My' | Format-Table Subject, Thumbprint, NotAfter" 2>/dev/null || echo "None found"
                    
                    # Try alternative authentication methods
                    echo "Attempting alternative authentication..."
                    
                    # Method 3: Try to use SimplySign command line if available
                    PROCERTUM_PATH="/c/Program Files/Certum/SimplySign Desktop/proCertum SmartSign"
                    if [ -d "$PROCERTUM_PATH" ]; then
                      echo "Found proCertum SmartSign directory, checking for command line tools..."
                      find "$PROCERTUM_PATH" -name "*.exe" | head -5
                    fi
                  fi
                fi
                
                # Keep SimplySign running for signing process
                echo "✅ SimplySign Desktop authenticated and ready for signing"
                
              else
                echo "⚠️ SimplySign Desktop process ended quickly"
              fi
              
            else
              echo "❌ SimplySign Desktop executable not found"
            fi
            
          else
            echo "⚠️ Missing Certum credentials - skipping cloud authentication"
          fi

      - name: Test Code Signing with signtool.exe
        env:
          CERTUM_CERTIFICATE_SHA1: ${{ secrets.CERTUM_CERTIFICATE_SHA1 }}
        run: |
          echo "=== TESTING CODE SIGNING ==="
          echo "Testing code signing with Windows SDK signtool.exe..."
          
          # Find signtool.exe
          SIGNTOOL_LOCATIONS=(
            "/c/Program Files (x86)/Windows Kits/10/bin/10.0.22621.0/x64/signtool.exe"
            "/c/Program Files (x86)/Windows Kits/10/bin/10.0.19041.0/x64/signtool.exe"
            "/c/Program Files (x86)/Windows Kits/10/bin/x64/signtool.exe"
          )
          
          SIGNTOOL_PATH=""
          for location in "${SIGNTOOL_LOCATIONS[@]}"; do
            if [ -f "$location" ]; then
              SIGNTOOL_PATH="$location"
              echo "✅ Found signtool.exe: $SIGNTOOL_PATH"
              break
            fi
          done
          
          if [ -z "$SIGNTOOL_PATH" ]; then
            echo "🔍 Searching for signtool.exe..."
            FOUND_SIGNTOOL=$(find "/c/Program Files (x86)/Windows Kits" -name "signtool.exe" 2>/dev/null | head -1)
            if [ -n "$FOUND_SIGNTOOL" ]; then
              SIGNTOOL_PATH="$FOUND_SIGNTOOL"
              echo "✅ Found signtool.exe: $SIGNTOOL_PATH"
            else
              echo "❌ signtool.exe not found - cannot test code signing"
              exit 1
            fi
          fi
          
          # Verify our test file exists
          if [ ! -f "docuscope-test-signing.exe" ]; then
            echo "❌ Test executable not found"
            exit 1
          fi
          
          echo "Target file: docuscope-test-signing.exe ($(ls -lh docuscope-test-signing.exe | awk '{print $5}'))"
          
          # Test 0: Basic signtool validation
          echo ""
          echo "🧪 Test 0: Basic signtool validation"
          echo "Testing signtool help and basic functionality..."
          
          "$SIGNTOOL_PATH" /? 2>&1 | head -10 || echo "Signtool help completed"
          
          # Test 1: Certificate enumeration with better error capture
          echo ""
          echo "🧪 Test 1: Certificate store enumeration"
          echo "Command: signtool sign /a /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /v docuscope-test-signing.exe"
          
          # Create a smaller test file first to avoid timeout issues
          echo "Creating smaller test file for initial validation..."
          echo "This is a test executable for code signing" > test-small.exe
          
          echo "Testing signtool with small file first..."
          
          # Test A: Simple command without timestamp
          echo "Test A: Simple signing without timestamp..."
          echo "Command: timeout 30 signtool.exe sign /a /fd SHA256 /v test-small.exe"
          
          set +e  # Don't exit on error
          SIMPLE_OUTPUT=$(timeout 30 "$SIGNTOOL_PATH" sign /a /fd SHA256 /v test-small.exe 2>&1)
          SIMPLE_EXIT_CODE=$?
          set -e  # Re-enable exit on error
          
          echo "Simple test exit code: $SIMPLE_EXIT_CODE"
          echo "Simple test output:"
          if [ -n "$SIMPLE_OUTPUT" ]; then
            echo "$SIMPLE_OUTPUT"
          else
            echo "⚠️ No output from simple signtool test"
          fi
          
          # Immediate certificate check after failure
          echo ""
          echo "🔍 IMMEDIATE CERTIFICATE DIAGNOSIS:"
          echo "Checking certificate stores immediately after signing failure..."
          
          CERT_COUNT_CU=$(powershell -Command "try { (Get-ChildItem -Path 'Cert:\\CurrentUser\\My' | Measure-Object).Count } catch { 0 }" 2>/dev/null || echo "0")
          CERT_COUNT_LM=$(powershell -Command "try { (Get-ChildItem -Path 'Cert:\\LocalMachine\\My' | Measure-Object).Count } catch { 0 }" 2>/dev/null || echo "0")
          
          echo "CurrentUser\\My certificates: $CERT_COUNT_CU"
          echo "LocalMachine\\My certificates: $CERT_COUNT_LM"
          
          # Quick certificate details
          if [ "$CERT_COUNT_CU" != "0" ]; then
            echo "CurrentUser certificates:"
            powershell -Command "Get-ChildItem -Path 'Cert:\\CurrentUser\\My' | Format-Table Subject, Thumbprint, HasPrivateKey -AutoSize" 2>/dev/null || echo "Error listing CurrentUser certs"
          fi
          
          if [ "$CERT_COUNT_LM" != "0" ]; then
            echo "LocalMachine certificates:"
            powershell -Command "Get-ChildItem -Path 'Cert:\\LocalMachine\\My' | Format-Table Subject, Thumbprint, HasPrivateKey -AutoSize" 2>/dev/null || echo "Error listing LocalMachine certs"
          fi
          
          # Check for code signing specific certificates
          echo "Code signing certificates check:"
          CS_CERTS=$(powershell -Command "
            \$cs1 = Get-ChildItem -Path 'Cert:\\CurrentUser\\My' | Where-Object { \$_.EnhancedKeyUsageList -like '*Code Signing*' } | Measure-Object | Select-Object -ExpandProperty Count
            \$cs2 = Get-ChildItem -Path 'Cert:\\LocalMachine\\My' | Where-Object { \$_.EnhancedKeyUsageList -like '*Code Signing*' } | Measure-Object | Select-Object -ExpandProperty Count
            Write-Host \"CurrentUser code signing certs: \$cs1\"
            Write-Host \"LocalMachine code signing certs: \$cs2\"
            \$cs1 + \$cs2
          " 2>/dev/null || echo "0")
          echo "Total code signing certificates: $CS_CERTS"
          
          # Test A2: Certificate enumeration diagnosis
          echo ""
          echo "Test A2: Certificate enumeration diagnosis..."
          echo "Checking what certificates signtool can see..."
          echo "Command: timeout 10 signtool.exe sign /a /fd SHA256 /v test-small.exe"
          
          # Run signtool with better error capture
          set +e  # Don't exit on error
          CERT_ENUM_OUTPUT=$(timeout 10 "$SIGNTOOL_PATH" sign /a /fd SHA256 /v test-small.exe 2>&1)
          CERT_ENUM_EXIT_CODE=$?
          set -e  # Re-enable exit on error
          
          echo "Certificate enumeration exit code: $CERT_ENUM_EXIT_CODE"
          echo "Certificate enumeration output (first 30 lines):"
          echo "$CERT_ENUM_OUTPUT" | head -30
          
          if [ -z "$CERT_ENUM_OUTPUT" ]; then
            echo "⚠️ No output from signtool - command may have failed silently"
          fi
          
          # Test A3: Direct certificate store check
          echo ""
          echo "Test A3: Direct certificate store verification..."
          echo "Running PowerShell certificate enumeration..."
          
          # Run PowerShell with better error handling
          set +e  # Don't exit on error
          POWERSHELL_OUTPUT=$(powershell -Command "
            try {
              Write-Host 'Starting certificate enumeration...'
              
              Write-Host 'CurrentUser\\\\My certificates:'
              \$cuCerts = Get-ChildItem -Path 'Cert:\\\\CurrentUser\\\\My' -ErrorAction SilentlyContinue
              if (\$cuCerts) {
                \$cuCerts | ForEach-Object {
                  Write-Host \"  Subject: \$(\$_.Subject)\"
                  Write-Host \"  Thumbprint: \$(\$_.Thumbprint)\"
                  Write-Host \"  HasPrivateKey: \$(\$_.HasPrivateKey)\"
                  Write-Host \"  NotAfter: \$(\$_.NotAfter)\"
                  try {
                    \$keyUsage = \$_.Extensions | Where-Object {\$_.Oid.FriendlyName -eq 'Key Usage'} | Select-Object -ExpandProperty Format -First 1
                    Write-Host \"  KeyUsage: \$keyUsage\"
                  } catch {
                    Write-Host \"  KeyUsage: Unable to read\"
                  }
                  try {
                    \$eku = \$_.EnhancedKeyUsageList -join ', '
                    Write-Host \"  EKU: \$eku\"
                  } catch {
                    Write-Host \"  EKU: Unable to read\"
                  }
                  Write-Host \"  ---\"
                }
              } else {
                Write-Host '  No certificates found in CurrentUser\\\\My'
              }
              
              Write-Host 'LocalMachine\\\\My certificates:'
              \$lmCerts = Get-ChildItem -Path 'Cert:\\\\LocalMachine\\\\My' -ErrorAction SilentlyContinue
              if (\$lmCerts) {
                \$lmCerts | ForEach-Object {
                  Write-Host \"  Subject: \$(\$_.Subject)\"
                  Write-Host \"  Thumbprint: \$(\$_.Thumbprint)\"
                  Write-Host \"  HasPrivateKey: \$(\$_.HasPrivateKey)\"
                  Write-Host \"  NotAfter: \$(\$_.NotAfter)\"
                  try {
                    \$keyUsage = \$_.Extensions | Where-Object {\$_.Oid.FriendlyName -eq 'Key Usage'} | Select-Object -ExpandProperty Format -First 1
                    Write-Host \"  KeyUsage: \$keyUsage\"
                  } catch {
                    Write-Host \"  KeyUsage: Unable to read\"
                  }
                  try {
                    \$eku = \$_.EnhancedKeyUsageList -join ', '
                    Write-Host \"  EKU: \$eku\"
                  } catch {
                    Write-Host \"  EKU: Unable to read\"
                  }
                  Write-Host \"  ---\"
                }
              } else {
                Write-Host '  No certificates found in LocalMachine\\\\My'
              }
              
              Write-Host 'Certificate enumeration completed successfully'
            } catch {
              Write-Host \"PowerShell certificate enumeration failed: \$(\$_.Exception.Message)\"
              Write-Host \"Error details: \$(\$_.Exception.ToString())\"
            }
          " 2>&1)
          POWERSHELL_EXIT_CODE=$?
          set -e  # Re-enable exit on error
          
          echo "PowerShell exit code: $POWERSHELL_EXIT_CODE"
          if [ -n "$POWERSHELL_OUTPUT" ]; then
            echo "PowerShell output:"
            echo "$POWERSHELL_OUTPUT"
          else
            echo "⚠️ No output from PowerShell certificate enumeration"
          fi
          
          # Test B: Check if /td parameter is supported
          echo ""
          echo "Test B: Testing timestamp digest parameter support..."
          echo "Command: signtool.exe sign /?"
          
          set +e  # Don't exit on error
          TD_SUPPORT_OUTPUT=$(timeout 10 "$SIGNTOOL_PATH" sign /? 2>&1)
          TD_HELP_EXIT_CODE=$?
          set -e  # Re-enable exit on error
          
          echo "Signtool help exit code: $TD_HELP_EXIT_CODE"
          if [ -n "$TD_SUPPORT_OUTPUT" ]; then
            echo "Checking for /td parameter in help..."
            TD_GREP_RESULT=$(echo "$TD_SUPPORT_OUTPUT" | grep -i "/td" || echo "No /td parameter found")
            echo "TD parameter support: $TD_GREP_RESULT"
            
            echo "Full help output (first 20 lines):"
            echo "$TD_SUPPORT_OUTPUT" | head -20
          else
            echo "⚠️ No output from signtool help command"
          fi
          
          # Test C: Try with different timestamp approach
          echo ""
          echo "Test C: Testing with basic timestamp (no /td)..."
          echo "Command: timeout 30 signtool.exe sign /a /fd SHA256 /tr http://timestamp.digicert.com /v test-small.exe"
          
          set +e  # Don't exit on error
          BASIC_TS_OUTPUT=$(timeout 30 "$SIGNTOOL_PATH" sign /a /fd SHA256 /tr http://timestamp.digicert.com /v test-small.exe 2>&1)
          BASIC_TS_EXIT_CODE=$?
          set -e  # Re-enable exit on error
          
          echo "Basic timestamp exit code: $BASIC_TS_EXIT_CODE"
          echo "Basic timestamp output:"
          if [ -n "$BASIC_TS_OUTPUT" ]; then
            echo "$BASIC_TS_OUTPUT"
          else
            echo "⚠️ No output from basic timestamp test"
          fi
          
          # Test C2: Try with correct timestamp parameter order
          echo ""
          echo "Test C2: Testing with corrected timestamp parameter order..."
          echo "Command: timeout 30 signtool.exe sign /a /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /v test-small.exe"
          
          set +e  # Don't exit on error
          CORRECTED_TS_OUTPUT=$(timeout 30 "$SIGNTOOL_PATH" sign /a /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /v test-small.exe 2>&1)
          CORRECTED_TS_EXIT_CODE=$?
          set -e  # Re-enable exit on error
          
          echo "Corrected timestamp exit code: $CORRECTED_TS_EXIT_CODE"
          echo "Corrected timestamp output:"
          if [ -n "$CORRECTED_TS_OUTPUT" ]; then
            echo "$CORRECTED_TS_OUTPUT"
          else
            echo "⚠️ No output from corrected timestamp test"
          fi
          
          # Test C3: Try without any timestamp to isolate certificate issues
          echo ""
          echo "Test C3: Testing without timestamp to isolate certificate availability..."
          echo "Command: timeout 30 signtool.exe sign /a /fd SHA256 /v test-small.exe"
          
          set +e  # Don't exit on error
          NO_TS_OUTPUT=$(timeout 30 "$SIGNTOOL_PATH" sign /a /fd SHA256 /v test-small.exe 2>&1)
          NO_TS_EXIT_CODE=$?
          set -e  # Re-enable exit on error
          
          echo "No timestamp exit code: $NO_TS_EXIT_CODE"
          echo "No timestamp output:"
          if [ -n "$NO_TS_OUTPUT" ]; then
            echo "$NO_TS_OUTPUT"
          else
            echo "⚠️ No output from no timestamp test"
          fi
          
          # Test C4: Try with different parameter syntax - space vs equals
          echo ""
          echo "Test C4: Testing parameter syntax variations..."
          echo "Command: timeout 30 signtool.exe sign /a /fd=SHA256 /v test-small.exe"
          
          set +e  # Don't exit on error
          EQUALS_SYNTAX_OUTPUT=$(timeout 30 "$SIGNTOOL_PATH" sign /a /fd=SHA256 /v test-small.exe 2>&1)
          EQUALS_SYNTAX_EXIT_CODE=$?
          set -e  # Re-enable exit on error
          
          echo "Equals syntax exit code: $EQUALS_SYNTAX_EXIT_CODE"
          echo "Equals syntax output:"
          if [ -n "$EQUALS_SYNTAX_OUTPUT" ]; then
            echo "$EQUALS_SYNTAX_OUTPUT"
          else
            echo "⚠️ No output from equals syntax test"
          fi
          
          # Test C5: Try with SHA1 digest algorithm (matching certificate)
          echo ""
          echo "Test C5: Testing with SHA1 digest algorithm..."
          echo "Command: timeout 30 signtool.exe sign /a /fd SHA1 /v test-small.exe"
          
          set +e  # Don't exit on error
          SHA1_DIGEST_OUTPUT=$(timeout 30 "$SIGNTOOL_PATH" sign /a /fd SHA1 /v test-small.exe 2>&1)
          SHA1_DIGEST_EXIT_CODE=$?
          set -e  # Re-enable exit on error
          
          echo "SHA1 digest exit code: $SHA1_DIGEST_EXIT_CODE"
          echo "SHA1 digest output:"
          if [ -n "$SHA1_DIGEST_OUTPUT" ]; then
            echo "$SHA1_DIGEST_OUTPUT"
          else
            echo "⚠️ No output from SHA1 digest test"
          fi
          
          # Test C6: Try completely minimal command
          echo ""
          echo "Test C6: Testing minimal signtool command..."
          echo "Command: timeout 30 signtool.exe sign /a test-small.exe"
          
          set +e  # Don't exit on error
          MINIMAL_OUTPUT=$(timeout 30 "$SIGNTOOL_PATH" sign /a test-small.exe 2>&1)
          MINIMAL_EXIT_CODE=$?
          set -e  # Re-enable exit on error
          
          echo "Minimal command exit code: $MINIMAL_EXIT_CODE"
          echo "Minimal command output:"
          if [ -n "$MINIMAL_OUTPUT" ]; then
            echo "$MINIMAL_OUTPUT"
          else
            echo "⚠️ No output from minimal command test"
          fi
          
          # Test C7: Check signtool version and default behavior
          echo ""
          echo "Test C7: Checking signtool version and default behavior..."
          echo "Command: signtool.exe /??"
          
          set +e  # Don't exit on error
          VERSION_OUTPUT=$("$SIGNTOOL_PATH" /? 2>&1 | head -5)
          VERSION_EXIT_CODE=$?
          set -e  # Re-enable exit on error
          
          echo "Version check exit code: $VERSION_EXIT_CODE"
          echo "Version output:"
          if [ -n "$VERSION_OUTPUT" ]; then
            echo "$VERSION_OUTPUT"
          else
            echo "⚠️ No version output"
          fi
          
          # Test C8: Try with explicit legacy SHA1 behavior
          echo ""
          echo "Test C8: Testing legacy SHA1 behavior (pre-SHA256 requirement)..."
          echo "Command: timeout 30 signtool.exe sign /a /fd sha1 test-small.exe"
          
          set +e  # Don't exit on error
          LEGACY_OUTPUT=$(timeout 30 "$SIGNTOOL_PATH" sign /a /fd sha1 test-small.exe 2>&1)
          LEGACY_EXIT_CODE=$?
          set -e  # Re-enable exit on error
          
          echo "Legacy SHA1 exit code: $LEGACY_EXIT_CODE"
          echo "Legacy SHA1 output:"
          if [ -n "$LEGACY_OUTPUT" ]; then
            echo "$LEGACY_OUTPUT"
          else
            echo "⚠️ No output from legacy SHA1 test"
          fi
          
          # Now test with the actual large file
          echo ""
          echo "Testing signtool with actual executable..."
          echo "Command: timeout 180 signtool.exe sign /a /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /v docuscope-test-enumeration.exe"
          
          # Create a copy for testing
          cp docuscope-test-signing.exe docuscope-test-enumeration.exe
          
          set +e  # Don't exit on error
          ENUMERATION_OUTPUT=$(timeout 180 "$SIGNTOOL_PATH" sign /a /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /v docuscope-test-enumeration.exe 2>&1)
          ENUMERATION_EXIT_CODE=$?
          set -e  # Re-enable exit on error
          
          echo "Full enumeration exit code: $ENUMERATION_EXIT_CODE"
          echo "Full enumeration output:"
          echo "$ENUMERATION_OUTPUT"
          
          # Check if enumeration found any certificates
          if echo "$ENUMERATION_OUTPUT" | grep -q "Successfully signed"; then
            echo "✅ Certificate enumeration succeeded - found suitable certificate!"
          elif echo "$ENUMERATION_OUTPUT" | grep -q "No certificates were found"; then
            echo "⚠️ No suitable certificates found for automatic signing"
          elif echo "$ENUMERATION_OUTPUT" | grep -q "No file digest algorithm specified"; then
            echo "❌ Signtool syntax error - need to fix command format"
          elif echo "$ENUMERATION_OUTPUT" | grep -q "Invalid timestamp server"; then
            echo "⚠️ Timestamp server issue - trying without timestamping"
            
            # Retry without timestamping
            echo "Retrying without timestamp server..."
            RETRY_OUTPUT=$(timeout 180 "$SIGNTOOL_PATH" sign /a /fd SHA256 /v docuscope-test-enumeration.exe 2>&1)
            echo "Retry output:"
            echo "$RETRY_OUTPUT" | head -30
          else
            echo "⚠️ Certificate enumeration completed with issues"
            echo "Exit code analysis needed - checking specific error patterns..."
          fi
          
          # Test 2: Specific certificate signing (if SHA1 provided)
          if [[ -n "$CERTUM_CERTIFICATE_SHA1" ]]; then
            echo ""
            echo "🧪 Test 2: Specific certificate signing"
            echo "Command: signtool sign /sha1 $CERTUM_CERTIFICATE_SHA1 /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /v docuscope-test-signing.exe"
            
            # Create a backup for testing
            cp docuscope-test-signing.exe docuscope-test-signing-backup.exe
            
            # Attempt signing with specific certificate
            SIGNING_OUTPUT=$(timeout 120 "$SIGNTOOL_PATH" sign /sha1 "$CERTUM_CERTIFICATE_SHA1" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /v docuscope-test-signing.exe 2>&1)
            echo "$SIGNING_OUTPUT" | head -50
            
            # Check if signing was successful
            if echo "$SIGNING_OUTPUT" | grep -q "Successfully signed"; then
              echo ""
              echo "✅ SIGNING SUCCESSFUL!"
              
              # Verify the signature
              echo ""
              echo "🔍 Verifying signature..."
              "$SIGNTOOL_PATH" verify /v docuscope-test-signing.exe 2>&1 | head -30 || echo "Verification completed"
              
              # Check file properties
              echo ""
              echo "📋 Signed file properties:"
              echo "File size: $(ls -lh docuscope-test-signing.exe | awk '{print $5}')"
              echo "Modification time: $(ls -l docuscope-test-signing.exe | awk '{print $6, $7, $8}')"
              
              # Get certificate details from signed file
              echo ""
              echo "📋 Certificate details from signed file:"
              powershell -Command "Get-AuthenticodeSignature 'docuscope-test-signing.exe' | Format-List" 2>/dev/null | head -20 || echo "Could not retrieve certificate details"
              
            else
              echo ""
              echo "⚠️ Signing failed or encountered issues"
              echo "Specific error analysis:"
              if echo "$SIGNING_OUTPUT" | grep -q "Cannot find a certificate matching the hash\|The specified certificate is not valid for signing"; then
                echo "- Certificate with SHA1 $CERTUM_CERTIFICATE_SHA1 not found in certificate stores"
                echo "- This indicates the Certum certificate has not been loaded properly"
                echo "- SimplySign Desktop may need interactive authentication"
              elif echo "$SIGNING_OUTPUT" | grep -q "SignerSign() failed\|private key is not available"; then
                echo "- Signing operation failed (private key not accessible)"
                echo "- This usually means authentication is required"
              elif echo "$SIGNING_OUTPUT" | grep -q "No file digest algorithm specified"; then
                echo "- Command syntax error (this should be fixed now)"
              else
                echo "- Other signing issue detected"
                echo "- Full error context needed for diagnosis"
              fi
            fi
          else
            echo ""
            echo "⚠️ CERTUM_CERTIFICATE_SHA1 not provided - testing with available certificates"
            
            # Test with any available certificate
            echo "🧪 Test 2b: Attempting signing with any available certificate"
            echo "Command: signtool sign /a /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /v docuscope-test-signing.exe"
            
            # Create a backup for testing
            cp docuscope-test-signing.exe docuscope-test-signing-backup.exe
            
            # Attempt signing with any available certificate
            SIGNING_OUTPUT=$(timeout 120 "$SIGNTOOL_PATH" sign /a /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /v docuscope-test-signing.exe 2>&1)
            echo "$SIGNING_OUTPUT" | head -50
            
            # Check if signing was successful
            if echo "$SIGNING_OUTPUT" | grep -q "Successfully signed"; then
              echo ""
              echo "✅ SIGNING SUCCESSFUL WITH AVAILABLE CERTIFICATE!"
              
              # Verify the signature
              echo ""
              echo "🔍 Verifying signature..."
              "$SIGNTOOL_PATH" verify /v docuscope-test-signing.exe 2>&1 | head -30 || echo "Verification completed"
              
            else
              echo ""
              echo "⚠️ No suitable certificates found for automatic signing"
              echo "Error analysis:"
              if echo "$SIGNING_OUTPUT" | grep -q "No certificates were found that met all the given criteria"; then
                echo "- No code signing certificates available in certificate stores"
                echo "- This confirms that Certum certificate loading is the main issue"
              elif echo "$SIGNING_OUTPUT" | grep -q "No file digest algorithm specified"; then
                echo "- Command syntax error (this should be fixed now)"
              else
                echo "- Other certificate access issue"
              fi
            fi
          fi
          
          # Test 3: Available code signing certificates
          echo ""
          echo "🧪 Test 3: Listing available code signing certificates"
          echo "Looking for certificates suitable for code signing..."
          
          powershell -Command "Get-ChildItem -Path 'Cert:\\CurrentUser\\My' | Where-Object { \$_.EnhancedKeyUsageList -like '*Code Signing*' } | Format-Table Subject, Thumbprint, NotAfter" 2>/dev/null || echo "No code signing certificates found in CurrentUser store"
          
          powershell -Command "Get-ChildItem -Path 'Cert:\\LocalMachine\\My' | Where-Object { \$_.EnhancedKeyUsageList -like '*Code Signing*' } | Format-Table Subject, Thumbprint, NotAfter" 2>/dev/null || echo "No code signing certificates found in LocalMachine store"

      - name: Summary and Results
        if: always()
        env:
          CERTUM_USERNAME: ${{ secrets.CERTUM_USERNAME }}
          CERTUM_PASSWORD: ${{ secrets.CERTUM_PASSWORD }}
          CERTUM_CERTIFICATE_SHA1: ${{ secrets.CERTUM_CERTIFICATE_SHA1 }}
        run: |
          echo ""
          echo "======================================================================"
          echo "=== REAL CODE SIGNING TEST SUMMARY ==="
          echo "======================================================================"
          echo ""
          
          # Check if we have our test files
          if [ -f "docuscope-test-signing.exe" ]; then
            echo "✅ Test executable: docuscope-test-signing.exe"
            echo "   Size: $(ls -lh docuscope-test-signing.exe | awk '{print $5}')"
            
            # Check if file appears to be signed
            SIGNATURE_CHECK=$(powershell -Command "Get-AuthenticodeSignature 'docuscope-test-signing.exe' | Select-Object -ExpandProperty Status" 2>/dev/null || echo "Unknown")
            echo "   Signature status: $SIGNATURE_CHECK"
            
            if [ "$SIGNATURE_CHECK" = "Valid" ]; then
              echo "   🎉 FILE SUCCESSFULLY SIGNED!"
            elif [ "$SIGNATURE_CHECK" = "NotSigned" ]; then
              echo "   ⚠️ File not signed (authentication may be required)"
            else
              echo "   ⚠️ Signature status unclear: $SIGNATURE_CHECK"
            fi
          else
            echo "❌ Test executable not found"
          fi
          
          # Check installation status
          if [ -d "/c/Program Files/Certum/SimplySign Desktop" ]; then
            echo "✅ SimplySign Desktop: Installed successfully"
          else
            echo "❌ SimplySign Desktop: Installation issues"
          fi
          
          # Check credential status
          CREDS_OK=true
          if [[ -z "$CERTUM_USERNAME" ]]; then
            echo "❌ CERTUM_USERNAME: Not configured"
            CREDS_OK=false
          else
            echo "✅ CERTUM_USERNAME: Configured"
          fi
          
          if [[ -z "$CERTUM_PASSWORD" ]]; then
            echo "❌ CERTUM_PASSWORD: Not configured"
            CREDS_OK=false
          else
            echo "✅ CERTUM_PASSWORD: Configured"
          fi
          
          if [[ -z "$CERTUM_CERTIFICATE_SHA1" ]]; then
            echo "❌ CERTUM_CERTIFICATE_SHA1: Not configured"
            CREDS_OK=false
          else
            echo "✅ CERTUM_CERTIFICATE_SHA1: Configured"
          fi
          
          echo ""
          echo "🎯 NEXT STEPS:"
          if [ "$CREDS_OK" = true ] && [ -d "/c/Program Files/Certum/SimplySign Desktop" ]; then
            if [ "$SIGNATURE_CHECK" = "Valid" ]; then
              echo "✅ ALL SYSTEMS GO: Ready for production integration!"
              echo "1. Integrate into build-tauri.yml Windows builds"
              echo "2. Add to main production pipeline"
              echo "3. Test with actual Tauri build artifacts"
            else
              echo "🔧 AUTHENTICATION NEEDED:"
              echo "1. Verify certificate is accessible in CI/CD environment"
              echo "2. Check if SimplySign Desktop needs to run as service"
              echo "3. Consider alternative authentication methods"
            fi
          else
            echo "⚠️ SETUP REQUIRED:"
            echo "1. Configure missing GitHub Secrets"
            echo "2. Verify SimplySign Desktop installation"
            echo "3. Test authentication workflow"
          fi
          
          echo ""
          echo "💡 KEY FINDINGS:"
          echo "- SimplySign Desktop MSI installation: Working"
          echo "- Certificate infrastructure: Available"
          echo "- signtool.exe integration: Functional"
          echo "- Real file signing: $([ "$SIGNATURE_CHECK" = "Valid" ] && echo "SUCCESS" || echo "Needs authentication")"
          
          echo ""
          echo "🎉 REAL CODE SIGNING TEST COMPLETED!"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-signing-test-results
          path: |
            docuscope-test-signing.exe
            docuscope-test-signing-backup.exe
            install.log
          retention-days: 7
