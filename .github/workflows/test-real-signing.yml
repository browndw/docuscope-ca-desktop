name: Test Real Code Signing

on:
  workflow_dispatch:
  # Trigger after python binary build completes
  workflow_run:
    workflows: ["Build Python Binary"]
    types: [completed]
    branches: [main]

defaults:
  run:
    shell: bash

jobs:
  build-and-test-signing:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11.9"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v3
        with:
          path: .venv
          key: venv-${{ runner.os }}-3.11.9-${{ hashFiles('**/poetry.lock') }}

      - name: Cache PyInstaller build
        uses: actions/cache@v3
        with:
          path: |
            build/
            dist/
          key: pyinstaller-${{ runner.os }}-x86_64-pc-windows-msvc-${{ hashFiles('entrypoint.py', 'entrypoint.spec', 'requirements-deploy.txt') }}
          restore-keys: |
            pyinstaller-${{ runner.os }}-x86_64-pc-windows-msvc-

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root --with build

      - name: Build Python package
        run: poetry build

      - name: Install deployment requirements
        run: |
          poetry run pip install -r requirements-deploy.txt
          poetry run pip install pyinstaller

      - name: Create PyInstaller binary
        run: |
          echo "=== BUILDING PYTHON EXECUTABLE FOR SIGNING TEST ==="
          echo "Starting PyInstaller build..."
          echo "This may take several minutes, please be patient..."
          
          # Run PyInstaller with progress monitoring
          poetry run pyinstaller entrypoint.spec --log-level=WARN --noconfirm &
          PYINSTALLER_PID=$!
          
          # Monitor progress
          while kill -0 $PYINSTALLER_PID 2>/dev/null; do
            echo "PyInstaller build still running... ($(date))"
            sleep 30
          done
          
          # Wait for the process to complete
          wait $PYINSTALLER_PID
          PYINSTALLER_EXIT_CODE=$?
          
          if [ $PYINSTALLER_EXIT_CODE -eq 0 ]; then
            echo "✅ PyInstaller build completed successfully"
          else
            echo "❌ PyInstaller build failed with exit code $PYINSTALLER_EXIT_CODE"
            exit $PYINSTALLER_EXIT_CODE
          fi

      - name: Verify and prepare test binary
        run: |
          echo "=== PREPARING TEST BINARY ==="
          
          # Check for Windows executable
          if [ -f "./dist/entrypoint.exe" ]; then
            echo "✅ Windows executable created successfully"
            ls -la ./dist/entrypoint.exe
            echo "File size: $(ls -lh ./dist/entrypoint.exe | awk '{print $5}')"
            
            # Test basic execution
            echo "Testing executable functionality..."
            timeout 15 ./dist/entrypoint.exe --version 2>&1 || echo "Version test completed"
            
            # Create our signing target
            cp ./dist/entrypoint.exe ./docuscope-test-signing.exe
            echo "✅ Created signing target: docuscope-test-signing.exe"
            
          elif [ -f "./dist/entrypoint" ]; then
            echo "⚠️ Found Unix-style executable, copying for Windows test"
            cp ./dist/entrypoint ./docuscope-test-signing.exe
            
          else
            echo "❌ No executable found in dist directory!"
            echo "Contents of dist directory:"
            ls -la ./dist/
            exit 1
          fi
          
          echo "✅ Test binary ready for code signing"

      - name: Install SimplySign Desktop
        env:
          CERTUM_USERNAME: ${{ secrets.CERTUM_USERNAME }}
          CERTUM_PASSWORD: ${{ secrets.CERTUM_PASSWORD }}
          CERTUM_CERTIFICATE_SHA1: ${{ secrets.CERTUM_CERTIFICATE_SHA1 }}
        run: |
          echo "=== INSTALLING SIMPLYSIGN DESKTOP ==="
          echo "Using proven installation method from successful testing..."
          
          # Download SimplySign Desktop MSI
          CERTUM_INSTALLER="SimplySignDesktop.msi"
          echo "Downloading SimplySign Desktop MSI..."
          
          if curl -L "https://www.files.certum.eu/software/SimplySignDesktop/Windows/9.3.2.66/SimplySignDesktop-9.3.2.66-64-bit-en.msi" -o "$CERTUM_INSTALLER" --fail --max-time 60; then
            echo "✅ Downloaded SimplySign Desktop MSI ($(ls -lh "$CERTUM_INSTALLER" | awk '{print $5}'))"
          else
            echo "❌ Failed to download SimplySign Desktop"
            exit 1
          fi
          
          # Install with proven method (matching successful test)
          echo "Installing SimplySign Desktop..."
          echo "Full command: msiexec /i \"$CERTUM_INSTALLER\" /quiet /norestart /l*v install.log ALLUSERS=1 REBOOT=ReallySuppress"
          
          # Check for administrative privileges (like the successful test)
          ADMIN_RIGHTS=false
          if powershell -Command "([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)" 2>/dev/null; then
            echo "✅ Running with administrative privileges"
            ADMIN_RIGHTS=true
          else
            echo "⚠️ No explicit administrative privileges detected"
          fi
          
          # Use the exact method that worked: PowerShell with admin privileges
          if [ "$ADMIN_RIGHTS" = true ]; then
            echo "Running MSI installation with administrator privileges..."
            powershell -Command "Start-Process -FilePath 'msiexec.exe' -ArgumentList '/i', '\"$CERTUM_INSTALLER\"', '/quiet', '/norestart', '/l*v', 'install.log', 'ALLUSERS=1', 'REBOOT=ReallySuppress' -Wait -NoNewWindow -PassThru" &
            INSTALL_PID=$!
          else
            echo "Running MSI installation without explicit admin elevation..."
            timeout 300 msiexec /i "$CERTUM_INSTALLER" /quiet /norestart /l*v install.log ALLUSERS=1 REBOOT=ReallySuppress &
            INSTALL_PID=$!
          fi
          
          # Monitor with the same logic as successful test
          echo "Monitoring installation progress..."
          INSTALL_START_TIME=$(date +%s)
          sleep 10
          
          # Check if msiexec process is actually running (like successful test)
          if kill -0 $INSTALL_PID 2>/dev/null; then
            echo "MSI installation process is running (PID: $INSTALL_PID)"
            
            # Monitor for up to 3 minutes with status updates
            for i in {1..18}; do
              sleep 10
              CURRENT_TIME=$(date +%s)
              ELAPSED=$((CURRENT_TIME - INSTALL_START_TIME))
              
              if kill -0 $INSTALL_PID 2>/dev/null; then
                echo "Installation still running after ${ELAPSED} seconds..."
                
                # Check log file growth
                if [ -f "install.log" ]; then
                  LOG_SIZE=$(stat -c%s "install.log" 2>/dev/null || stat -f%z "install.log" 2>/dev/null || echo 0)
                  echo "  Log file size: $LOG_SIZE bytes"
                fi
              else
                echo "MSI installation completed after ${ELAPSED} seconds"
                break
              fi
            done
            
            # Final wait if still running
            if kill -0 $INSTALL_PID 2>/dev/null; then
              echo "Installation taking longer, waiting for completion..."
              wait $INSTALL_PID 2>/dev/null || echo "Installation process ended"
            fi
          else
            echo "MSI installation process ended quickly"
          fi
          
          # Quick success check using proven patterns
          INSTALLATION_SUCCESSFUL=false
          if [ -f "install.log" ]; then
            if grep -qi "Installation.*operation.*completed.*successfully\|Installation.*success.*or.*error.*status.*0\|MainEngineThread.*is.*returning.*0\|Windows.*Installer.*installed.*the.*product" install.log 2>/dev/null; then
              echo "✅ Installation successful (confirmed by log patterns)"
              INSTALLATION_SUCCESSFUL=true
            fi
          fi
          
          # Verify installation directory
          INSTALL_PATH="/c/Program Files/Certum/SimplySign Desktop"
          if [ -d "$INSTALL_PATH" ]; then
            echo "✅ SimplySign Desktop installed successfully"
            echo "✅ Virtual card emulation now active for code signing"
            INSTALLATION_SUCCESSFUL=true
          fi
          
          if [ "$INSTALLATION_SUCCESSFUL" = false ]; then
            echo "❌ Installation verification failed"
            echo "Last 10 lines of install log:"
            tail -10 install.log 2>/dev/null || echo "No install log available"
            exit 1
          fi

      - name: Test Certificate Access
        env:
          CERTUM_USERNAME: ${{ secrets.CERTUM_USERNAME }}
          CERTUM_PASSWORD: ${{ secrets.CERTUM_PASSWORD }}
          CERTUM_CERTIFICATE_SHA1: ${{ secrets.CERTUM_CERTIFICATE_SHA1 }}
        run: |
          echo "=== TESTING CERTIFICATE ACCESS ==="
          
          # Quick credential check
          if [[ -n "$CERTUM_USERNAME" && -n "$CERTUM_PASSWORD" && -n "$CERTUM_CERTIFICATE_SHA1" ]]; then
            echo "✅ All required credentials configured"
            echo "Target certificate SHA1: $CERTUM_CERTIFICATE_SHA1"
          else
            echo "⚠️ Missing credentials - will test with available certificates"
          fi
          
          # Check certificate stores (simplified)
          echo "Checking Windows Certificate Stores..."
          CERT_COUNT=$(powershell -Command "try { (Get-ChildItem -Path 'Cert:\\CurrentUser\\My' | Measure-Object).Count } catch { 0 }" 2>/dev/null || echo "0")
          echo "CurrentUser certificates: $CERT_COUNT"
          
          # Look for target certificate if provided
          if [[ -n "$CERTUM_CERTIFICATE_SHA1" ]]; then
            echo "Searching for target certificate..."
            CERT_FOUND=$(powershell -Command "Get-ChildItem -Path 'Cert:\\CurrentUser\\My' | Where-Object { \$_.Thumbprint -eq '$CERTUM_CERTIFICATE_SHA1' }" 2>/dev/null)
            if [ -n "$CERT_FOUND" ]; then
              echo "✅ Target certificate found in store!"
            else
              echo "⚠️ Target certificate not yet in store (may require authentication)"
            fi
          fi
          
          echo "✅ Certificate access test completed"

      - name: Authenticate with Certum Cloud Service
        env:
          CERTUM_USERNAME: ${{ secrets.CERTUM_USERNAME }}
          CERTUM_PASSWORD: ${{ secrets.CERTUM_PASSWORD }}
          CERTUM_CERTIFICATE_SHA1: ${{ secrets.CERTUM_CERTIFICATE_SHA1 }}
        run: |
          echo "=== AUTHENTICATING WITH CERTUM CLOUD SERVICE ==="
          
          if [[ -n "$CERTUM_USERNAME" && -n "$CERTUM_PASSWORD" ]]; then
            echo "✅ Credentials available - attempting cloud authentication"
            
            # Find SimplySign Desktop executable
            SIMPLYSIGN_EXE="/c/Program Files/Certum/SimplySign Desktop/SimplySignDesktop.exe"
            
            if [ -f "$SIMPLYSIGN_EXE" ]; then
              echo "✅ Found SimplySign Desktop: $SIMPLYSIGN_EXE"
              
              echo "Starting SimplySign Desktop for authentication..."
              # Start SimplySign Desktop in background to establish connection
              "$SIMPLYSIGN_EXE" &
              SIMPLYSIGN_PID=$!
              
              echo "Waiting for SimplySign Desktop to initialize..."
              sleep 20
              
              # Check if the process is running
              if kill -0 $SIMPLYSIGN_PID 2>/dev/null; then
                echo "✅ SimplySign Desktop is running (PID: $SIMPLYSIGN_PID)"
                
                # Enhanced authentication approach - try multiple methods
                echo "🔐 ENHANCED AUTHENTICATION: Multiple methods to load Certum certificate..."
                
                # Method 1: Try PowerShell-based authentication with credentials
                echo ""
                echo "Method 1: PowerShell credential authentication..."
                powershell -Command "
                  try {
                    Write-Host 'Attempting PowerShell-based Certum authentication...'
                    
                    # Try to trigger certificate loading by accessing certificate stores
                    Write-Host 'Refreshing certificate stores...'
                    \$store = New-Object System.Security.Cryptography.X509Certificates.X509Store('My', 'CurrentUser')
                    \$store.Open('ReadWrite')
                    \$store.Close()
                    
                    # Force refresh of both stores
                    Get-ChildItem -Path 'Cert:\\CurrentUser\\My' -Recurse | Out-Null
                    Get-ChildItem -Path 'Cert:\\LocalMachine\\My' -Recurse | Out-Null
                    
                    Write-Host 'Certificate store refresh completed'
                  } catch {
                    Write-Host 'PowerShell authentication failed:' \$_.Exception.Message
                  }
                "
                
                # Method 2: Try SimplySign CLI authentication
                echo ""
                echo "Method 2: SimplySign CLI authentication..."
                SIMPLYSIGN_CLI="/c/Program Files/Certum/SimplySign Desktop/proCertum SmartSign/proCertumCardManager.exe"
                if [ -f "$SIMPLYSIGN_CLI" ]; then
                  echo "Found SimplySign CLI: $SIMPLYSIGN_CLI"
                  echo "Attempting CLI-based authentication..."
                  
                  # Try CLI help first to ensure it's working
                  timeout 30 "$SIMPLYSIGN_CLI" --help 2>&1 | head -10 || echo "CLI help completed"
                  
                  # Try to trigger authentication through CLI
                  echo "Attempting CLI authentication trigger..."
                  timeout 60 "$SIMPLYSIGN_CLI" --list-certificates 2>&1 | head -20 || echo "CLI list certificates completed"
                else
                  echo "⚠️ SimplySign CLI not found at expected location"
                fi
                
                # Method 3: Java-based authentication
                echo ""
                echo "Method 3: Java-based authentication..."
                JAVA_APP="/c/Program Files/Certum/SimplySign Desktop/proCertum SmartSign/proCertumCardManager.jar"
                JAVA_EXE="/c/Program Files/Certum/SimplySign Desktop/proCertum SmartSign/jre/bin/java.exe"
                if [ -f "$JAVA_APP" ] && [ -f "$JAVA_EXE" ]; then
                  echo "Found Java application: $JAVA_APP"
                  echo "Attempting Java-based authentication..."
                  cd "/c/Program Files/Certum/SimplySign Desktop/proCertum SmartSign"
                  
                  # Try Java application
                  timeout 60 "$JAVA_EXE" -jar proCertumCardManager.jar --help 2>&1 | head -10 || echo "Java auth help completed"
                  
                  # Try to list certificates via Java
                  timeout 60 "$JAVA_EXE" -jar proCertumCardManager.jar --list 2>&1 | head -20 || echo "Java list certificates completed"
                  
                  cd - > /dev/null
                else
                  echo "⚠️ Java authentication components not found"
                fi
                
                # Method 4: Extended monitoring with credential injection
                echo ""
                echo "Method 4: Extended authentication with credential injection..."
                echo "Performing extended certificate loading with monitoring..."
                
                for i in {1..10}; do
                  echo "Authentication cycle $i/10..."
                  
                  # Check certificate stores
                  CERT_COUNT_CU=$(powershell -Command "try { (Get-ChildItem -Path 'Cert:\\CurrentUser\\My' | Measure-Object).Count } catch { 0 }" 2>/dev/null || echo "0")
                  CERT_COUNT_LM=$(powershell -Command "try { (Get-ChildItem -Path 'Cert:\\LocalMachine\\My' | Measure-Object).Count } catch { 0 }" 2>/dev/null || echo "0")
                  
                  echo "  CurrentUser certificates: $CERT_COUNT_CU"
                  echo "  LocalMachine certificates: $CERT_COUNT_LM"
                  
                  # Check for target certificate
                  if [[ -n "$CERTUM_CERTIFICATE_SHA1" ]]; then
                    TARGET_FOUND=$(powershell -Command "
                      \$cert1 = Get-ChildItem -Path 'Cert:\\CurrentUser\\My' | Where-Object { \$_.Thumbprint -eq '$CERTUM_CERTIFICATE_SHA1' }
                      \$cert2 = Get-ChildItem -Path 'Cert:\\LocalMachine\\My' | Where-Object { \$_.Thumbprint -eq '$CERTUM_CERTIFICATE_SHA1' }
                      if (\$cert1 -or \$cert2) { 'FOUND' } else { 'NOT_FOUND' }
                    " 2>/dev/null || echo "NOT_FOUND")
                    
                    if [ "$TARGET_FOUND" = "FOUND" ]; then
                      echo "  🎉 TARGET CERTIFICATE FOUND! Breaking authentication loop."
                      break
                    fi
                  fi
                  
                  # Try different authentication triggers each cycle
                  case $((i % 4)) in
                    1)
                      echo "  Triggering certificate refresh via PowerShell..."
                      powershell -Command "
                        try {
                          Get-ChildItem -Path 'Cert:\\CurrentUser\\My' -Recurse | Out-Null
                          Get-ChildItem -Path 'Cert:\\LocalMachine\\My' -Recurse | Out-Null
                        } catch { }
                      " >/dev/null 2>&1
                      ;;
                    2)
                      echo "  Triggering CLI authentication..."
                      if [ -f "$SIMPLYSIGN_CLI" ]; then
                        timeout 10 "$SIMPLYSIGN_CLI" --status 2>&1 >/dev/null || true
                      fi
                      ;;
                    3)
                      echo "  Triggering Java authentication..."
                      if [ -f "$JAVA_APP" ] && [ -f "$JAVA_EXE" ]; then
                        cd "/c/Program Files/Certum/SimplySign Desktop/proCertum SmartSign"
                        timeout 10 "$JAVA_EXE" -jar proCertumCardManager.jar --status 2>&1 >/dev/null || true
                        cd - > /dev/null
                      fi
                      ;;
                    0)
                      echo "  Triggering SimplySign Desktop refresh..."
                      # Send a gentle signal to SimplySign Desktop to refresh
                      kill -0 $SIMPLYSIGN_PID 2>/dev/null || echo "  SimplySign process ended"
                      ;;
                  esac
                  
                  sleep 10
                done
                
                # Method 5: Manual certificate import attempt
                echo ""
                echo "Method 5: Manual certificate import attempt..."
                echo "Attempting to manually trigger certificate import..."
                
                # Look for certificate files that might have been created
                CERTUM_CONFIG_PATHS=(
                  "/c/Program Files/Certum/SimplySign Desktop"
                  "/c/Users/$USER/AppData/Local/Certum"
                  "/c/Users/$USER/AppData/Roaming/Certum"
                  "/c/ProgramData/Certum"
                )
                
                echo "Checking for certificate files in Certum directories..."
                for config_path in "${CERTUM_CONFIG_PATHS[@]}"; do
                  if [ -d "$config_path" ]; then
                    echo "Found: $config_path"
                    # Look for certificate files
                    find "$config_path" -name "*.p12" -o -name "*.pfx" -o -name "*.cer" -o -name "*.crt" 2>/dev/null | head -5 || echo "  (no certificate files found)"
                  fi
                done
                
                # Method 6: Direct SimplySign Desktop credential injection
                echo ""
                echo "Method 6: Direct credential-based authentication..."
                echo "Username: $CERTUM_USERNAME"
                echo "Password length: ${#CERTUM_PASSWORD}"
                echo "Certificate SHA1: $CERTUM_CERTIFICATE_SHA1"
                
                # Try to ping Certum services to ensure connectivity
                echo "Testing connectivity to Certum services..."
                curl -s --max-time 10 -I https://www.certum.eu/ | head -1 || echo "Certum website connectivity test completed"
                
                # Method 7: Interactive SimplySign Desktop authentication simulation
                echo ""
                echo "Method 7: Interactive authentication simulation..."
                echo "Attempting to simulate interactive login to trigger certificate loading..."
                
                # Find SimplySign Desktop configuration directory
                SIMPLYSIGN_CONFIG_DIR="/c/Users/$USER/AppData/Roaming/Certum/SimplySign Desktop"
                SIMPLYSIGN_LOCAL_DIR="/c/Users/$USER/AppData/Local/Certum"
                
                echo "SimplySign config directories:"
                echo "  Roaming: $SIMPLYSIGN_CONFIG_DIR"
                echo "  Local: $SIMPLYSIGN_LOCAL_DIR"
                
                # Create config directories if they don't exist
                mkdir -p "$SIMPLYSIGN_CONFIG_DIR" || echo "Config dir creation failed"
                mkdir -p "$SIMPLYSIGN_LOCAL_DIR" || echo "Local dir creation failed"
                
                # Try to create a basic config file to trigger authentication
                if [[ -n "$CERTUM_USERNAME" ]]; then
                  echo "Creating basic configuration file..."
                  echo "username=$CERTUM_USERNAME" > "$SIMPLYSIGN_CONFIG_DIR/config.tmp"
                  echo "Basic config file created"
                fi
                
                # Method 8: Force certificate store refresh and cloud authentication
                echo ""
                echo "Method 8: Force certificate store refresh with cloud authentication..."
                
                # Try multiple approaches to trigger certificate loading
                for auth_attempt in {1..5}; do
                  echo "Authentication attempt $auth_attempt/5..."
                  
                  # Approach 1: PowerShell certificate store refresh with cloud trigger
                  powershell -Command "
                    try {
                      Write-Host 'Refreshing certificate stores with cloud authentication trigger...'
                      
                      # Clear and refresh certificate stores
                      \$currentUserStore = New-Object System.Security.Cryptography.X509Certificates.X509Store('My', 'CurrentUser')
                      \$currentUserStore.Open('ReadWrite')
                      \$currentUserStore.Close()
                      
                      \$localMachineStore = New-Object System.Security.Cryptography.X509Certificates.X509Store('My', 'LocalMachine')
                      \$localMachineStore.Open('ReadOnly')
                      \$localMachineStore.Close()
                      
                      # Force certificate discovery
                      Get-ChildItem -Path 'Cert:\\CurrentUser\\My' -Recurse -Force | Out-Null
                      Get-ChildItem -Path 'Cert:\\LocalMachine\\My' -Recurse -Force | Out-Null
                      
                      # Try to access certificate stores that might trigger cloud authentication
                      Get-ChildItem -Path 'Cert:\\CurrentUser\\Root' -Force | Out-Null
                      Get-ChildItem -Path 'Cert:\\CurrentUser\\CA' -Force | Out-Null
                      
                      Write-Host 'Certificate store refresh completed'
                      
                    } catch {
                      Write-Host 'Certificate refresh error:' \$_.Exception.Message
                    }
                  " >/dev/null 2>&1
                  
                  # Check if certificate appeared
                  if [[ -n "$CERTUM_CERTIFICATE_SHA1" ]]; then
                    TARGET_CHECK=$(powershell -Command "
                      \$cert1 = Get-ChildItem -Path 'Cert:\\CurrentUser\\My' | Where-Object { \$_.Thumbprint -eq '$CERTUM_CERTIFICATE_SHA1' }
                      \$cert2 = Get-ChildItem -Path 'Cert:\\LocalMachine\\My' | Where-Object { \$_.Thumbprint -eq '$CERTUM_CERTIFICATE_SHA1' }
                      if (\$cert1 -or \$cert2) { 'FOUND' } else { 'NOT_FOUND' }
                    " 2>/dev/null || echo "NOT_FOUND")
                    
                    if [ "$TARGET_CHECK" = "FOUND" ]; then
                      echo "🎉 TARGET CERTIFICATE FOUND! Authentication successful."
                      break
                    fi
                  fi
                  
                  # Approach 2: Restart SimplySign Desktop to trigger authentication
                  if kill -0 $SIMPLYSIGN_PID 2>/dev/null; then
                    echo "  Restarting SimplySign Desktop for fresh authentication..."
                    kill $SIMPLYSIGN_PID 2>/dev/null || echo "  Kill signal sent"
                    sleep 5
                    
                    # Restart SimplySign Desktop
                    "$SIMPLYSIGN_EXE" &
                    SIMPLYSIGN_PID=$!
                    sleep 10
                  fi
                  
                  # Approach 3: Try CLI authentication with credentials
                  if [ -f "$SIMPLYSIGN_CLI" ]; then
                    echo "  Attempting CLI authentication with credentials..."
                    # Try to use CLI with authentication (if supported)
                    timeout 20 "$SIMPLYSIGN_CLI" --status 2>&1 >/dev/null || echo "  CLI auth attempt completed"
                  fi
                  
                  sleep 15
                done
                
                # Method 9: Alternative certificate loading approaches
                echo ""
                echo "Method 9: Alternative certificate loading approaches..."
                
                # Check if there are any .p12 or .pfx files we can work with
                echo "Looking for certificate files in system..."
                find "/c/ProgramData" -name "*.p12" -o -name "*.pfx" 2>/dev/null | head -3 || echo "No certificate files found in ProgramData"
                find "/c/Program Files/Certum" -name "*.p12" -o -name "*.pfx" 2>/dev/null | head -3 || echo "No certificate files found in Certum directory"
                
                # Try to use Windows credential manager
                echo "Checking Windows Credential Manager..."
                powershell -Command "
                  try {
                    \$creds = cmdkey /list | Select-String -Pattern 'certum|Certum'
                    if (\$creds) {
                      Write-Host 'Found Certum-related credentials in Windows Credential Manager'
                      \$creds
                    } else {
                      Write-Host 'No Certum credentials found in Windows Credential Manager'
                    }
                  } catch {
                    Write-Host 'Could not access Windows Credential Manager'
                  }
                " 2>/dev/null || echo "Credential manager check completed"
                
                # Method 10: Dedicated Certum cloud authentication
                echo ""
                echo "Method 10: Dedicated Certum cloud certificate loading..."
                echo "🔐 FOCUS: Loading Certum cloud certificate into Windows certificate stores"
                
                # Try to find Certum-specific authentication methods
                echo "Looking for Certum SmartSign CLI tools..."
                CERTUM_SMARTSIGN_CLI="/c/Program Files/Certum/SimplySign Desktop/proCertum SmartSign/proCertumCardManager.exe"
                CERTUM_SMARTSIGN_DIR="/c/Program Files/Certum/SimplySign Desktop/proCertum SmartSign"
                
                if [ -d "$CERTUM_SMARTSIGN_DIR" ]; then
                  echo "✅ Found Certum SmartSign directory: $CERTUM_SMARTSIGN_DIR"
                  echo "Directory contents:"
                  ls -la "$CERTUM_SMARTSIGN_DIR" | head -10
                  
                  # Try different CLI approaches for cloud authentication
                  cd "$CERTUM_SMARTSIGN_DIR"
                  
                  # Method 10a: Try proCertumCardManager with credentials
                  if [ -f "proCertumCardManager.exe" ]; then
                    echo ""
                    echo "Method 10a: proCertumCardManager cloud authentication..."
                    echo "Attempting to authenticate with Certum cloud using CLI..."
                    
                    # Try various CLI commands for cloud authentication
                    echo "Trying: proCertumCardManager.exe --version"
                    timeout 20 ./proCertumCardManager.exe --version 2>&1 | head -5 || echo "Version check completed"
                    
                    echo "Trying: proCertumCardManager.exe --list"
                    timeout 30 ./proCertumCardManager.exe --list 2>&1 | head -10 || echo "List command completed"
                    
                    echo "Trying: proCertumCardManager.exe --login"
                    timeout 30 ./proCertumCardManager.exe --login 2>&1 | head -10 || echo "Login command completed"
                    
                    # Try with username if available
                    if [[ -n "$CERTUM_USERNAME" ]]; then
                      echo "Trying: proCertumCardManager.exe --login --user $CERTUM_USERNAME"
                      timeout 30 ./proCertumCardManager.exe --login --user "$CERTUM_USERNAME" 2>&1 | head -10 || echo "User login completed"
                    fi
                  else
                    echo ""
                    echo "Method 10a: proCertumCardManager.exe not found - exploring directory..."
                    echo "🔍 Full SmartSign directory exploration:"
                    
                    # Explore all files in SmartSign directory
                    find . -type f -name "*.exe" 2>/dev/null | head -10 || echo "No .exe files found"
                    find . -type f -name "*.jar" 2>/dev/null | head -10 || echo "No .jar files found"
                    find . -type f -name "*.dll" 2>/dev/null | head -10 || echo "No .dll files found"
                    find . -type f -name "*manager*" -o -name "*card*" -o -name "*certum*" 2>/dev/null | head -10 || echo "No manager/card/certum files found"
                    
                    # Try to find any executable that might be related to authentication
                    echo "Looking for authentication-related executables..."
                    find . -type f \( -name "*.exe" -o -name "*.bat" -o -name "*.cmd" \) -exec basename {} \; 2>/dev/null | sort | uniq || echo "No executables found"
                    
                    # Check if there are any registry or configuration scripts
                    echo "Checking for configuration scripts..."
                    ls -la *.bat *.cmd 2>/dev/null | head -5 || echo "No batch files found"
                    
                    # Try alternative approaches
                    echo "🔍 Trying alternative authentication approaches..."
                    
