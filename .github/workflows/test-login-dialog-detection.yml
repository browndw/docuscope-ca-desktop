name: Login Dialog Detection Diagnostic

on:
  workflow_dispatch:
    inputs:
      detection_timeout:
        description: 'Detection timeout in seconds'
        required: false
        default: '180'
        type: string
      enable_network_monitoring:
        description: 'Enable OAuth2 network monitoring'
        required: false
        default: true
        type: boolean
      debug_mode:
        description: 'Enable verbose debugging'
        required: false
        default: false
        type: boolean

jobs:
  login-dialog-diagnostic:
    runs-on: windows-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Step 0: Ensure Clean Environment
    - name: Clean SimplySign Environment
      run: |
        echo "=== ENSURING CLEAN SIMPLYSIGN ENVIRONMENT ==="
        echo "Terminating any existing SimplySign processes..."
        
        # Kill any existing SimplySign processes
        $processes = Get-Process -Name "*SimplySign*" -ErrorAction SilentlyContinue
        if ($processes) {
          Write-Host "Found $($processes.Count) existing SimplySign processes"
          $processes | ForEach-Object {
            Write-Host "Terminating: $($_.ProcessName) (PID: $($_.Id))"
            try {
              $_ | Stop-Process -Force
              Write-Host "Successfully terminated PID $($_.Id)"
            } catch {
              Write-Host "Could not terminate PID $($_.Id): $($_.Exception.Message)"
            }
          }
          
          # Wait for processes to fully terminate
          Start-Sleep -Seconds 3
          
          # Verify cleanup
          $remainingProcesses = Get-Process -Name "*SimplySign*" -ErrorAction SilentlyContinue
          if ($remainingProcesses) {
            Write-Host "Warning: $($remainingProcesses.Count) processes still running"
            $remainingProcesses | ForEach-Object { Write-Host "  Still running: $($_.ProcessName) (PID: $($_.Id))" }
          } else {
            Write-Host "All SimplySign processes terminated successfully"
          }
        } else {
          Write-Host "No existing SimplySign processes found"
        }
        
        # Clean any existing registry configuration
        Write-Host "Cleaning existing registry configuration..."
        $regPaths = @(
          "HKCU:\Software\Certum",
          "HKCU:\Software\SimplySignDesktop", 
          "HKCU:\Software\Asseco"
        )
        
        foreach ($regPath in $regPaths) {
          if (Test-Path $regPath) {
            try {
              Remove-Item -Path $regPath -Recurse -Force -ErrorAction SilentlyContinue
              Write-Host "Cleaned registry path: $regPath"
            } catch {
              Write-Host "Could not clean registry path: $regPath"
            }
          }
        }
        
        Write-Host "Environment cleanup completed"
      shell: powershell

    # Step 1: Take Registry Snapshot BEFORE Installation
    - name: Take Pre-Installation Registry Snapshot
      run: |
        Write-Host "=== TAKING PRE-INSTALLATION REGISTRY SNAPSHOT ==="
        Write-Host "Capturing registry state before SimplySign installation..."
        
        # Export relevant registry sections to files
        $regPaths = @(
          "HKCU\Software\Certum",
          "HKCU\Software\SimplySignDesktop", 
          "HKCU\Software\Asseco",
          "HKLM\SOFTWARE\Certum",
          "HKLM\SOFTWARE\SimplySignDesktop",
          "HKLM\SOFTWARE\Asseco"
        )
        
        Write-Host "Exporting registry sections before installation..."
        foreach ($regPath in $regPaths) {
          $fileName = "before_" + ($regPath -replace "\\", "_" -replace ":", "") + ".reg"
          try {
            # Use cmd to run reg export and capture both stdout and stderr
            $output = cmd /c "reg export `"$regPath`" `"$fileName`" /y 2>&1"
            $exitCode = $LASTEXITCODE
            
            if ($exitCode -eq 0) {
              Write-Host "Exported: $regPath -> $fileName"
            } else {
              # Registry key doesn't exist yet - this is expected before installation
              Write-Host "Registry key not found (expected): $regPath"
              # Create empty baseline file for comparison later
              "Windows Registry Editor Version 5.00`r`n`r`n; Registry key did not exist before installation`r`n" | Out-File -FilePath $fileName -Encoding ASCII
            }
          } catch {
            Write-Host "Could not export $regPath : $($_.Exception.Message)"
            "Windows Registry Editor Version 5.00`r`n`r`n; Export failed: $($_.Exception.Message)`r`n" | Out-File -FilePath $fileName -Encoding ASCII
          }
        }
        
        # Also capture process list before installation
        Write-Host "Capturing running processes before installation..."
        Get-Process | Select-Object Name, Id, ProcessName | Export-Csv -Path "processes_before.csv" -NoTypeInformation
        
        Write-Host "Pre-installation snapshot completed"
        Get-ChildItem -Name "before_*.reg" | ForEach-Object { Write-Host "  Created: $_" }
        
        # Ensure script exits successfully regardless of registry key existence
        exit 0
      shell: powershell

    # Step 2: Install SimplySign Desktop
    - name: Install SimplySign Desktop  
      run: |
        echo "=== INSTALLING SIMPLYSIGN DESKTOP ==="
        echo "Downloading and installing for diagnostic testing..."
        echo "Using stable version 9.1.5.52 as configured in install-simplysign.sh"
        chmod +x ./.github/scripts/install-simplysign.sh
        ./.github/scripts/install-simplysign.sh
      shell: bash

    # Step 3: Take Registry Snapshot AFTER Installation
    - name: Take Post-Installation Registry Snapshot
      run: |
        Write-Host "=== TAKING POST-INSTALLATION REGISTRY SNAPSHOT ==="
        Write-Host "Capturing registry state after SimplySign installation..."
        
        # Export same registry sections after installation
        $regPaths = @(
          "HKCU\Software\Certum",
          "HKCU\Software\SimplySignDesktop", 
          "HKCU\Software\Asseco",
          "HKLM\SOFTWARE\Certum",
          "HKLM\SOFTWARE\SimplySignDesktop",
          "HKLM\SOFTWARE\Asseco"
        )
        
        Write-Host "Exporting registry sections after installation..."
        foreach ($regPath in $regPaths) {
          $fileName = "after_" + ($regPath -replace "\\", "_" -replace ":", "") + ".reg"
          try {
            # Use cmd to run reg export and capture both stdout and stderr
            $output = cmd /c "reg export `"$regPath`" `"$fileName`" /y 2>&1"
            $exitCode = $LASTEXITCODE
            
            if ($exitCode -eq 0) {
              Write-Host "Exported: $regPath -> $fileName"
            } else {
              # Registry key still doesn't exist after installation
              Write-Host "Registry key still not found: $regPath"
              "Windows Registry Editor Version 5.00`r`n`r`n; Registry key did not exist after installation`r`n" | Out-File -FilePath $fileName -Encoding ASCII
            }
          } catch {
            Write-Host "Could not export $regPath : $($_.Exception.Message)"
            "Windows Registry Editor Version 5.00`r`n`r`n; Export failed: $($_.Exception.Message)`r`n" | Out-File -FilePath $fileName -Encoding ASCII
          }
        }
        
        # Capture process list after installation
        Get-Process | Select-Object Name, Id, ProcessName | Export-Csv -Path "processes_after.csv" -NoTypeInformation
        
        Write-Host "Post-installation snapshot completed"
        Get-ChildItem -Name "after_*.reg" | ForEach-Object { Write-Host "  Created: $_" }
        
        # Ensure script exits successfully regardless of registry key existence  
        exit 0
      shell: powershell

    # Step 4: Start SimplySign to Create User Configuration
    - name: Initialize SimplySign User Configuration
      run: |
        Write-Host "=== INITIALIZING SIMPLYSIGN USER CONFIGURATION ==="
        Write-Host "Starting SimplySign to allow it to create user-specific settings..."
        Write-Host ""
        
        # Locate SimplySign executable
        $possiblePaths = @(
            "${env:ProgramFiles}\Certum\SimplySign Desktop\SimplySignDesktop.exe",
            "${env:ProgramFiles(x86)}\Certum\SimplySign Desktop\SimplySignDesktop.exe",
            "${env:ProgramFiles}\Certum\SimplySign Desktop\SimplySign Desktop.exe",
            "${env:ProgramFiles(x86)}\Certum\SimplySign Desktop\SimplySign Desktop.exe"
        )
        
        $exePath = $null
        foreach ($path in $possiblePaths) {
            if (Test-Path $path) {
                $exePath = $path
                Write-Host "Found SimplySign Desktop at: $path"
                break
            }
        }
        
        if (-not $exePath) {
            Write-Host "Could not locate SimplySign Desktop executable"
            Write-Host "Installation may have failed or executable is in unexpected location"
            exit 1
        }
        
        Write-Host "Starting SimplySign Desktop for 30 seconds to initialize user configuration..."
        try {
            # Start SimplySign in normal mode (not hidden) to ensure full initialization
            $process = Start-Process -FilePath $exePath -PassThru
            Write-Host "Started SimplySign Desktop (PID: $($process.Id))"
            
            # Wait 30 seconds for full initialization and user config creation
            Write-Host "Waiting 30 seconds for initialization and user configuration creation..."
            Start-Sleep -Seconds 30
            
            # Check if process is still running
            if (-not $process.HasExited) {
                Write-Host "SimplySign is running and stable after 30 seconds"
                
                # Stop the process gracefully
                try {
                    $process | Stop-Process -Force
                    Write-Host "Gracefully terminated SimplySign"
                } catch {
                    Write-Host "Error terminating process: $($_.Exception.Message)"
                }
                
                # Verify termination
                Start-Sleep -Seconds 2
                $remainingProcesses = Get-Process -Name "*SimplySign*" -ErrorAction SilentlyContinue
                if ($remainingProcesses) {
                    Write-Host "Some SimplySign processes still running:"
                    $remainingProcesses | ForEach-Object { 
                        Write-Host "   PID $($_.Id): $($_.ProcessName)"
                        try {
                            $_ | Stop-Process -Force
                            Write-Host "   Force terminated PID $($_.Id)"
                        } catch {
                            Write-Host "   Could not terminate PID $($_.Id)"
                        }
                    }
                } else {
                    Write-Host "All SimplySign processes terminated cleanly"
                }
            } else {
                Write-Host "SimplySign process exited during initialization (Exit Code: $($process.ExitCode))"
                Write-Host "This may still have created user configuration files"
            }
            
        } catch {
            Write-Host "Error starting SimplySign: $($_.Exception.Message)"
            Write-Host "Will continue analysis in case partial configuration was created"
        }
        
        Write-Host ""
        Write-Host "User configuration initialization completed"
        Write-Host "Now taking updated registry snapshot to capture any new user settings..."
      shell: powershell

    # Step 5: Take Registry Snapshot AFTER User Initialization
    - name: Take Post-User-Init Registry Snapshot
      run: |
        Write-Host "=== TAKING POST-USER-INITIALIZATION REGISTRY SNAPSHOT ==="
        Write-Host "Capturing registry state after SimplySign user initialization..."
        
        # Export same registry sections after user initialization
        $regPaths = @(
          "HKCU\Software\Certum",
          "HKCU\Software\SimplySignDesktop", 
          "HKCU\Software\Asseco",
          "HKLM\SOFTWARE\Certum",
          "HKLM\SOFTWARE\SimplySignDesktop",
          "HKLM\SOFTWARE\Asseco"
        )
        
        Write-Host "Exporting registry sections after user initialization..."
        foreach ($regPath in $regPaths) {
          $fileName = "after_user_init_" + ($regPath -replace "\\", "_" -replace ":", "") + ".reg"
          try {
            # Use cmd to run reg export and capture both stdout and stderr
            $output = cmd /c "reg export `"$regPath`" `"$fileName`" /y 2>&1"
            $exitCode = $LASTEXITCODE
            
            if ($exitCode -eq 0) {
              Write-Host "Exported: $regPath -> $fileName"
            } else {
              # Registry key still doesn't exist after user initialization
              Write-Host "Registry key still not found: $regPath"
              "Windows Registry Editor Version 5.00`r`n`r`n; Registry key did not exist after user initialization`r`n" | Out-File -FilePath $fileName -Encoding ASCII
            }
          } catch {
            Write-Host "Could not export $regPath : $($_.Exception.Message)"
            "Windows Registry Editor Version 5.00`r`n`r`n; Export failed: $($_.Exception.Message)`r`n" | Out-File -FilePath $fileName -Encoding ASCII
          }
        }
        
        Write-Host "Post-user-initialization snapshot completed"
        Get-ChildItem -Name "after_user_init_*.reg" | ForEach-Object { Write-Host "  Created: $_" }
        
        # Ensure script exits successfully regardless of registry key existence  
        exit 0
      shell: powershell

    # Step 6: Analyze Registry Changes
    - name: Analyze Registry Changes
      run: |
        Write-Host "=== ANALYZING REGISTRY CHANGES ==="
        Write-Host "Comparing before/after installation AND after user initialization to find settings..."
        
        # Compare each registry section - now we have 3 snapshots:
        # 1. before_* (before installation)
        # 2. after_* (after installation, before user init)  
        # 3. after_user_init_* (after user initialization)
        $regSections = @(
          "HKCU_Software_Certum",
          "HKCU_Software_SimplySignDesktop", 
          "HKCU_Software_Asseco",
          "HKLM_SOFTWARE_Certum",
          "HKLM_SOFTWARE_SimplySignDesktop",
          "HKLM_SOFTWARE_Asseco"
        )
        
        $installChangesFound = $false
        $userInitChangesFound = $false
        
        foreach ($section in $regSections) {
          $beforeFile = "before_$section.reg"
          $afterInstallFile = "after_$section.reg"
          $afterUserInitFile = "after_user_init_$section.reg"
          
          Write-Host ""
          Write-Host "=== ANALYZING: $section ==="
          
          # Compare installation changes (before -> after install)
          if ((Test-Path $beforeFile) -and (Test-Path $afterInstallFile)) {
            $beforeContent = Get-Content $beforeFile -Raw
            $afterInstallContent = Get-Content $afterInstallFile -Raw
            
            if ($beforeContent -ne $afterInstallContent) {
              Write-Host "INSTALLATION CHANGES DETECTED in $section"
              $installChangesFound = $true
              
              $beforeLines = Get-Content $beforeFile
              $afterInstallLines = Get-Content $afterInstallFile
              $installChanges = Compare-Object $beforeLines $afterInstallLines | Where-Object { $_.SideIndicator -eq "=>" }
              
              if ($installChanges) {
                Write-Host "  NEW ENTRIES FROM INSTALLATION:"
                foreach ($line in $installChanges) {
                  $content = $line.InputObject
                  if ($content -match '^".*"=' -and $content -notmatch "^;") {
                    Write-Host "    $content"
                  }
                }
              }
            }
          }
          
          # Compare user initialization changes (after install -> after user init)
          if ((Test-Path $afterInstallFile) -and (Test-Path $afterUserInitFile)) {
            $afterInstallContent = Get-Content $afterInstallFile -Raw
            $afterUserInitContent = Get-Content $afterUserInitFile -Raw
            
            if ($afterInstallContent -ne $afterUserInitContent) {
              Write-Host "USER INITIALIZATION CHANGES DETECTED in $section"
              $userInitChangesFound = $true
              
              $afterInstallLines = Get-Content $afterInstallFile
              $afterUserInitLines = Get-Content $afterUserInitFile
              $userInitChanges = Compare-Object $afterInstallLines $afterUserInitLines | Where-Object { $_.SideIndicator -eq "=>" }
              
              if ($userInitChanges) {
                Write-Host "  NEW ENTRIES FROM USER INITIALIZATION:"
                foreach ($line in $userInitChanges) {
                  $content = $line.InputObject
                  if ($content -match '^".*"=' -and $content -notmatch "^;") {
                    Write-Host "    $content"
                    
                    # Look for dialog/cloud/login related entries
                    if ($content -match "(dialog|cloud|login|logon|connect|auth|show)" -and $content -notmatch "^;") {
                      Write-Host "       POTENTIAL LOGIN TRIGGER:"
                      Write-Host "       $content"
                    }
                    
                    # Look specifically for the macOS equivalent setting we found
                    if ($content -match "ShowLogonDialogAfterApplicationStartup" -or 
                        $content -match "ShowLogonDialog.*Startup" -or
                        $content -match "SimplySignDesktopShowLogonDialog") {
                      Write-Host "       FOUND WINDOWS EQUIVALENT OF MACOS SETTING:"
                      Write-Host "       macOS: SimplySignDesktopShowLogonDialogAfterApplicationStartup"
                      Write-Host "       Windows: $content"
                    }
                  }
                }
              }
            } else {
              Write-Host "  No user initialization changes in $section"
            }
          }
          
          # Save detailed diffs
          if ((Test-Path $beforeFile) -and (Test-Path $afterUserInitFile)) {
            $beforeLines = Get-Content $beforeFile
            $afterUserInitLines = Get-Content $afterUserInitFile
            $fullDiff = Compare-Object $beforeLines $afterUserInitLines
            if ($fullDiff) {
              $diffFile = "full_changes_$section.txt"
              $fullDiff | Out-File $diffFile
              Write-Host "  Full diff saved to: $diffFile"
            }
          }
        }
        
        Write-Host ""
        Write-Host "=== SUMMARY ==="
        if ($installChangesFound) {
          Write-Host "Installation created registry entries (system-wide configuration)"
        } else {
          Write-Host "No installation registry changes detected"
        }
        
        if ($userInitChangesFound) {
          Write-Host "User initialization created additional registry entries (user-specific settings)"
          Write-Host "   Look for lines marked 'POTENTIAL LOGIN TRIGGER' above"
        } else {
          Write-Host "   No user initialization registry changes detected"
          Write-Host "   This suggests settings may be stored in files, not registry"
        }
        
        Write-Host ""
        Write-Host "Registry analysis completed"
        
        # Ensure script exits successfully
        exit 0
      shell: powershell

    # Step 7: Find Default SimplySignDesktopShowLogonDialogAfterApplicationStartup Location
    - name: Find Default SimplySignDesktopShowLogonDialogAfterApplicationStartup Location
      run: |
        Write-Host "=== FINDING DEFAULT SETTING LOCATION ==="
        Write-Host "Goal: Locate where SimplySignDesktopShowLogonDialogAfterApplicationStartup = 'No' is stored"
        Write-Host "Strategy: Start SimplySign, let it create default preferences, then search for the setting"
        Write-Host ""
        
        # First, start SimplySign to let it create its default configuration
        $possiblePaths = @(
            "${env:ProgramFiles}\Certum\SimplySign Desktop\SimplySignDesktop.exe",
            "${env:ProgramFiles(x86)}\Certum\SimplySign Desktop\SimplySignDesktop.exe",
            "${env:ProgramFiles}\Certum\SimplySign Desktop\SimplySign Desktop.exe",
            "${env:ProgramFiles(x86)}\Certum\SimplySign Desktop\SimplySign Desktop.exe"
        )
        
        $exePath = $null
        foreach ($path in $possiblePaths) {
            if (Test-Path $path) {
                $exePath = $path
                Write-Host "Found SimplySign Desktop at: $path"
                break
            }
        }
        
        if (-not $exePath) {
            Write-Host "Could not locate SimplySign Desktop executable"
            exit 1
        }
        
        # Start SimplySign briefly to create default settings
        Write-Host "Starting SimplySign to create default configuration..."
        try {
            $process = Start-Process -FilePath $exePath -WindowStyle Hidden -PassThru
            Write-Host "Started SimplySign (PID: $($process.Id))"
            
            # Give it time to initialize and create default settings
            Start-Sleep -Seconds 15
            
            # Stop the process
            if (-not $process.HasExited) {
                $process | Stop-Process -Force
                Write-Host "Stopped SimplySign after initialization"
            }
        } catch {
            Write-Host "Error during SimplySign startup: $($_.Exception.Message)"
        }
        
        Write-Host ""
        Write-Host "SEARCHING FOR SimplySignDesktopShowLogonDialogAfterApplicationStartup..."
        Write-Host "============================================================================="
        
        # Search all registry hives for the exact setting name
        $searchPaths = @(
            "HKCU:\",
            "HKLM:\SOFTWARE\",
            "HKLM:\SOFTWARE\WOW6432Node\"
        )
        
        $foundLocations = @()
        
        foreach ($rootPath in $searchPaths) {
            Write-Host "Searching under: $rootPath"
            try {
                # Use reg query to search for the setting name
                $output = cmd /c "reg query `"$($rootPath.Replace(':', ''))`" /s /f `"SimplySignDesktopShowLogonDialogAfterApplicationStartup`" 2>nul"
                
                if ($output -and $output.Count -gt 0) {
                    Write-Host "FOUND MATCHES in $rootPath :"
                    $output | ForEach-Object {
                        if ($_ -and $_ -notlike "*searching*" -and $_ -notlike "*End of search*") {
                            Write-Host "    $_"
                            if ($_ -match "HKEY_") {
                                $foundLocations += $_
                            }
                        }
                    }
                } else {
                    Write-Host "No matches in $rootPath"
                }
            } catch {
                Write-Host "Search failed in $rootPath : $($_.Exception.Message)"
            }
        }
        
        Write-Host ""
        Write-Host "SEARCHING APPDATA AND USER PROFILE FILES..."
        Write-Host "==============================================="
        
        # Check for preference files in AppData (like macOS stores in ~/Library/Preferences)
        $appDataPaths = @(
            "$env:APPDATA\Certum",
            "$env:APPDATA\SimplySign",
            "$env:LOCALAPPDATA\Certum", 
            "$env:LOCALAPPDATA\SimplySign",
            "$env:USERPROFILE\Documents\Certum",
            "$env:USERPROFILE\Documents\SimplySign"
        )
        
        $foundFiles = @()
        
        foreach ($path in $appDataPaths) {
            Write-Host "Checking: $path"
            if (Test-Path $path) {
                Write-Host "Path exists - searching files..."
                try {
                    # Look for any files that might contain preferences
                    $configFiles = Get-ChildItem -Path $path -Recurse -Include "*.xml", "*.plist", "*.config", "*.ini", "*.json", "*.cfg", "*.properties" -ErrorAction SilentlyContinue
                    
                    foreach ($file in $configFiles) {
                        Write-Host "Found config file: $($file.FullName)"
                        
                        # Search file content for our setting
                        try {
                            $content = Get-Content -Path $file.FullName -Raw -ErrorAction SilentlyContinue
                            if ($content -and $content -match "SimplySignDesktopShowLogonDialogAfterApplicationStartup") {
                                Write-Host "FOUND SETTING IN FILE: $($file.FullName)"
                                $foundFiles += $file.FullName
                                
                                # Extract the relevant lines
                                $lines = Get-Content -Path $file.FullName
                                $matchingLines = $lines | Select-String "SimplySignDesktopShowLogonDialogAfterApplicationStartup"
                                foreach ($line in $matchingLines) {
                                    Write-Host "      $line"
                                }
                            }
                        } catch {
                            Write-Host "   Could not read file: $($file.FullName)"
                        }
                    }
                } catch {
                    Write-Host "   Error searching path: $($_.Exception.Message)"
                }
            } else {
                Write-Host "   Path does not exist"
            }
        }
        
        Write-Host ""
        Write-Host "SEARCH SUMMARY:"
        Write-Host "=================="
        
        $totalFound = $foundLocations.Count + $foundFiles.Count
        
        if ($foundLocations.Count -gt 0) {
            Write-Host "Found $($foundLocations.Count) REGISTRY location(s) with SimplySignDesktopShowLogonDialogAfterApplicationStartup:"
            $foundLocations | ForEach-Object { Write-Host "   $_" }
            
            # Try to read the actual values
            Write-Host ""
            Write-Host "READING REGISTRY VALUES:"
            foreach ($location in $foundLocations) {
                if ($location -match "HKEY_") {
                    try {
                        $regPath = $location -replace "HKEY_CURRENT_USER", "HKCU:" -replace "HKEY_LOCAL_MACHINE", "HKLM:"
                        $value = Get-ItemProperty -Path $regPath -Name "SimplySignDesktopShowLogonDialogAfterApplicationStartup" -ErrorAction SilentlyContinue
                        if ($value) {
                            Write-Host "$regPath"
                            Write-Host "   SimplySignDesktopShowLogonDialogAfterApplicationStartup = $($value.SimplySignDesktopShowLogonDialogAfterApplicationStartup)"
                        }
                    } catch {
                        Write-Host "Could not read value from $location"
                    }
                }
            }
        }
        
        if ($foundFiles.Count -gt 0) {
            Write-Host ""
            Write-Host "Found $($foundFiles.Count) FILE(s) with SimplySignDesktopShowLogonDialogAfterApplicationStartup:"
            $foundFiles | ForEach-Object { Write-Host "   $_" }
        }
        
        if ($totalFound -eq 0) {
            Write-Host "NO MATCHES FOUND in registry or files"
            Write-Host "The setting may be:"
            Write-Host "   1. Stored in a different format/name"
            Write-Host "   2. Created only after user interaction"
            Write-Host "   3. Stored in a different location we haven't checked"
            Write-Host "   4. Not yet created (first run hasn't happened)"
        } else {
            Write-Host ""
            Write-Host "Found $totalFound total location(s) with the setting"
        }
        
        # Also search for any Certum or SimplySign related settings for context
        Write-Host ""
        Write-Host "SEARCHING FOR ANY CERTUM/SIMPLYSIGN SETTINGS FOR CONTEXT..."
        try {
            $certumOutput = cmd /c "reg query HKCU /s /f Certum 2>nul" | Select-Object -First 20
            if ($certumOutput) {
                Write-Host "Found Certum registry entries:"
                $certumOutput | ForEach-Object { Write-Host "   $_" }
            }
        } catch {}
        
        Write-Host ""
        Write-Host "NEXT STEPS:"
        Write-Host "=============="
        Write-Host "If setting was found: We can modify it directly"
        Write-Host "If setting not found: May need to trigger first-time setup or user interaction"
        Write-Host "Registry search completed"
      shell: powershell

    # Step 8: Modify Found Setting (if located)
    - name: Modify SimplySignDesktopShowLogonDialogAfterApplicationStartup Setting
      run: |
        Write-Host "=== MODIFYING FOUND SETTING ==="
        Write-Host "Searching for existing SimplySignDesktopShowLogonDialogAfterApplicationStartup setting..."
        Write-Host ""
        
        $settingFound = $false
        $modificationSuccess = $false
        $settingLocation = ""
        $settingType = ""
        
        # Search for the exact setting in likely registry locations
        $searchPaths = @(
            "HKCU:\Software\Certum",
            "HKCU:\Software\SimplySign",
            "HKCU:\Software\SimplySignDesktop",
            "HKLM:\SOFTWARE\Certum",
            "HKLM:\SOFTWARE\SimplySign"
        )
        
        # First check registry locations
        foreach ($regPath in $searchPaths) {
            if (Test-Path $regPath) {
                try {
                    $existingValue = Get-ItemProperty -Path $regPath -Name "SimplySignDesktopShowLogonDialogAfterApplicationStartup" -ErrorAction SilentlyContinue
                    if ($existingValue) {
                        $settingFound = $true
                        $settingLocation = $regPath
                        $settingType = "REGISTRY"
                        $currentValue = $existingValue.SimplySignDesktopShowLogonDialogAfterApplicationStartup
                        Write-Host "FOUND SETTING in REGISTRY at: $regPath"
                        Write-Host "   Current value: $currentValue"
                        
                        if ($currentValue -eq "No") {
                            Write-Host "   Confirmed default value is 'No' - this is the setting we need!"
                            
                            # Change it to Yes
                            try {
                                Set-ItemProperty -Path $regPath -Name "SimplySignDesktopShowLogonDialogAfterApplicationStartup" -Value "Yes"
                                Write-Host "   CHANGED TO: Yes"
                                $modificationSuccess = $true
                                
                                # Verify the change
                                $newValue = Get-ItemProperty -Path $regPath -Name "SimplySignDesktopShowLogonDialogAfterApplicationStartup"
                                Write-Host "   Verified new value: $($newValue.SimplySignDesktopShowLogonDialogAfterApplicationStartup)"
                                
                            } catch {
                                Write-Host "   Failed to modify setting: $($_.Exception.Message)"
                            }
                        } else {
                            Write-Host "   Value is not 'No' (it's '$currentValue') - unexpected!"
                        }
                        break
                    }
                } catch {
                    # Setting doesn't exist in this path - continue searching
                }
            }
        }
        
        # If not found in registry, check AppData files
        if (-not $settingFound) {
            Write-Host "Setting not found in registry, checking AppData files..."
            
            $appDataPaths = @(
                "$env:APPDATA\Certum",
                "$env:APPDATA\SimplySign", 
                "$env:LOCALAPPDATA\Certum",
                "$env:LOCALAPPDATA\SimplySign"
            )
            
            foreach ($path in $appDataPaths) {
                if (Test-Path $path) {
                    $configFiles = Get-ChildItem -Path $path -Recurse -Include "*.xml", "*.plist", "*.config", "*.ini", "*.json", "*.cfg", "*.properties" -ErrorAction SilentlyContinue
                    
                    foreach ($file in $configFiles) {
                        try {
                            $content = Get-Content -Path $file.FullName -Raw -ErrorAction SilentlyContinue
                            if ($content -and $content -match "SimplySignDesktopShowLogonDialogAfterApplicationStartup") {
                                $settingFound = $true
                                $settingLocation = $file.FullName
                                $settingType = "FILE"
                                
                                Write-Host "🎯 FOUND SETTING in FILE: $($file.FullName)"
                                
                                # Check if it contains "No" value
                                if ($content -match 'SimplySignDesktopShowLogonDialogAfterApplicationStartup.*No') {
                                    Write-Host "   Found 'No' value in file - attempting to change to 'Yes'"
                                    
                                    try {
                                        # Replace No with Yes in the file
                                        $newContent = $content -replace '(SimplySignDesktopShowLogonDialogAfterApplicationStartup.*?)No', '$1Yes'
                                        Set-Content -Path $file.FullName -Value $newContent
                                        Write-Host "   CHANGED TO: Yes in file"
                                        $modificationSuccess = $true
                                        
                                        # Verify the change
                                        $verifyContent = Get-Content -Path $file.FullName -Raw
                                        if ($verifyContent -match 'SimplySignDesktopShowLogonDialogAfterApplicationStartup.*Yes') {
                                            Write-Host "   Verified new value in file: Yes"
                                        }
                                        
                                    } catch {
                                        Write-Host "   Failed to modify file: $($_.Exception.Message)"
                                    }
                                }
                                break
                            }
                        } catch {
                            # Continue searching other files
                        }
                    }
                    
                    if ($settingFound) { break }
                }
            }
        }
        
        if (-not $settingFound) {
            Write-Host "SimplySignDesktopShowLogonDialogAfterApplicationStartup setting NOT FOUND"
            Write-Host "Possible reasons:"
            Write-Host "   1. Setting is created only after first user interaction"
            Write-Host "   2. Setting is stored in a file, not registry"
            Write-Host "   3. Setting name is different on Windows"
            Write-Host "   4. Application hasn't been run with user interaction yet"
            Write-Host ""
            Write-Host "Will check for any user preference files..."
            
            # Check for preference files in AppData
            $appDataPaths = @(
                "$env:APPDATA\Certum",
                "$env:APPDATA\SimplySign",
                "$env:LOCALAPPDATA\Certum",
                "$env:LOCALAPPDATA\SimplySign"
            )
            
            foreach ($path in $appDataPaths) {
                if (Test-Path $path) {
                    Write-Host "Found: $path"
                    Get-ChildItem -Path $path -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
                        Write-Host "   $($_.FullName)"
                    }
                }
            }
        }
        
        Write-Host ""
        Write-Host "MODIFICATION SUMMARY:"
        Write-Host "======================="
        Write-Host "Setting found: $settingFound"
        Write-Host "Setting type: $settingType"
        Write-Host "Setting location: $settingLocation"
        Write-Host "Modification successful: $modificationSuccess"
        
        if ($modificationSuccess) {
            Write-Host "SUCCESS: SimplySignDesktopShowLogonDialogAfterApplicationStartup changed from 'No' to 'Yes'"
            Write-Host "Location: $settingLocation ($settingType)"
            Write-Host "Next step: Start SimplySign and check if login dialog appears"
        } else {
            Write-Host "Could not modify setting - may need different approach"
            if (-not $settingFound) {
                Write-Host "Setting was not found in:"
                Write-Host "  - Registry (HKCU/HKLM Software paths)"
                Write-Host "  - AppData files (XML, config, ini, json, etc.)"
                Write-Host "  - User profile documents"
            }
        }
      shell: powershell

    # Step 9: Test Modified Setting
    - name: Test SimplySign with Modified Setting
      run: |
        Write-Host "=== TESTING MODIFIED SETTING ==="
        Write-Host "Restarting SimplySign to test if login dialog now appears..."
        Write-Host ""
        
        # Locate SimplySign executable
        $possiblePaths = @(
            "${env:ProgramFiles}\Certum\SimplySign Desktop\SimplySignDesktop.exe",
            "${env:ProgramFiles(x86)}\Certum\SimplySign Desktop\SimplySignDesktop.exe",
            "${env:ProgramFiles}\Certum\SimplySign Desktop\SimplySign Desktop.exe",
            "${env:ProgramFiles(x86)}\Certum\SimplySign Desktop\SimplySign Desktop.exe"
        )
        
        $exePath = $null
        foreach ($path in $possiblePaths) {
            if (Test-Path $path) {
                $exePath = $path
                Write-Host "Found SimplySign at: $path"
                break
            }
        }
        
        if (-not $exePath) {
            Write-Host "Could not locate SimplySign executable"
            exit 1
        }
        
        # Start SimplySign with modified setting
        Write-Host "Starting SimplySign with SimplySignDesktopShowLogonDialogAfterApplicationStartup = Yes..."
        try {
            $process = Start-Process -FilePath $exePath -WindowStyle Hidden -PassThru
            Write-Host "Started SimplySign (PID: $($process.Id))"
            
            # Give it time to initialize and potentially show login dialog
            Write-Host "Waiting 15 seconds for initialization and login dialog..."
            Start-Sleep -Seconds 15
            
            # Check process status
            if (-not $process.HasExited) {
                Write-Host "Process is running and stable"
                
                # Check for multiple processes
                $allProcesses = Get-Process -Name "*SimplySign*" -ErrorAction SilentlyContinue
                Write-Host "Total SimplySign processes: $($allProcesses.Count)"
                $allProcesses | ForEach-Object {
                    Write-Host "   PID $($_.Id): $($_.ProcessName)"
                }
            } else {
                Write-Host "Process exited during initialization (Exit Code: $($process.ExitCode))"
            }
            
        } catch {
            Write-Host "Failed to start SimplySign: $($_.Exception.Message)"
            exit 1
        }
        
        Write-Host ""
        Write-Host "CRITICAL TEST COMPLETED"
        Write-Host "=========================="
        Write-Host "SimplySign started with SimplySignDesktopShowLogonDialogAfterApplicationStartup = Yes"
        Write-Host "Next step: Run login dialog detection to see if it worked"
      shell: powershell

    # Step 10: Start Network Monitoring (if enabled)
    - name: Start OAuth2 Network Monitoring
      if: inputs.enable_network_monitoring == true
      run: |
        echo "=== STARTING OAUTH2 NETWORK MONITORING ==="
        echo "Monitoring for requests to cloudsign.webnotarius.pl..."
        
        # Start background network monitoring
        powershell -Command "
          Write-Host 'Starting OAuth2 network capture...'
          \$job = Start-Job -ScriptBlock {
            param(\$duration)
            \$endTime = (Get-Date).AddSeconds(\$duration)
            while ((Get-Date) -lt \$endTime) {
              # Check for network connections to webnotarius
              \$connections = netstat -an | Select-String 'webnotarius'
              if (\$connections) {
                Write-Host \"[\$(Get-Date)] OAuth2 connection detected: \$connections\"
              }
              
              # Monitor DNS queries
              try {
                \$dnsResult = nslookup cloudsign.webnotarius.pl 2>null
                if (\$dnsResult -and \$dnsResult -notlike '*can''t find*') {
                  Write-Host \"[\$(Get-Date)] DNS resolution successful for OAuth2 endpoint\"
                }
              } catch {}
              
              Start-Sleep -Seconds 2
            }
          } -ArgumentList ${{ inputs.detection_timeout }}
          
          Write-Host \"Network monitoring job started (ID: \$(\$job.Id))\"
          \$job.Id | Out-File -FilePath 'network_monitor_job.id' -Encoding ASCII
        " 2>&1 | tee network_monitor_start.log
      shell: bash

    # Step 11: Login Dialog Detection After Setting Modification
    - name: Detect Login Dialog - Multiple Methods + Command Testing
      env:
        DETECTION_TIMEOUT: ${{ inputs.detection_timeout }}
        DEBUG_MODE: ${{ inputs.debug_mode }}
      run: |
        echo "=== COMPREHENSIVE LOGIN DIALOG DETECTION + COMMAND TESTING ==="
        echo "Testing detection methods AND command invocation in GitHub Actions environment"
        echo "Detection timeout: $env:DETECTION_TIMEOUT seconds"
        echo "Debug mode: $env:DEBUG_MODE"
        echo ""
        
        $timeout = [int]$env:DETECTION_TIMEOUT
        $debug = if ($env:DEBUG_MODE -eq "true") { $true } else { $false }
        
        # First, run our standard detection
        Write-Host "=== PHASE 1: STANDARD DETECTION ==="
        Write-Host "Executing comprehensive dialog detection script..."
        try {
            $result = powershell -ExecutionPolicy Bypass -File "./.github/scripts/detect-login-dialog.ps1" -TimeoutSeconds 30 -DebugMode $debug
            Write-Host "Detection script result: $result"
        } catch {
            Write-Host "Detection script error: $($_.Exception.Message)"
        }
        
        Write-Host ""
        Write-Host "=== PHASE 2: COMMAND INVOCATION TESTING ==="
        Write-Host "Attempting to trigger 'Connect with cloud' programmatically..."
        
        # Try to find and invoke "Connect with cloud" command
        # Method 1: Look for menu automation
        Write-Host "Method 1: UI Automation approach..."
        try {
            Add-Type -AssemblyName UIAutomationClient
            Add-Type -AssemblyName UIAutomationTypes
            
            # Find SimplySign window
            $automation = [System.Windows.Automation.AutomationElement]::RootElement
            $condition = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, "*SimplySign*")
            $simplySignWindow = $automation.FindFirst([System.Windows.Automation.TreeScope]::Children, $condition)
            
            if ($simplySignWindow) {
                Write-Host "Found SimplySign window: $($simplySignWindow.Current.Name)"
                
                # Look for menu items or buttons related to cloud connection
                $menuCondition = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ControlTypeProperty, [System.Windows.Automation.ControlType]::MenuItem)
                $menuItems = $simplySignWindow.FindAll([System.Windows.Automation.TreeScope]::Descendants, $menuCondition)
                
                Write-Host "Found $($menuItems.Count) menu items"
                foreach ($item in $menuItems) {
                    $name = $item.Current.Name
                    if ($name -like "*cloud*" -or $name -like "*connect*" -or $name -like "*login*") {
                        Write-Host "  Potential cloud menu: $name"
                    }
                }
            } else {
                Write-Host "Could not find SimplySign window for UI automation"
            }
        } catch {
            Write-Host "UI Automation failed: $($_.Exception.Message)"
        }
        
        # Method 2: Command line parameters
        Write-Host ""
        Write-Host "Method 2: Command line parameters..."
        $possibleCommands = @(
            "/connect",
            "/cloud",
            "/login",
            "/auth",
            "/show-login",
            "-connect",
            "-cloud",
            "-login"
        )
        
        foreach ($cmd in $possibleCommands) {
            Write-Host "Testing parameter: $cmd"
            # This would normally try to start with the parameter, but we'll skip actual execution
            # to avoid process conflicts
        }
        
        # Method 3: Registry triggers
        Write-Host ""
        Write-Host "Method 3: Additional registry triggers..."
        try {
            # Try setting additional registry values that might trigger immediate connection
            $regPath = "HKCU:\Software\Certum"
            if (Test-Path $regPath) {
                New-ItemProperty -Path $regPath -Name "TriggerCloudConnection" -Value "Yes" -PropertyType String -Force | Out-Null
                New-ItemProperty -Path $regPath -Name "ForceConnectWithCloud" -Value "Yes" -PropertyType String -Force | Out-Null
                Write-Host "Set additional trigger registry values"
            }
        } catch {
            Write-Host "Could not set additional registry triggers: $($_.Exception.Message)"
        }
        
        Write-Host ""
        Write-Host "=== PHASE 3: POST-COMMAND DETECTION ==="
        Write-Host "Running detection again after command attempts..."
        
        # Wait a moment for any triggered dialogs
        Start-Sleep -Seconds 5
        
        # Run detection again
        try {
            $result2 = powershell -ExecutionPolicy Bypass -File "./.github/scripts/detect-login-dialog.ps1" -TimeoutSeconds 30 -DebugMode $debug
            Write-Host "Post-command detection result: $result2"
        } catch {
            Write-Host "Post-command detection error: $($_.Exception.Message)"
        }
        
        Write-Host ""
        Write-Host "=== PHASE 4: FINAL LONG-TERM DETECTION ==="
        Write-Host "Running extended detection for remaining timeout period..."
        
        $remainingTimeout = $timeout - 70  # Account for time already spent
        if ($remainingTimeout -gt 0) {
            try {
                $finalResult = powershell -ExecutionPolicy Bypass -File "./.github/scripts/detect-login-dialog.ps1" -TimeoutSeconds $remainingTimeout -DebugMode $debug
                Write-Host "Final detection result: $finalResult"
            } catch {
                Write-Host "Final detection error: $($_.Exception.Message)"
            }
        } else {
            Write-Host "No remaining time for extended detection"
        }
        
        Write-Host ""
        Write-Host "=== DETECTION AND COMMAND TESTING COMPLETED ==="
        
      shell: powershell

    # Step 12: Stop Network Monitoring and Collect Results
    - name: Collect Network Monitoring Results
      if: inputs.enable_network_monitoring == true
      run: |
        echo "=== COLLECTING NETWORK MONITORING RESULTS ==="
        
        if [ -f "network_monitor_job.id" ]; then
          JOB_ID=$(tr -cd '0-9' < network_monitor_job.id)
          echo "Retrieving network monitoring results from job ID: $JOB_ID"
          
          powershell -Command "
            try {
              \$job = Get-Job -Id $JOB_ID -ErrorAction SilentlyContinue
              if (\$job) {
                Write-Host 'Network monitoring job status: ' + \$job.State
                \$results = Receive-Job -Job \$job
                if (\$results) {
                  Write-Host 'Network monitoring results:'
                  \$results | ForEach-Object { Write-Host \"   \$_\" }
                } else {
                  Write-Host 'No network activity detected during monitoring period'
                }
                Remove-Job -Job \$job -Force
              } else {
                Write-Host 'Network monitoring job not found'
              }
            } catch {
              Write-Host \"Error retrieving network results: \$(\$_.Exception.Message)\"
            }
          "
        else
          echo "Network monitor job ID not found"
        fi
      shell: bash

    # Step 13: Upload Diagnostic Results
    - name: Upload Detection Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: login-dialog-detection-results
        path: |
          detection_results.json
          network_monitor_start.log
          .github/scripts/detect-login-dialog.ps1
          *.log
          *.reg
          registry_changes_*.txt
          full_changes_*.txt
          processes_*.csv
        retention-days: 7
        compression-level: 9

    # Step 14: Generate Summary Report
    - name: Generate Diagnostic Summary
      if: always()
      run: |
        echo "=== LOGIN DIALOG DETECTION DIAGNOSTIC SUMMARY ==="
        echo "Date: $(date)"
        echo "Environment: GitHub Actions Windows Runner"
        echo "Detection timeout: ${{ inputs.detection_timeout }} seconds"
        echo "Network monitoring: ${{ inputs.enable_network_monitoring }}"
        echo ""
        
        if [ -f "detection_results.json" ]; then
          echo "Detection Results:"
          cat detection_results.json | python -m json.tool 2>/dev/null || cat detection_results.json
          echo ""
        fi
        
        echo "Key Questions Answered:"
        echo "1. Does SimplySign Desktop start successfully in GitHub Actions? [Check process launch]"
        echo "2. Does a login dialog actually appear? [Check detection methods]"  
        echo "3. Is it a native dialog or web view? [Check WebView detection]"
        echo "4. Are there OAuth2 network requests? [Check network monitoring]"
        echo "5. How long does initialization take? [Check timing in logs]"
        echo ""
        
        echo "Next Steps Based on Results:"
        echo "- If no detection: Login dialog doesn't appear in headless mode"
        echo "- If WebView detected: Need web automation instead of window automation" 
        echo "- If network detected: OAuth2 flow is active, could bypass GUI"
        echo "- If process issues: Need to fix SimplySign startup configuration"
        echo ""
        
        echo "🔗 Related Files:"
        echo "- detection_results.json: Detailed detection method results"
        echo "- dialog_detection.ps1: Full detection script for reference"
        echo "- *.log: Various monitoring and debug logs"
        
      shell: bash
