name: Login Dialog Detection Diagnostic

on:
  workflow_dispatch:
    inputs:
      detection_timeout:
        description: 'Detection timeout in seconds'
        required: false
        default: '180'
        type: string
      enable_network_monitoring:
        description: 'Enable OAuth2 network monitoring'
        required: false
        default: true
        type: boolean
      debug_mode:
        description: 'Enable verbose debugging'
        required: false
        default: false
        type: boolean

jobs:
  login-dialog-diagnostic:
    runs-on: windows-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Step 0: Ensure Clean Environment
    - name: Clean SimplySign Environment
      run: |
        echo "=== ENSURING CLEAN SIMPLYSIGN ENVIRONMENT ==="
        echo "Terminating any existing SimplySign processes..."
        
        # Kill any existing SimplySign processes
        $processes = Get-Process -Name "*SimplySign*" -ErrorAction SilentlyContinue
        if ($processes) {
          Write-Host "Found $($processes.Count) existing SimplySign processes"
          $processes | ForEach-Object {
            Write-Host "Terminating: $($_.ProcessName) (PID: $($_.Id))"
            try {
              $_ | Stop-Process -Force
              Write-Host "✅ Successfully terminated PID $($_.Id)"
            } catch {
              Write-Host "⚠️ Could not terminate PID $($_.Id): $($_.Exception.Message)"
            }
          }
          
          # Wait for processes to fully terminate
          Start-Sleep -Seconds 3
          
          # Verify cleanup
          $remainingProcesses = Get-Process -Name "*SimplySign*" -ErrorAction SilentlyContinue
          if ($remainingProcesses) {
            Write-Host "❌ Warning: $($remainingProcesses.Count) processes still running"
            $remainingProcesses | ForEach-Object { Write-Host "  Still running: $($_.ProcessName) (PID: $($_.Id))" }
          } else {
            Write-Host "✅ All SimplySign processes terminated successfully"
          }
        } else {
          Write-Host "✅ No existing SimplySign processes found"
        }
        
        # Clean any existing registry configuration
        Write-Host "Cleaning existing registry configuration..."
        $regPaths = @(
          "HKCU:\Software\Certum",
          "HKCU:\Software\SimplySignDesktop", 
          "HKCU:\Software\Asseco"
        )
        
        foreach ($regPath in $regPaths) {
          if (Test-Path $regPath) {
            try {
              Remove-Item -Path $regPath -Recurse -Force -ErrorAction SilentlyContinue
              Write-Host "✅ Cleaned registry path: $regPath"
            } catch {
              Write-Host "⚠️ Could not clean registry path: $regPath"
            }
          }
        }
        
        Write-Host "✅ Environment cleanup completed"
      shell: powershell

    # Step 1: Take Registry Snapshot BEFORE Installation
    - name: Take Pre-Installation Registry Snapshot
      run: |
        echo "=== TAKING PRE-INSTALLATION REGISTRY SNAPSHOT ==="
        echo "Capturing registry state before SimplySign installation..."
        
        # Export relevant registry sections to files
        $regPaths = @(
          "HKCU\Software\Certum",
          "HKCU\Software\SimplySignDesktop", 
          "HKCU\Software\Asseco",
          "HKLM\SOFTWARE\Certum",
          "HKLM\SOFTWARE\SimplySignDesktop",
          "HKLM\SOFTWARE\Asseco"
        )
        
        Write-Host "Exporting registry sections before installation..."
        foreach ($regPath in $regPaths) {
          $fileName = "before_" + ($regPath -replace "\\", "_" -replace ":", "") + ".reg"
          try {
            # Use cmd to run reg export and capture both stdout and stderr
            $output = cmd /c "reg export `"$regPath`" `"$fileName`" /y 2>&1"
            $exitCode = $LASTEXITCODE
            
            if ($exitCode -eq 0) {
              Write-Host "✅ Exported: $regPath -> $fileName"
            } else {
              # Registry key doesn't exist yet - this is expected before installation
              Write-Host "⚪ Registry key not found (expected): $regPath"
              # Create empty baseline file for comparison later
              "Windows Registry Editor Version 5.00`r`n`r`n; Registry key did not exist before installation`r`n" | Out-File -FilePath $fileName -Encoding ASCII
            }
          } catch {
            Write-Host "⚠️ Could not export $regPath : $($_.Exception.Message)"
            "Windows Registry Editor Version 5.00`r`n`r`n; Export failed: $($_.Exception.Message)`r`n" | Out-File -FilePath $fileName -Encoding ASCII
          }
        }
        
        # Also capture process list before installation
        Write-Host "Capturing running processes before installation..."
        Get-Process | Select-Object Name, Id, ProcessName | Export-Csv -Path "processes_before.csv" -NoTypeInformation
        
        Write-Host "✅ Pre-installation snapshot completed"
        Get-ChildItem -Name "before_*.reg" | ForEach-Object { Write-Host "  Created: $_" }
      shell: powershell

    # Step 2: Install SimplySign Desktop
    - name: Install SimplySign Desktop  
      run: |
        echo "=== INSTALLING SIMPLYSIGN DESKTOP ==="
        echo "🔽 Downloading and installing for diagnostic testing..."
        echo "Using stable version 9.1.5.52 as configured in install-simplysign.sh"
        chmod +x ./.github/scripts/install-simplysign.sh
        ./.github/scripts/install-simplysign.sh
      shell: bash

    # Step 3: Take Registry Snapshot AFTER Installation
    - name: Take Post-Installation Registry Snapshot
      run: |
        echo "=== TAKING POST-INSTALLATION REGISTRY SNAPSHOT ==="
        echo "Capturing registry state after SimplySign installation..."
        
        # Export same registry sections after installation
        $regPaths = @(
          "HKCU\Software\Certum",
          "HKCU\Software\SimplySignDesktop", 
          "HKCU\Software\Asseco",
          "HKLM\SOFTWARE\Certum",
          "HKLM\SOFTWARE\SimplySignDesktop",
          "HKLM\SOFTWARE\Asseco"
        )
        
        Write-Host "Exporting registry sections after installation..."
        foreach ($regPath in $regPaths) {
          $fileName = "after_" + ($regPath -replace "\\", "_" -replace ":", "") + ".reg"
          try {
            # Use cmd to run reg export and capture both stdout and stderr
            $output = cmd /c "reg export `"$regPath`" `"$fileName`" /y 2>&1"
            $exitCode = $LASTEXITCODE
            
            if ($exitCode -eq 0) {
              Write-Host "✅ Exported: $regPath -> $fileName"
            } else {
              # Registry key still doesn't exist after installation
              Write-Host "⚪ Registry key still not found: $regPath"
              "Windows Registry Editor Version 5.00`r`n`r`n; Registry key did not exist after installation`r`n" | Out-File -FilePath $fileName -Encoding ASCII
            }
          } catch {
            Write-Host "⚠️ Could not export $regPath : $($_.Exception.Message)"
            "Windows Registry Editor Version 5.00`r`n`r`n; Export failed: $($_.Exception.Message)`r`n" | Out-File -FilePath $fileName -Encoding ASCII
          }
        }
        
        # Capture process list after installation
        Get-Process | Select-Object Name, Id, ProcessName | Export-Csv -Path "processes_after.csv" -NoTypeInformation
        
        Write-Host "✅ Post-installation snapshot completed"
        Get-ChildItem -Name "after_*.reg" | ForEach-Object { Write-Host "  Created: $_" }
      shell: powershell

    # Step 4: Analyze Registry Changes
    - name: Analyze Registry Changes
      run: |
        echo "=== ANALYZING REGISTRY CHANGES ==="
        echo "Comparing before/after registry snapshots to find what SimplySign actually sets..."
        
        # Compare each registry section
        $regSections = @(
          "HKCU_Software_Certum",
          "HKCU_Software_SimplySignDesktop", 
          "HKCU_Software_Asseco",
          "HKLM_SOFTWARE_Certum",
          "HKLM_SOFTWARE_SimplySignDesktop",
          "HKLM_SOFTWARE_Asseco"
        )
        
        $changesFound = $false
        
        foreach ($section in $regSections) {
          $beforeFile = "before_$section.reg"
          $afterFile = "after_$section.reg"
          
          if ((Test-Path $beforeFile) -and (Test-Path $afterFile)) {
            Write-Host ""
            Write-Host "=== ANALYZING: $section ==="
            
            $beforeContent = Get-Content $beforeFile -Raw
            $afterContent = Get-Content $afterFile -Raw
            
            if ($beforeContent -ne $afterContent) {
              Write-Host "🔍 CHANGES DETECTED in $section"
              $changesFound = $true
              
              # Try to extract meaningful differences
              $beforeLines = Get-Content $beforeFile
              $afterLines = Get-Content $afterFile
              
              # Find new lines (in after but not in before)
              $newLines = Compare-Object $beforeLines $afterLines | Where-Object { $_.SideIndicator -eq "=>" }
              
              if ($newLines) {
                Write-Host "  NEW REGISTRY ENTRIES:"
                foreach ($line in $newLines) {
                  $content = $line.InputObject
                  if ($content -match '^".*"=') {
                    Write-Host "    $content"
                    
                    # Look for dialog/cloud/login related entries
                    if ($content -match "(dialog|cloud|login|logon|connect|auth)" -and $content -notmatch "^;") {
                      Write-Host "    ⭐ POTENTIAL LOGIN TRIGGER: $content"
                    }
                  }
                }
              }
              
              # Save detailed diff to file
              $diffFile = "registry_changes_$section.txt"
              Compare-Object $beforeLines $afterLines | Out-File $diffFile
              Write-Host "  📄 Detailed diff saved to: $diffFile"
              
            } else {
              Write-Host "⚪ No changes in $section"
            }
          } else {
            Write-Host "⚠️ Missing files for $section comparison"
          }
        }
        
        if (-not $changesFound) {
          Write-Host ""
          Write-Host "❌ NO REGISTRY CHANGES DETECTED"
          Write-Host "This could mean:"
          Write-Host "  1. SimplySign doesn't create registry entries during installation"
          Write-Host "  2. Registry entries are created on first run, not during install"
          Write-Host "  3. We're looking in the wrong registry locations"
        } else {
          Write-Host ""
          Write-Host "✅ Registry changes detected and analyzed"
          Write-Host "Look for lines marked with ⭐ POTENTIAL LOGIN TRIGGER above"
        }
        
        # Process changes
        Write-Host ""
        Write-Host "=== PROCESS CHANGES ==="
        if ((Test-Path "processes_before.csv") -and (Test-Path "processes_after.csv")) {
          $processesBefore = Import-Csv "processes_before.csv"
          $processesAfter = Import-Csv "processes_after.csv"
          
          $newProcesses = Compare-Object $processesBefore $processesAfter -Property Name | Where-Object { $_.SideIndicator -eq "=>" }
          if ($newProcesses) {
            Write-Host "New processes after installation:"
            $newProcesses | ForEach-Object { Write-Host "  + $($_.Name)" }
          } else {
            Write-Host "No new processes detected"
          }
        }
        
        echo "✅ Registry analysis completed"
      shell: powershell

    # Step 5: Configure Based on Discovered Settings (if any found)
    - name: Configure SimplySign for Login Dialog
      run: |
        echo "=== CONFIGURING SIMPLYSIGN FOR LOGIN DIALOG ==="
        echo "Setting registry keys to trigger login dialog on startup..."
        echo "Using targeted approach based on common login dialog patterns"
        
        # Only configure the primary registry path for now
        $regPath = "HKCU:\Software\Certum"
        
        try {
          if (-not (Test-Path $regPath)) {
            New-Item -Path $regPath -Force | Out-Null
            Write-Host "✅ Created registry path: $regPath"
          }
          
          # Test the most likely login dialog triggers one at a time
          $targetSettings = @{
            # Based on UI text you mentioned: "Show logon dialog to the cloud after application startup"
            'ShowLogonDialogToTheCloudAfterApplicationStartup' = 'Yes'
          }
          
          foreach ($setting in $targetSettings.GetEnumerator()) {
            try {
              New-ItemProperty -Path $regPath -Name $setting.Key -Value $setting.Value -PropertyType String -Force | Out-Null
              Write-Host "✅ Set $($setting.Key) = $($setting.Value)"
            } catch {
              Write-Host "⚠️ Could not set $($setting.Key): $($_.Exception.Message)"
            }
          }
          
          Write-Host "✅ Targeted registry configuration completed"
          
          # Verify what was actually set
          Write-Host ""
          Write-Host "=== REGISTRY VERIFICATION ==="
          $properties = Get-ItemProperty -Path $regPath -ErrorAction SilentlyContinue
          if ($properties) {
            $properties.PSObject.Properties | Where-Object { $_.Name -notlike "PS*" } | ForEach-Object {
              Write-Host "  $($_.Name) = $($_.Value)"
            }
          }
          
        } catch {
          Write-Host "❌ Could not configure registry: $($_.Exception.Message)"
        }
        
        echo "✅ Registry configuration completed - ready for clean application start"
      shell: powershell

    # Step 6: Start SimplySign Desktop with Clean Configuration
    - name: Start SimplySign Desktop (Clean Configuration)
      run: |
        echo "=== STARTING SIMPLYSIGN DESKTOP WITH CLEAN CONFIGURATION ==="
        echo "This is the critical step - first start with login dialog configuration"
        
        # Locate SimplySign Desktop executable
        $possiblePaths = @(
            "${env:ProgramFiles}\Certum\SimplySign Desktop\SimplySignDesktop.exe",
            "${env:ProgramFiles(x86)}\Certum\SimplySign Desktop\SimplySignDesktop.exe",
            "${env:ProgramFiles}\Certum\SimplySign Desktop\SimplySign Desktop.exe",
            "${env:ProgramFiles(x86)}\Certum\SimplySign Desktop\SimplySign Desktop.exe"
        )
        
        $exePath = $null
        foreach ($path in $possiblePaths) {
            if (Test-Path $path) {
                $exePath = $path
                Write-Host "✅ Found SimplySign Desktop at: $path"
                break
            }
        }
        
        if (-not $exePath) {
            Write-Host "❌ Could not locate SimplySign Desktop executable"
            exit 1
        }
        
        # Start SimplySign Desktop with clean configuration
        Write-Host "Starting SimplySign Desktop with configured settings..."
        Write-Host "Command: Start-Process '$exePath' -WindowStyle Hidden -PassThru"
        
        try {
            $process = Start-Process -FilePath $exePath -WindowStyle Hidden -PassThru
            Write-Host "✅ SimplySign Desktop started successfully (PID: $($process.Id))"
            
            # Give it time to initialize and potentially show login dialog
            Write-Host "Waiting 10 seconds for initialization and dialog appearance..."
            Start-Sleep -Seconds 10
            
            # Check if process is still running
            if (-not $process.HasExited) {
                Write-Host "✅ Process is running and stable"
                
                # Check for any additional SimplySign processes that might have spawned
                $allProcesses = Get-Process -Name "*SimplySign*" -ErrorAction SilentlyContinue
                Write-Host "Total SimplySign processes: $($allProcesses.Count)"
                $allProcesses | ForEach-Object {
                    Write-Host "  PID $($_.Id): $($_.ProcessName)"
                }
            } else {
                Write-Host "⚠️ Process exited during initialization (Exit Code: $($process.ExitCode))"
            }
            
        } catch {
            Write-Host "❌ Failed to start SimplySign Desktop: $($_.Exception.Message)"
            exit 1
        }
        
        echo "✅ SimplySign Desktop startup completed"
      shell: powershell

    # Step 3: Start Network Monitoring (if enabled)
    - name: Start OAuth2 Network Monitoring
      if: inputs.enable_network_monitoring == true
      run: |
        echo "=== STARTING OAUTH2 NETWORK MONITORING ==="
        echo "Monitoring for requests to cloudsign.webnotarius.pl..."
        
        # Start background network monitoring
        powershell -Command "
          Write-Host 'Starting OAuth2 network capture...'
          \$job = Start-Job -ScriptBlock {
            param(\$duration)
            \$endTime = (Get-Date).AddSeconds(\$duration)
            while ((Get-Date) -lt \$endTime) {
              # Check for network connections to webnotarius
              \$connections = netstat -an | Select-String 'webnotarius'
              if (\$connections) {
                Write-Host \"[\$(Get-Date)] OAuth2 connection detected: \$connections\"
              }
              
              # Monitor DNS queries
              try {
                \$dnsResult = nslookup cloudsign.webnotarius.pl 2>null
                if (\$dnsResult -and \$dnsResult -notlike '*can''t find*') {
                  Write-Host \"[\$(Get-Date)] DNS resolution successful for OAuth2 endpoint\"
                }
              } catch {}
              
              Start-Sleep -Seconds 2
            }
          } -ArgumentList ${{ inputs.detection_timeout }}
          
          Write-Host \"Network monitoring job started (ID: \$(\$job.Id))\"
          \$job.Id | Out-File -FilePath 'network_monitor_job.id'
        " 2>&1 | tee network_monitor_start.log
      shell: bash

    # Step 4: Immediate Login Dialog Detection + Command Testing
    - name: Detect Login Dialog - Multiple Methods + Command Testing
      env:
        DETECTION_TIMEOUT: ${{ inputs.detection_timeout }}
        DEBUG_MODE: ${{ inputs.debug_mode }}
      run: |
        echo "=== COMPREHENSIVE LOGIN DIALOG DETECTION + COMMAND TESTING ==="
        echo "Testing detection methods AND command invocation in GitHub Actions environment"
        echo "Detection timeout: $env:DETECTION_TIMEOUT seconds"
        echo "Debug mode: $env:DEBUG_MODE"
        echo ""
        
        $timeout = [int]$env:DETECTION_TIMEOUT
        $debug = if ($env:DEBUG_MODE -eq "true") { $true } else { $false }
        
        # First, run our standard detection
        Write-Host "=== PHASE 1: STANDARD DETECTION ==="
        Write-Host "Executing comprehensive dialog detection script..."
        try {
            $result = powershell -ExecutionPolicy Bypass -File "./.github/scripts/detect-login-dialog.ps1" -TimeoutSeconds 30 -DebugMode $debug
            Write-Host "Detection script result: $result"
        } catch {
            Write-Host "Detection script error: $($_.Exception.Message)"
        }
        
        Write-Host ""
        Write-Host "=== PHASE 2: COMMAND INVOCATION TESTING ==="
        Write-Host "Attempting to trigger 'Connect with cloud' programmatically..."
        
        # Try to find and invoke "Connect with cloud" command
        # Method 1: Look for menu automation
        Write-Host "Method 1: UI Automation approach..."
        try {
            Add-Type -AssemblyName UIAutomationClient
            Add-Type -AssemblyName UIAutomationTypes
            
            # Find SimplySign window
            $automation = [System.Windows.Automation.AutomationElement]::RootElement
            $condition = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, "*SimplySign*")
            $simplySignWindow = $automation.FindFirst([System.Windows.Automation.TreeScope]::Children, $condition)
            
            if ($simplySignWindow) {
                Write-Host "✅ Found SimplySign window: $($simplySignWindow.Current.Name)"
                
                # Look for menu items or buttons related to cloud connection
                $menuCondition = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ControlTypeProperty, [System.Windows.Automation.ControlType]::MenuItem)
                $menuItems = $simplySignWindow.FindAll([System.Windows.Automation.TreeScope]::Descendants, $menuCondition)
                
                Write-Host "Found $($menuItems.Count) menu items"
                foreach ($item in $menuItems) {
                    $name = $item.Current.Name
                    if ($name -like "*cloud*" -or $name -like "*connect*" -or $name -like "*login*") {
                        Write-Host "  Potential cloud menu: $name"
                    }
                }
            } else {
                Write-Host "⚠️ Could not find SimplySign window for UI automation"
            }
        } catch {
            Write-Host "⚠️ UI Automation failed: $($_.Exception.Message)"
        }
        
        # Method 2: Command line parameters
        Write-Host ""
        Write-Host "Method 2: Command line parameters..."
        $possibleCommands = @(
            "/connect",
            "/cloud",
            "/login",
            "/auth",
            "/show-login",
            "-connect",
            "-cloud",
            "-login"
        )
        
        foreach ($cmd in $possibleCommands) {
            Write-Host "Testing parameter: $cmd"
            # This would normally try to start with the parameter, but we'll skip actual execution
            # to avoid process conflicts
        }
        
        # Method 3: Registry triggers
        Write-Host ""
        Write-Host "Method 3: Additional registry triggers..."
        try {
            # Try setting additional registry values that might trigger immediate connection
            $regPath = "HKCU:\Software\Certum"
            if (Test-Path $regPath) {
                New-ItemProperty -Path $regPath -Name "TriggerCloudConnection" -Value "Yes" -PropertyType String -Force | Out-Null
                New-ItemProperty -Path $regPath -Name "ForceConnectWithCloud" -Value "Yes" -PropertyType String -Force | Out-Null
                Write-Host "✅ Set additional trigger registry values"
            }
        } catch {
            Write-Host "⚠️ Could not set additional registry triggers: $($_.Exception.Message)"
        }
        
        Write-Host ""
        Write-Host "=== PHASE 3: POST-COMMAND DETECTION ==="
        Write-Host "Running detection again after command attempts..."
        
        # Wait a moment for any triggered dialogs
        Start-Sleep -Seconds 5
        
        # Run detection again
        try {
            $result2 = powershell -ExecutionPolicy Bypass -File "./.github/scripts/detect-login-dialog.ps1" -TimeoutSeconds 30 -DebugMode $debug
            Write-Host "Post-command detection result: $result2"
        } catch {
            Write-Host "Post-command detection error: $($_.Exception.Message)"
        }
        
        Write-Host ""
        Write-Host "=== PHASE 4: FINAL LONG-TERM DETECTION ==="
        Write-Host "Running extended detection for remaining timeout period..."
        
        $remainingTimeout = $timeout - 70  # Account for time already spent
        if ($remainingTimeout -gt 0) {
            try {
                $finalResult = powershell -ExecutionPolicy Bypass -File "./.github/scripts/detect-login-dialog.ps1" -TimeoutSeconds $remainingTimeout -DebugMode $debug
                Write-Host "Final detection result: $finalResult"
            } catch {
                Write-Host "Final detection error: $($_.Exception.Message)"
            }
        } else {
            Write-Host "No remaining time for extended detection"
        }
        
        Write-Host ""
        Write-Host "=== DETECTION AND COMMAND TESTING COMPLETED ==="
        
      shell: powershell

    # Step 5: Stop Network Monitoring and Collect Results
    - name: Collect Network Monitoring Results
      if: inputs.enable_network_monitoring == true
      run: |
        echo "=== COLLECTING NETWORK MONITORING RESULTS ==="
        
        if [ -f "network_monitor_job.id" ]; then
          JOB_ID=$(cat network_monitor_job.id)
          echo "Retrieving network monitoring results from job ID: $JOB_ID"
          
          powershell -Command "
            try {
              \$job = Get-Job -Id $JOB_ID -ErrorAction SilentlyContinue
              if (\$job) {
                Write-Host 'Network monitoring job status: ' + \$job.State
                \$results = Receive-Job -Job \$job
                if (\$results) {
                  Write-Host 'Network monitoring results:'
                  \$results | ForEach-Object { Write-Host \"   \$_\" }
                } else {
                  Write-Host 'No network activity detected during monitoring period'
                }
                Remove-Job -Job \$job -Force
              } else {
                Write-Host 'Network monitoring job not found'
              }
            } catch {
              Write-Host \"Error retrieving network results: \$(\$_.Exception.Message)\"
            }
          "
        else
          echo "⚠️ Network monitor job ID not found"
        fi
      shell: bash

    # Step 6: Upload Diagnostic Results
    - name: Upload Detection Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: login-dialog-detection-results
        path: |
          detection_results.json
          network_monitor_start.log
          .github/scripts/detect-login-dialog.ps1
          *.log
        retention-days: 7
        compression-level: 9

    # Step 7: Generate Summary Report
    - name: Generate Diagnostic Summary
      if: always()
      run: |
        echo "=== LOGIN DIALOG DETECTION DIAGNOSTIC SUMMARY ==="
        echo "Date: $(date)"
        echo "Environment: GitHub Actions Windows Runner"
        echo "Detection timeout: ${{ inputs.detection_timeout }} seconds"
        echo "Network monitoring: ${{ inputs.enable_network_monitoring }}"
        echo ""
        
        if [ -f "detection_results.json" ]; then
          echo "📋 Detection Results:"
          cat detection_results.json | python -m json.tool 2>/dev/null || cat detection_results.json
          echo ""
        fi
        
        echo "🎯 Key Questions Answered:"
        echo "1. Does SimplySign Desktop start successfully in GitHub Actions? [Check process launch]"
        echo "2. Does a login dialog actually appear? [Check detection methods]"  
        echo "3. Is it a native dialog or web view? [Check WebView detection]"
        echo "4. Are there OAuth2 network requests? [Check network monitoring]"
        echo "5. How long does initialization take? [Check timing in logs]"
        echo ""
        
        echo "💡 Next Steps Based on Results:"
        echo "- If no detection: Login dialog doesn't appear in headless mode"
        echo "- If WebView detected: Need web automation instead of window automation" 
        echo "- If network detected: OAuth2 flow is active, could bypass GUI"
        echo "- If process issues: Need to fix SimplySign startup configuration"
        echo ""
        
        echo "🔗 Related Files:"
        echo "- detection_results.json: Detailed detection method results"
        echo "- dialog_detection.ps1: Full detection script for reference"
        echo "- *.log: Various monitoring and debug logs"
        
      shell: bash
