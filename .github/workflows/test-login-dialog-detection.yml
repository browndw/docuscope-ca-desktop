name: Login Dialog Detection Diagnostic

on:
  workflow_dispatch:
    inputs:
      detection_timeout:
        description: 'Detection timeout in seconds'
        required: false
        default: '180'
        type: string
      enable_network_monitoring:
        description: 'Enable OAuth2 network monitoring'
        required: false
        default: true
        type: boolean
      debug_mode:
        description: 'Enable verbose debugging'
        required: false
        default: false
        type: boolean

jobs:
  login-dialog-diagnostic:
    runs-on: windows-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Step 0: Ensure Clean Environment
    - name: Clean SimplySign Environment
      run: |
        echo "=== ENSURING CLEAN SIMPLYSIGN ENVIRONMENT ==="
        echo "Terminating any existing SimplySign processes..."
        
        # Kill any existing SimplySign processes
        $processes = Get-Process -Name "*SimplySign*" -ErrorAction SilentlyContinue
        if ($processes) {
          Write-Host "Found $($processes.Count) existing SimplySign processes"
          $processes | ForEach-Object {
            Write-Host "Terminating: $($_.ProcessName) (PID: $($_.Id))"
            try {
              $_ | Stop-Process -Force
              Write-Host "Successfully terminated PID $($_.Id)"
            } catch {
              Write-Host "Could not terminate PID $($_.Id): $($_.Exception.Message)"
            }
          }
          
          # Wait for processes to fully terminate
          Start-Sleep -Seconds 3
          
          # Verify cleanup
          $remainingProcesses = Get-Process -Name "*SimplySign*" -ErrorAction SilentlyContinue
          if ($remainingProcesses) {
            Write-Host "Warning: $($remainingProcesses.Count) processes still running"
            $remainingProcesses | ForEach-Object { Write-Host "  Still running: $($_.ProcessName) (PID: $($_.Id))" }
          } else {
            Write-Host "All SimplySign processes terminated successfully"
          }
        } else {
          Write-Host "No existing SimplySign processes found"
        }
        
        # Clean any existing registry configuration
        Write-Host "Cleaning existing registry configuration..."
        $regPaths = @(
          "HKCU:\Software\Certum",
          "HKCU:\Software\SimplySignDesktop", 
          "HKCU:\Software\Asseco"
        )
        
        foreach ($regPath in $regPaths) {
          if (Test-Path $regPath) {
            try {
              Remove-Item -Path $regPath -Recurse -Force -ErrorAction SilentlyContinue
              Write-Host "Cleaned registry path: $regPath"
            } catch {
              Write-Host "Could not clean registry path: $regPath"
            }
          }
        }
        
        Write-Host "Environment cleanup completed"
      shell: powershell

    # Step 1: Take Registry Snapshot BEFORE Installation
    - name: Take Pre-Installation Registry Snapshot
      run: |
        Write-Host "=== TAKING PRE-INSTALLATION REGISTRY SNAPSHOT ==="
        Write-Host "Capturing registry state before SimplySign installation..."
        
        # Export relevant registry sections to files
        $regPaths = @(
          "HKCU\Software\Certum",
          "HKCU\Software\SimplySignDesktop", 
          "HKCU\Software\Asseco",
          "HKLM\SOFTWARE\Certum",
          "HKLM\SOFTWARE\SimplySignDesktop",
          "HKLM\SOFTWARE\Asseco"
        )
        
        Write-Host "Exporting registry sections before installation..."
        foreach ($regPath in $regPaths) {
          $fileName = "before_" + ($regPath -replace "\\", "_" -replace ":", "") + ".reg"
          try {
            # Use cmd to run reg export and capture both stdout and stderr
            $output = cmd /c "reg export `"$regPath`" `"$fileName`" /y 2>&1"
            $exitCode = $LASTEXITCODE
            
            if ($exitCode -eq 0) {
              Write-Host "Exported: $regPath -> $fileName"
            } else {
              # Registry key doesn't exist yet - this is expected before installation
              Write-Host "Registry key not found (expected): $regPath"
              # Create empty baseline file for comparison later
              "Windows Registry Editor Version 5.00`r`n`r`n; Registry key did not exist before installation`r`n" | Out-File -FilePath $fileName -Encoding ASCII
            }
          } catch {
            Write-Host "Could not export $regPath : $($_.Exception.Message)"
            "Windows Registry Editor Version 5.00`r`n`r`n; Export failed: $($_.Exception.Message)`r`n" | Out-File -FilePath $fileName -Encoding ASCII
          }
        }
        
        # Also capture process list before installation
        Write-Host "Capturing running processes before installation..."
        Get-Process | Select-Object Name, Id, ProcessName | Export-Csv -Path "processes_before.csv" -NoTypeInformation
        
        Write-Host "Pre-installation snapshot completed"
        Get-ChildItem -Name "before_*.reg" | ForEach-Object { Write-Host "  Created: $_" }
        
        # Ensure script exits successfully regardless of registry key existence
        exit 0
      shell: powershell

    # Step 2: Install SimplySign Desktop
    - name: Install SimplySign Desktop  
      run: |
        echo "=== INSTALLING SIMPLYSIGN DESKTOP ==="
        echo "Downloading and installing for diagnostic testing..."
        echo "Using stable version 9.1.5.52 as configured in install-simplysign.sh"
        chmod +x ./.github/scripts/install-simplysign.sh
        ./.github/scripts/install-simplysign.sh
      shell: bash

    # Step 3: Take Registry Snapshot AFTER Installation
    - name: Take Post-Installation Registry Snapshot
      run: |
        Write-Host "=== TAKING POST-INSTALLATION REGISTRY SNAPSHOT ==="
        Write-Host "Capturing registry state after SimplySign installation..."
        
        # Export same registry sections after installation
        $regPaths = @(
          "HKCU\Software\Certum",
          "HKCU\Software\SimplySignDesktop", 
          "HKCU\Software\Asseco",
          "HKLM\SOFTWARE\Certum",
          "HKLM\SOFTWARE\SimplySignDesktop",
          "HKLM\SOFTWARE\Asseco"
        )
        
        Write-Host "Exporting registry sections after installation..."
        foreach ($regPath in $regPaths) {
          $fileName = "after_" + ($regPath -replace "\\", "_" -replace ":", "") + ".reg"
          try {
            # Use cmd to run reg export and capture both stdout and stderr
            $output = cmd /c "reg export `"$regPath`" `"$fileName`" /y 2>&1"
            $exitCode = $LASTEXITCODE
            
            if ($exitCode -eq 0) {
              Write-Host "Exported: $regPath -> $fileName"
            } else {
              # Registry key still doesn't exist after installation
              Write-Host "Registry key still not found: $regPath"
              "Windows Registry Editor Version 5.00`r`n`r`n; Registry key did not exist after installation`r`n" | Out-File -FilePath $fileName -Encoding ASCII
            }
          } catch {
            Write-Host "Could not export $regPath : $($_.Exception.Message)"
            "Windows Registry Editor Version 5.00`r`n`r`n; Export failed: $($_.Exception.Message)`r`n" | Out-File -FilePath $fileName -Encoding ASCII
          }
        }
        
        # Capture process list after installation
        Get-Process | Select-Object Name, Id, ProcessName | Export-Csv -Path "processes_after.csv" -NoTypeInformation
        
        Write-Host "Post-installation snapshot completed"
        Get-ChildItem -Name "after_*.reg" | ForEach-Object { Write-Host "  Created: $_" }
        
        # Ensure script exits successfully regardless of registry key existence  
        exit 0
      shell: powershell

    # Step 4: Start SimplySign to Create User Configuration
    - name: Initialize SimplySign User Configuration
      run: |
        Write-Host "=== INITIALIZING SIMPLYSIGN USER CONFIGURATION ==="
        Write-Host "Starting SimplySign to allow it to create user-specific settings..."
        Write-Host ""
        
        # Locate SimplySign executable
        $possiblePaths = @(
            "${env:ProgramFiles}\Certum\SimplySign Desktop\SimplySignDesktop.exe",
            "${env:ProgramFiles(x86)}\Certum\SimplySign Desktop\SimplySignDesktop.exe",
            "${env:ProgramFiles}\Certum\SimplySign Desktop\SimplySign Desktop.exe",
            "${env:ProgramFiles(x86)}\Certum\SimplySign Desktop\SimplySign Desktop.exe"
        )
        
        $exePath = $null
        foreach ($path in $possiblePaths) {
            if (Test-Path $path) {
                $exePath = $path
                Write-Host "Found SimplySign Desktop at: $path"
                break
            }
        }
        
        if (-not $exePath) {
            Write-Host "Could not locate SimplySign Desktop executable"
            Write-Host "Installation may have failed or executable is in unexpected location"
            exit 1
        }
        
        Write-Host "Starting SimplySign Desktop for 30 seconds to initialize user configuration..."
        try {
            # Start SimplySign in normal mode (not hidden) to ensure full initialization
            $process = Start-Process -FilePath $exePath -PassThru
            Write-Host "Started SimplySign Desktop (PID: $($process.Id))"
            
            # Wait 30 seconds for full initialization and user config creation
            Write-Host "Waiting 30 seconds for initialization and user configuration creation..."
            Start-Sleep -Seconds 30
            
            # Check if process is still running
            if (-not $process.HasExited) {
                Write-Host "SimplySign is running and stable after 30 seconds"
                
                # Stop the process gracefully
                try {
                    $process | Stop-Process -Force
                    Write-Host "Gracefully terminated SimplySign"
                } catch {
                    Write-Host "Error terminating process: $($_.Exception.Message)"
                }
                
                # Verify termination
                Start-Sleep -Seconds 2
                $remainingProcesses = Get-Process -Name "*SimplySign*" -ErrorAction SilentlyContinue
                if ($remainingProcesses) {
                    Write-Host "Some SimplySign processes still running:"
                    $remainingProcesses | ForEach-Object { 
                        Write-Host "   PID $($_.Id): $($_.ProcessName)"
                        try {
                            $_ | Stop-Process -Force
                            Write-Host "   Force terminated PID $($_.Id)"
                        } catch {
                            Write-Host "   Could not terminate PID $($_.Id)"
                        }
                    }
                } else {
                    Write-Host "All SimplySign processes terminated cleanly"
                }
            } else {
                Write-Host "SimplySign process exited during initialization (Exit Code: $($process.ExitCode))"
                Write-Host "This may still have created user configuration files"
            }
            
        } catch {
            Write-Host "Error starting SimplySign: $($_.Exception.Message)"
            Write-Host "Will continue analysis in case partial configuration was created"
        }
        
        Write-Host ""
        Write-Host "User configuration initialization completed"
        Write-Host "Now taking updated registry snapshot to capture any new user settings..."
      shell: powershell

    # Step 5: Take Registry Snapshot AFTER User Initialization
    - name: Take Post-User-Init Registry Snapshot
      run: |
        Write-Host "=== TAKING POST-USER-INITIALIZATION REGISTRY SNAPSHOT ==="
        Write-Host "Capturing registry state after SimplySign user initialization..."
        
        # Export same registry sections after user initialization
        $regPaths = @(
          "HKCU\Software\Certum",
          "HKCU\Software\SimplySignDesktop", 
          "HKCU\Software\Asseco",
          "HKLM\SOFTWARE\Certum",
          "HKLM\SOFTWARE\SimplySignDesktop",
          "HKLM\SOFTWARE\Asseco"
        )
        
        Write-Host "Exporting registry sections after user initialization..."
        foreach ($regPath in $regPaths) {
          $fileName = "after_user_init_" + ($regPath -replace "\\", "_" -replace ":", "") + ".reg"
          try {
            # Use cmd to run reg export and capture both stdout and stderr
            $output = cmd /c "reg export `"$regPath`" `"$fileName`" /y 2>&1"
            $exitCode = $LASTEXITCODE
            
            if ($exitCode -eq 0) {
              Write-Host "Exported: $regPath -> $fileName"
            } else {
              # Registry key still doesn't exist after user initialization
              Write-Host "Registry key still not found: $regPath"
              "Windows Registry Editor Version 5.00`r`n`r`n; Registry key did not exist after user initialization`r`n" | Out-File -FilePath $fileName -Encoding ASCII
            }
          } catch {
            Write-Host "Could not export $regPath : $($_.Exception.Message)"
            "Windows Registry Editor Version 5.00`r`n`r`n; Export failed: $($_.Exception.Message)`r`n" | Out-File -FilePath $fileName -Encoding ASCII
          }
        }
        
        Write-Host "Post-user-initialization snapshot completed"
        Get-ChildItem -Name "after_user_init_*.reg" | ForEach-Object { Write-Host "  Created: $_" }
        
        # Ensure script exits successfully regardless of registry key existence  
        exit 0
      shell: powershell

    # Step 6: Analyze Registry Changes
    - name: Analyze Registry Changes
      run: |
        Write-Host "=== ANALYZING REGISTRY CHANGES ==="
        Write-Host "Comparing before/after installation AND after user initialization to find settings..."
        
        # Compare each registry section - now we have 3 snapshots:
        # 1. before_* (before installation)
        # 2. after_* (after installation, before user init)  
        # 3. after_user_init_* (after user initialization)
        $regSections = @(
          "HKCU_Software_Certum",
          "HKCU_Software_SimplySignDesktop", 
          "HKCU_Software_Asseco",
          "HKLM_SOFTWARE_Certum",
          "HKLM_SOFTWARE_SimplySignDesktop",
          "HKLM_SOFTWARE_Asseco"
        )
        
        $installChangesFound = $false
        $userInitChangesFound = $false
        
        foreach ($section in $regSections) {
          $beforeFile = "before_$section.reg"
          $afterInstallFile = "after_$section.reg"
          $afterUserInitFile = "after_user_init_$section.reg"
          
          Write-Host ""
          Write-Host "=== ANALYZING: $section ==="
          
          # Compare installation changes (before -> after install)
          if ((Test-Path $beforeFile) -and (Test-Path $afterInstallFile)) {
            $beforeContent = Get-Content $beforeFile -Raw
            $afterInstallContent = Get-Content $afterInstallFile -Raw
            
            if ($beforeContent -ne $afterInstallContent) {
              Write-Host "INSTALLATION CHANGES DETECTED in $section"
              $installChangesFound = $true
              
              $beforeLines = Get-Content $beforeFile
              $afterInstallLines = Get-Content $afterInstallFile
              $installChanges = Compare-Object $beforeLines $afterInstallLines | Where-Object { $_.SideIndicator -eq "=>" }
              
              if ($installChanges) {
                Write-Host "  NEW ENTRIES FROM INSTALLATION:"
                foreach ($line in $installChanges) {
                  $content = $line.InputObject
                  if ($content -match '^".*"=' -and $content -notmatch "^;") {
                    Write-Host "    $content"
                  }
                }
              }
            }
          }
          
          # Compare user initialization changes (after install -> after user init)
          if ((Test-Path $afterInstallFile) -and (Test-Path $afterUserInitFile)) {
            $afterInstallContent = Get-Content $afterInstallFile -Raw
            $afterUserInitContent = Get-Content $afterUserInitFile -Raw
            
            if ($afterInstallContent -ne $afterUserInitContent) {
              Write-Host "USER INITIALIZATION CHANGES DETECTED in $section"
              $userInitChangesFound = $true
              
              $afterInstallLines = Get-Content $afterInstallFile
              $afterUserInitLines = Get-Content $afterUserInitFile
              $userInitChanges = Compare-Object $afterInstallLines $afterUserInitLines | Where-Object { $_.SideIndicator -eq "=>" }
              
              if ($userInitChanges) {
                Write-Host "  NEW ENTRIES FROM USER INITIALIZATION:"
                foreach ($line in $userInitChanges) {
                  $content = $line.InputObject
                  if ($content -match '^".*"=' -and $content -notmatch "^;") {
                    Write-Host "    $content"
                    
                    # Look for dialog/cloud/login related entries
                    if ($content -match "(dialog|cloud|login|logon|connect|auth|show)" -and $content -notmatch "^;") {
                      Write-Host "       POTENTIAL LOGIN TRIGGER:"
                      Write-Host "       $content"
                    }
                    
                    # Look specifically for the macOS equivalent setting we found
                    if ($content -match "ShowLogonDialogAfterApplicationStartup" -or 
                        $content -match "ShowLogonDialog.*Startup" -or
                        $content -match "SimplySignDesktopShowLogonDialog") {
                      Write-Host "       FOUND WINDOWS EQUIVALENT OF MACOS SETTING:"
                      Write-Host "       macOS: SimplySignDesktopShowLogonDialogAfterApplicationStartup"
                      Write-Host "       Windows: $content"
                    }
                  }
                }
              }
            } else {
              Write-Host "  No user initialization changes in $section"
            }
          }
          
          # Save detailed diffs
          if ((Test-Path $beforeFile) -and (Test-Path $afterUserInitFile)) {
            $beforeLines = Get-Content $beforeFile
            $afterUserInitLines = Get-Content $afterUserInitFile
            $fullDiff = Compare-Object $beforeLines $afterUserInitLines
            if ($fullDiff) {
              $diffFile = "full_changes_$section.txt"
              $fullDiff | Out-File $diffFile
              Write-Host "  Full diff saved to: $diffFile"
            }
          }
        }
        
        Write-Host ""
        Write-Host "=== SUMMARY ==="
        if ($installChangesFound) {
          Write-Host "Installation created registry entries (system-wide configuration)"
        } else {
          Write-Host "No installation registry changes detected"
        }
        
        if ($userInitChangesFound) {
          Write-Host "User initialization created additional registry entries (user-specific settings)"
          Write-Host "   Look for lines marked 'POTENTIAL LOGIN TRIGGER' above"
        } else {
          Write-Host "   No user initialization registry changes detected"
          Write-Host "   This suggests settings may be stored in files, not registry"
        }
        
        Write-Host ""
        Write-Host "Registry analysis completed"
        
        # Ensure script exits successfully
        exit 0
      shell: powershell

    # Step 7: Comprehensive Settings Analysis
    - name: Analyze All Certum Settings - Broad Search Approach
      run: |
        Write-Host "=== COMPREHENSIVE CERTUM SETTINGS ANALYSIS ==="
        Write-Host "New Strategy: Find ALL settings, not just the macOS-specific one"
        Write-Host "Looking for any boolean settings that might control login dialog behavior"
        Write-Host ""
        
        # Make analysis script executable and run it
        try {
            $result = powershell -ExecutionPolicy Bypass -File "./.github/scripts/analyze-all-certum-settings.ps1" -OutputPrefix "certum_settings_analysis" -SearchTerms "login,logon,dialog,startup,connect,cloud,auth,show,display,auto,trigger,start"
            Write-Host "Settings analysis completed"
            
            # Check if analysis found potential triggers
            if (Test-Path "certum_settings_analysis_detailed_results.json") {
                $analysisData = Get-Content "certum_settings_analysis_detailed_results.json" -Raw | ConvertFrom-Json
                
                if ($analysisData.PotentialTriggers -and $analysisData.PotentialTriggers.Count -gt 0) {
                    Write-Host "🎯 FOUND $($analysisData.PotentialTriggers.Count) POTENTIAL LOGIN TRIGGER(S)!"
                    foreach ($trigger in $analysisData.PotentialTriggers) {
                        Write-Host "   - $($trigger.Name) = $($trigger.Value) [$($trigger.RegPath)]"
                    }
                } else {
                    Write-Host "ℹ️ No obvious potential triggers found, but analysis generated comprehensive data"
                }
                
                Write-Host ""
                Write-Host "📊 Analysis Summary:"
                Write-Host "   Total registry values: $($analysisData.Summary.TotalRegistryValues)"
                Write-Host "   Boolean settings: $($analysisData.Summary.BooleanSettings)" 
                Write-Host "   Config files found: $($analysisData.Summary.ConfigFilesFound)"
            }
            
        } catch {
            Write-Host "❌ Settings analysis failed: $($_.Exception.Message)"
            # Continue with workflow even if analysis fails
        }
      shell: powershell

    # Step 8: Test Potential Settings
    - name: Systematically Test Potential Login Settings
      run: |
        Write-Host "=== SYSTEMATIC SETTING MODIFICATION TESTING ==="
        Write-Host "Testing each potential setting to see if it triggers login dialog behavior"
        Write-Host ""
        
        # Check if we have analysis results to work with
        if (-not (Test-Path "certum_settings_analysis_detailed_results.json")) {
            Write-Host "⚠️ No analysis results found - creating minimal test set"
            
            # Create a minimal set focusing on known registry location
            $minimalTestData = @{
                AllCertumSettings = @()
                PotentialTriggers = @()
                BooleanSettings = @()
            }
            
            # Check for the Autostart setting we know exists
            try {
                $certumPath = "HKLM:\SOFTWARE\Certum"
                if (Test-Path $certumPath) {
                    $autostartValue = Get-ItemProperty -Path $certumPath -Name "Autostart" -ErrorAction SilentlyContinue
                    if ($autostartValue) {
                        $minimalTestData.AllCertumSettings += @{
                            Name = "Autostart"
                            Value = $autostartValue.Autostart
                            RegPath = $certumPath
                        }
                        Write-Host "✓ Found Autostart setting: $($autostartValue.Autostart)"
                    }
                }
            } catch {
                Write-Host "Could not access known Certum registry location"
            }
            
            # Save minimal data for testing script
            $minimalTestData | ConvertTo-Json -Depth 5 | Out-File -FilePath "certum_settings_analysis_detailed_results.json" -Encoding UTF8
        }
        
        # Run the systematic testing script
        try {
            $testResult = powershell -ExecutionPolicy Bypass -File "./.github/scripts/test-setting-modifications.ps1" -SettingsAnalysisFile "certum_settings_analysis_detailed_results.json" -TestDurationSeconds 20 -RestoreOriginal $true
            
            Write-Host "✅ Setting modification testing completed"
            
            # Check for significant findings
            if (Test-Path "setting_modification_test_results.json") {
                $testData = Get-Content "setting_modification_test_results.json" -Raw | ConvertFrom-Json
                
                if ($testData.SignificantFindings -and $testData.SignificantFindings.Count -gt 0) {
                    Write-Host ""
                    Write-Host "🚨 SIGNIFICANT FINDINGS - Settings that affected behavior:"
                    foreach ($finding in $testData.SignificantFindings) {
                        Write-Host "   Setting: $($finding.SettingName)"
                        Write-Host "   Change: $($finding.OriginalValue) → $($finding.NewValue)"
                        Write-Host "   New processes: $(if ($finding.TriggeredNewProcess) { "✓ YES" } else { "No" })"
                        Write-Host "   Startup affected: $(if (-not $finding.SimplySignStartupWorked) { "✓ YES" } else { "No" })"
                        Write-Host "   Path: $($finding.RegPath)"
                        Write-Host ""
                    }
                    
                    # Save the most promising setting for next phase
                    $mostPromising = $testData.SignificantFindings[0]
                    $mostPromising | ConvertTo-Json | Out-File -FilePath "most_promising_setting.json" -Encoding UTF8
                    Write-Host "💡 Most promising setting saved for final testing phase"
                    
                } else {
                    Write-Host "ℹ️ No settings showed obvious login dialog triggering behavior"
                    Write-Host "This suggests the login dialog may be controlled by:"
                    Write-Host "   1. File-based configuration (not registry)"
                    Write-Host "   2. User interaction triggers"
                    Write-Host "   3. Different mechanisms than simple boolean flags"
                }
                
                Write-Host ""
                Write-Host "📊 Testing Summary:"
                Write-Host "   Settings tested: $($testData.SettingsTested)"
                Write-Host "   Successful changes: $($testData.Summary.SuccessfulChanges)"
                Write-Host "   Process triggers: $($testData.Summary.ProcessTriggered)"
                Write-Host "   Startup effects: $($testData.Summary.StartupAffected)"
            }
            
        } catch {
            Write-Host "❌ Setting modification testing failed: $($_.Exception.Message)"
            Write-Host "Continuing with workflow..."
        }
        
        Write-Host ""
        Write-Host "Setting modification testing phase completed"
      shell: powershell

    # Step 9: Apply Most Promising Setting and Test
    - name: Apply Most Promising Setting and Test Login Dialog
      run: |
        Write-Host "=== APPLYING MOST PROMISING SETTING FOR FINAL TEST ==="
        Write-Host "If we found a promising setting, apply it and test for login dialog"
        Write-Host ""
        
        $appliedSetting = $false
        $settingDetails = ""
        
        # Check if we have a promising setting to apply
        if (Test-Path "most_promising_setting.json") {
            try {
                $promisingSetting = Get-Content "most_promising_setting.json" -Raw | ConvertFrom-Json
                
                Write-Host "🎯 Applying most promising setting:"
                Write-Host "   Setting: $($promisingSetting.SettingName)"
                Write-Host "   Change: $($promisingSetting.OriginalValue) → $($promisingSetting.NewValue)"
                Write-Host "   Path: $($promisingSetting.RegPath)"
                
                # Apply the setting
                if (Test-Path $promisingSetting.RegPath) {
                    Set-ItemProperty -Path $promisingSetting.RegPath -Name $promisingSetting.SettingName -Value $promisingSetting.NewValue
                    Write-Host "✅ Setting applied successfully"
                    $appliedSetting = $true
                    $settingDetails = "$($promisingSetting.SettingName) = $($promisingSetting.NewValue)"
                } else {
                    Write-Host "❌ Registry path not accessible: $($promisingSetting.RegPath)"
                }
                
            } catch {
                Write-Host "❌ Failed to apply promising setting: $($_.Exception.Message)"
            }
        } else {
            Write-Host "ℹ️ No promising setting found from previous analysis"
            
            # Fallback - try the Autostart setting if it exists
            try {
                $certumPath = "HKLM:\SOFTWARE\Certum"
                if (Test-Path $certumPath) {
                    $autostartValue = Get-ItemProperty -Path $certumPath -Name "Autostart" -ErrorAction SilentlyContinue
                    if ($autostartValue -and $autostartValue.Autostart -eq 0) {
                        Write-Host "🔄 Fallback: Trying Autostart setting (0 → 1)"
                        Set-ItemProperty -Path $certumPath -Name "Autostart" -Value 1
                        Write-Host "✅ Autostart setting changed to 1"
                        $appliedSetting = $true
                        $settingDetails = "Autostart = 1"
                    }
                }
            } catch {
                Write-Host "Could not apply Autostart fallback"
            }
        }
        
        if ($appliedSetting) {
            Write-Host ""
            Write-Host "🧪 TESTING SIMPLYSIGN WITH MODIFIED SETTING"
            Write-Host "Setting applied: $settingDetails"
            Write-Host "Starting SimplySign to see if login dialog appears..."
            
            # Find SimplySign executable
            $possiblePaths = @(
                "${env:ProgramFiles}\Certum\SimplySign Desktop\SimplySignDesktop.exe",
                "${env:ProgramFiles(x86)}\Certum\SimplySign Desktop\SimplySignDesktop.exe"
            )
            
            $exePath = $null
            foreach ($path in $possiblePaths) {
                if (Test-Path $path) {
                    $exePath = $path
                    break
                }
            }
            
            if ($exePath) {
                try {
                    # Start SimplySign with the modified setting
                    $process = Start-Process -FilePath $exePath -PassThru
                    Write-Host "▶️ Started SimplySign (PID: $($process.Id)) with modified setting"
                    
                    # Wait longer than usual to see if login dialog appears
                    Write-Host "⏳ Waiting 30 seconds for potential login dialog..."
                    Start-Sleep -Seconds 30
                    
                    # Check process status and look for additional processes
                    $allProcesses = Get-Process -Name "*SimplySign*" -ErrorAction SilentlyContinue
                    Write-Host "📊 SimplySign processes after setting change:"
                    $allProcesses | ForEach-Object {
                        Write-Host "   PID $($_.Id): $($_.ProcessName)"
                    }
                    
                    if ($allProcesses.Count -gt 1) {
                        Write-Host "🎯 Multiple processes detected - setting may have triggered additional behavior!"
                    }
                    
                    # Clean up processes
                    $allProcesses | ForEach-Object {
                        try { $_ | Stop-Process -Force } catch {}
                    }
                    
                } catch {
                    Write-Host "❌ Error testing with modified setting: $($_.Exception.Message)"
                }
            } else {
                Write-Host "❌ SimplySign executable not found"
            }
        } else {
            Write-Host "⚠️ No setting was applied - proceeding with default configuration"
        }
        
        Write-Host ""
        Write-Host "Final setting test completed"
      shell: powershell

    # Step 10: Start Network Monitoring (if enabled)
    - name: Start OAuth2 Network Monitoring
      if: inputs.enable_network_monitoring == true
      run: |
        echo "=== STARTING OAUTH2 NETWORK MONITORING ==="
        echo "Monitoring for requests to cloudsign.webnotarius.pl..."
        echo "Using file-based monitoring to persist across workflow steps"
        
        # Create network monitoring script
        cat > network_monitor.ps1 << 'EOF'
        param([int]$DurationSeconds = 180)
        
        $logFile = "network_monitor_results.log"
        $endTime = (Get-Date).AddSeconds($DurationSeconds)
        
        Write-Host "Starting OAuth2 network monitoring for $DurationSeconds seconds..."
        "Network monitoring started at $(Get-Date)" | Out-File -FilePath $logFile -Encoding UTF8
        
        $connectionCount = 0
        $dnsCount = 0
        
        while ((Get-Date) -lt $endTime) {
            $timestamp = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
            
            # Check for network connections to webnotarius
            try {
                $connections = netstat -an | Select-String 'webnotarius' -ErrorAction SilentlyContinue
                if ($connections) {
                    $connectionCount++
                    $logEntry = "[$timestamp] OAuth2 connection detected: $connections"
                    Write-Host $logEntry
                    $logEntry | Out-File -FilePath $logFile -Append -Encoding UTF8
                }
            } catch {
                # Ignore netstat errors
            }
            
            # Monitor DNS queries
            try {
                $dnsResult = nslookup cloudsign.webnotarius.pl 2>$null
                if ($dnsResult -and $dnsResult -notlike '*can''t find*') {
                    $dnsCount++
                    $logEntry = "[$timestamp] DNS resolution successful for OAuth2 endpoint"
                    Write-Host $logEntry
                    $logEntry | Out-File -FilePath $logFile -Append -Encoding UTF8
                }
            } catch {
                # Ignore DNS lookup errors
            }
            
            Start-Sleep -Seconds 2
        }
        
        $summary = "Network monitoring completed. Connections: $connectionCount, DNS queries: $dnsCount"
        Write-Host $summary
        $summary | Out-File -FilePath $logFile -Append -Encoding UTF8
        "Network monitoring ended at $(Get-Date)" | Out-File -FilePath $logFile -Append -Encoding UTF8
        EOF
        
        # Start monitoring in background
        echo "Starting background network monitoring process..."
        powershell -ExecutionPolicy Bypass -File network_monitor.ps1 -DurationSeconds ${{ inputs.detection_timeout }} > network_monitor_start.log 2>&1 &
        
        # Save the background process PID for later reference
        MONITOR_PID=$!
        echo $MONITOR_PID > network_monitor.pid
        echo "Network monitoring started with PID: $MONITOR_PID"
        echo "Monitoring will run for ${{ inputs.detection_timeout }} seconds"
        
        # Give it a moment to start
        sleep 2
        
        # Check if monitoring started successfully
        if ps -p $MONITOR_PID > /dev/null 2>&1; then
          echo "✓ Network monitoring process is running"
        else
          echo "⚠ Network monitoring process may have failed to start"
        fi
      shell: bash

    # Step 11: Enhanced Login Dialog Detection
    - name: Enhanced Login Dialog Detection - Post Settings Analysis
      env:
        DETECTION_TIMEOUT: ${{ inputs.detection_timeout }}
        DEBUG_MODE: ${{ inputs.debug_mode }}
      run: |
        echo "=== ENHANCED LOGIN DIALOG DETECTION ==="
        echo "Testing for login dialog after comprehensive settings analysis and modifications"
        echo "Detection timeout: $env:DETECTION_TIMEOUT seconds"
        echo "Debug mode: $env:DEBUG_MODE"
        echo ""
        
        $timeout = [int]$env:DETECTION_TIMEOUT
        $debug = if ($env:DEBUG_MODE -eq "true") { $true } else { $false }
        
        # Phase 1: Check what settings were applied
        Write-Host "=== PHASE 1: APPLIED SETTINGS SUMMARY ==="
        if (Test-Path "most_promising_setting.json") {
            $appliedSetting = Get-Content "most_promising_setting.json" -Raw | ConvertFrom-Json
            Write-Host "✓ Applied promising setting: $($appliedSetting.SettingName) = $($appliedSetting.NewValue)"
        } elseif (Test-Path "HKLM:\SOFTWARE\Certum") {
            $autostartValue = Get-ItemProperty -Path "HKLM:\SOFTWARE\Certum" -Name "Autostart" -ErrorAction SilentlyContinue
            if ($autostartValue -and $autostartValue.Autostart -eq 1) {
                Write-Host "✓ Applied fallback setting: Autostart = 1"
            } else {
                Write-Host "ℹ️ No settings were modified"
            }
        } else {
            Write-Host "ℹ️ No settings analysis results available"
        }
        
        Write-Host ""
        Write-Host "=== PHASE 2: STANDARD DETECTION WITH SETTINGS ==="
        Write-Host "Running standard detection script with any applied settings..."
        try {
            $result = powershell -ExecutionPolicy Bypass -File "./.github/scripts/detect-login-dialog.ps1" -TimeoutSeconds 45 -DebugMode $debug
            Write-Host "Detection script result: $result"
        } catch {
            Write-Host "Detection script error: $($_.Exception.Message)"
        }
        
        Write-Host ""
        Write-Host "=== PHASE 3: ALTERNATIVE APPROACHES ==="
        Write-Host "Testing alternative methods based on our settings analysis..."
        
        # Try to start SimplySign in different modes
        $possiblePaths = @(
            "${env:ProgramFiles}\Certum\SimplySign Desktop\SimplySignDesktop.exe",
            "${env:ProgramFiles(x86)}\Certum\SimplySign Desktop\SimplySignDesktop.exe"
        )
        
        $exePath = $null
        foreach ($path in $possiblePaths) {
            if (Test-Path $path) {
                $exePath = $path
                break
            }
        }
        
        if ($exePath) {
            # Test 1: Multiple startup attempts
            Write-Host "Test 1: Multiple startup attempts to trigger first-run behavior..."
            for ($i = 1; $i -le 3; $i++) {
                Write-Host "  Startup attempt $i/3..."
                try {
                    $process = Start-Process -FilePath $exePath -PassThru
                    Start-Sleep -Seconds 10
                    
                    $allProcesses = Get-Process -Name "*SimplySign*" -ErrorAction SilentlyContinue
                    if ($allProcesses.Count -gt 1) {
                        Write-Host "    🎯 Multiple processes detected on attempt $i!"
                    }
                    
                    # Clean up
                    $allProcesses | ForEach-Object { try { $_ | Stop-Process -Force } catch {} }
                    Start-Sleep -Seconds 2
                } catch {
                    Write-Host "    Startup attempt $i failed"
                }
            }
            
            # Test 2: Command line parameters
            Write-Host ""
            Write-Host "Test 2: Command line parameters..."
            $commandLineTests = @("/login", "/connect", "/cloud", "/auth", "--login", "--connect")
            foreach ($param in $commandLineTests) {
                Write-Host "  Testing parameter: $param"
                try {
                    $process = Start-Process -FilePath $exePath -ArgumentList $param -PassThru -ErrorAction SilentlyContinue
                    Start-Sleep -Seconds 5
                    
                    if ($process -and -not $process.HasExited) {
                        Write-Host "    Parameter accepted, process running"
                        $process | Stop-Process -Force
                    } else {
                        Write-Host "    Parameter rejected or process exited"
                    }
                } catch {
                    Write-Host "    Parameter test failed"
                }
            }
        }
        
        Write-Host ""
        Write-Host "=== PHASE 4: FINAL COMPREHENSIVE DETECTION ==="
        Write-Host "Running extended detection for remaining timeout..."
        
        $remainingTimeout = $timeout - 120  # Account for time spent in previous phases
        if ($remainingTimeout -gt 30) {
            try {
                $finalResult = powershell -ExecutionPolicy Bypass -File "./.github/scripts/detect-login-dialog.ps1" -TimeoutSeconds $remainingTimeout -DebugMode $debug
                Write-Host "Final detection result: $finalResult"
            } catch {
                Write-Host "Final detection error: $($_.Exception.Message)"
            }
        } else {
            Write-Host "Insufficient time remaining for extended detection"
        }
        
        Write-Host ""
        Write-Host "=== DETECTION ANALYSIS COMPLETE ==="
        Write-Host "Results should be analyzed in combination with settings modification findings"
        
      shell: powershell

    # Step 12: Stop Network Monitoring and Collect Results
    - name: Collect Network Monitoring Results
      if: inputs.enable_network_monitoring == true
      run: |
        echo "=== COLLECTING NETWORK MONITORING RESULTS ==="
        
        # Check if monitoring process is still running
        if [ -f "network_monitor.pid" ]; then
          MONITOR_PID=$(cat network_monitor.pid)
          echo "Checking network monitoring process (PID: $MONITOR_PID)..."
          
          if ps -p $MONITOR_PID > /dev/null 2>&1; then
            echo "Network monitoring still running - waiting for completion..."
            # Wait a bit for it to finish naturally
            sleep 10
            
            # If still running, terminate it
            if ps -p $MONITOR_PID > /dev/null 2>&1; then
              echo "Terminating network monitoring process..."
              kill $MONITOR_PID 2>/dev/null || true
              sleep 2
            fi
          else
            echo "Network monitoring process has completed"
          fi
        else
          echo "No network monitoring PID file found"
        fi
        
        # Collect results from log file
        if [ -f "network_monitor_results.log" ]; then
          echo ""
          echo "📊 NETWORK MONITORING RESULTS:"
          echo "=============================="
          cat network_monitor_results.log
          
          # Check for any OAuth2 activity
          if grep -q "OAuth2 connection detected\|DNS resolution successful" network_monitor_results.log; then
            echo ""
            echo "🌐 OAuth2 network activity detected during monitoring!"
          else
            echo ""
            echo "ℹ️ No OAuth2 network activity detected during monitoring period"
          fi
          
          # Count activities
          CONNECTION_COUNT=$(grep -c "OAuth2 connection detected" network_monitor_results.log 2>/dev/null || echo "0")
          DNS_COUNT=$(grep -c "DNS resolution successful" network_monitor_results.log 2>/dev/null || echo "0")
          
          echo ""
          echo "📈 Activity Summary:"
          echo "  OAuth2 connections detected: $CONNECTION_COUNT"
          echo "  DNS resolutions detected: $DNS_COUNT"
          
        else
          echo "⚠️ Network monitoring results file not found"
          echo "Monitoring may not have started properly or results were not saved"
          
          # Check if there's any startup log
          if [ -f "network_monitor_start.log" ]; then
            echo ""
            echo "Startup log contents:"
            cat network_monitor_start.log
          fi
        fi
        
        echo ""
        echo "Network monitoring analysis completed"
      shell: bash

    # Step 13: Upload Comprehensive Diagnostic Results
    - name: Upload Enhanced Detection and Settings Analysis Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: comprehensive-login-analysis-results
        path: |
          detection_results.json
          network_monitor_results.log
          network_monitor_start.log
          network_monitor.ps1
          .github/scripts/detect-login-dialog.ps1
          .github/scripts/analyze-all-certum-settings.ps1
          .github/scripts/test-setting-modifications.ps1
          certum_settings_analysis_*.json
          certum_settings_analysis_*.txt
          certum_settings_analysis_*.reg
          setting_modification_test_results.json
          setting_modification_summary.txt
          most_promising_setting.json
          *.log
          *.reg
          registry_changes_*.txt
          full_changes_*.txt
          processes_*.csv
        retention-days: 7
        compression-level: 9

    # Step 14: Generate Comprehensive Summary Report
    - name: Generate Enhanced Diagnostic Summary
      if: always()
      run: |
        echo "=== COMPREHENSIVE LOGIN DIALOG ANALYSIS SUMMARY ==="
        echo "Date: $(date)"
        echo "Environment: GitHub Actions Windows Runner"
        echo "Analysis approach: Broad settings discovery + systematic testing"
        echo "Detection timeout: ${{ inputs.detection_timeout }} seconds"
        echo "Network monitoring: ${{ inputs.enable_network_monitoring }}"
        echo ""
        
        echo "🔍 ANALYSIS PHASES COMPLETED:"
        echo "1. ✅ SimplySign installation and initialization"
        echo "2. ✅ Registry monitoring (before/after snapshots)"
        echo "3. ✅ Comprehensive Certum settings analysis"
        echo "4. ✅ Systematic setting modification testing"
        echo "5. ✅ Enhanced login dialog detection"
        echo ""
        
        # Check for settings analysis results
        if [ -f "certum_settings_analysis_detailed_results.json" ]; then
          echo "📊 SETTINGS ANALYSIS RESULTS:"
          echo "  ✓ Settings analysis completed - check JSON file for details"
          if grep -q "PotentialTriggers" certum_settings_analysis_detailed_results.json; then
            echo "  🎯 Potential login triggers found in analysis"
          else
            echo "  - No obvious potential triggers identified"
          fi
        else
          echo "⚠️  No settings analysis results found"
        fi
        
        echo ""
        
        # Check for modification test results
        if [ -f "setting_modification_test_results.json" ]; then
          echo "🧪 SETTING MODIFICATION TEST RESULTS:"
          echo "  ✓ Setting modification tests completed"
          if grep -q "SignificantFindings" setting_modification_test_results.json; then
            echo "  🚨 Significant findings detected - check results file"
          else
            echo "  - No significant behavior changes detected"
          fi
        else
          echo "⚠️  No modification test results found"
        fi
        
        echo ""
        
        # Check for login dialog detection results
        if [ -f "detection_results.json" ]; then
          echo "🎯 LOGIN DIALOG DETECTION RESULTS:"
          if grep -q '"detected": *true' detection_results.json; then
            echo "  ✅ Login dialog detected!"
          else
            echo "  ❌ No login dialog detected"
          fi
        else
          echo "⚠️  No detection results found"
        fi
        
        echo ""
        echo "📁 GENERATED FILES:"
        echo "Analysis and test files created during this run:"
        ls -la *.json *.txt *.reg 2>/dev/null | head -10 || echo "  No analysis files found"
        
        echo ""
        echo "🎯 KEY INSIGHTS SUMMARY:"
        echo "========================="
        
        # Determine overall outcome
        SETTINGS_FOUND=false
        DETECTION_SUCCESS=false
        
        if [ -f "setting_modification_test_results.json" ] && grep -q "SignificantFindings" setting_modification_test_results.json; then
          SETTINGS_FOUND=true
        fi
        
        if [ -f "detection_results.json" ] && grep -q '"detected": *true' detection_results.json; then
          DETECTION_SUCCESS=true
        fi
        
        if [ "$SETTINGS_FOUND" = true ] && [ "$DETECTION_SUCCESS" = true ]; then
          echo "🎉 SUCCESS: Found settings that trigger login dialog!"
          echo "   Recommendation: Use the identified settings in production workflow"
        elif [ "$SETTINGS_FOUND" = true ]; then
          echo "🔍 PARTIAL SUCCESS: Found behavior-affecting settings"
          echo "   Recommendation: Further test these settings for login dialog control"
        elif [ "$DETECTION_SUCCESS" = true ]; then
          echo "🎯 DETECTION SUCCESS: Login dialog appeared without setting changes"
          echo "   Recommendation: Current configuration may already be sufficient"
        else
          echo "❌ NO OBVIOUS LOGIN TRIGGERS FOUND"
          echo "   Possible explanations:"
          echo "   1. Login dialog controlled by config files (not registry)"
          echo "   2. Requires user interaction to trigger"
          echo "   3. Headless environment inherently prevents login dialogs"
          echo "   4. Windows version uses different approach than macOS"
          echo ""
          echo "   Recommendations:"
          echo "   - Review generated analysis files for missed settings"
          echo "   - Look for XML/INI config files in AppData"
          echo "   - Try simulating user interaction"
          echo "   - Test with different startup parameters"
          echo "   - Consider if GUI automation is needed instead of setting changes"
        fi
        
        echo ""
        echo "📋 NEXT STEPS:"
        echo "=============="
        echo "1. Download and review 'comprehensive-login-analysis-results' artifact"
        echo "2. Check detailed JSON files for specific findings"
        echo "3. If settings found: Test them individually in your environment"
        echo "4. If no triggers found: Explore alternative approaches (files, UI automation)"
        echo "5. Consider testing in interactive (non-headless) environment"
        echo ""
        echo "🔗 ARTIFACT FILES:"
        echo "All analysis results uploaded as 'comprehensive-login-analysis-results'"
        echo "Key files to review:"
        echo "  - certum_settings_analysis_detailed_results.json"
        echo "  - setting_modification_test_results.json"
        echo "  - setting_modification_summary.txt"
        echo "  - detection_results.json"
        
      shell: bash
