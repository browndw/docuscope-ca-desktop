name: "Signing Pipeline - Step 5: Final Signing"

on:
  workflow_dispatch:
    inputs:
      binary-artifact:
        description: 'Binary artifact name from Step 1'
        required: true
        type: string
      working-algorithm:
        descriptio      - name: Upload final signed binary
        if: steps.signing-results.outputs.signing-successful == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: signed-binary-final-${{ github.run_id }}
          path: ${{ steps.signing-results.outputs.signed-binary-path }}
          retention-days: 7

      - name: Upload pipeline summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-summary-${{ github.run_id }}
          path: |
            *.log
          retention-days: 5ksum algorithm from Step 4'
        required: false
        type: string
        default: 'none'
      valid-activation-code:
        description: 'Valid activation code from Step 4'
        required: false
        type: string
        default: 'none'
      algorithms-tested:
        description: 'Number of algorithms tested'
        required: false
        type: string
        default: '0'

defaults:
  run:
    shell: bash

jobs:
  final-code-signing:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      signing-successful: ${{ steps.signing-results.outputs.signing-successful }}
      signed-binary-path: ${{ steps.signing-results.outputs.signed-binary-path }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download binary from previous steps
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.binary-artifact }}
          path: dist/

      - name: Review pipeline status
        run: |
          echo "=== PIPELINE STATUS REVIEW ==="
          echo "Binary artifact: ${{ inputs.binary-artifact }}"
          echo "Working algorithm: ${{ inputs.working-algorithm }}"
          echo "Valid activation code: ${{ inputs.valid-activation-code }}"
          echo "Algorithms tested: ${{ inputs.algorithms-tested }}"
          
          if [ "${{ inputs.working-algorithm }}" != "none" ]; then
            echo "✅ Checksum algorithm breakthrough: ${{ inputs.working-algorithm }}"
            echo "🔐 Valid activation code available"
          else
            echo "⚠️ No working checksum algorithm found"
            echo "Will attempt signing with available certificates"
          fi

      - name: Test Code Signing
        env:
          CERTUM_CERTIFICATE_SHA1: ${{ secrets.CERTUM_CERTIFICATE_SHA1 }}
        run: |
          echo "=== TESTING CODE SIGNING ==="
          echo "Testing code signing with Windows SDK signtool.exe..."
          
          # Find signtool.exe - prioritize working older versions first
          SIGNTOOL_PATHS=(
            "/c/Program Files (x86)/Windows Kits/10/bin/10.0.19041.0/x64/signtool.exe"
            "/c/Program Files (x86)/Windows Kits/10/bin/10.0.18362.0/x64/signtool.exe"
            "/c/Program Files (x86)/Windows Kits/10/bin/10.0.17763.0/x64/signtool.exe"
            "/c/Program Files (x86)/Windows Kits/10/bin/x64/signtool.exe"
            "/c/Program Files (x86)/Microsoft SDKs/Windows/v10.0A/bin/NETFX 4.8 Tools/x64/signtool.exe"
            "/c/Program Files (x86)/Microsoft SDKs/Windows/v10.0A/bin/NETFX 4.7.2 Tools/x64/signtool.exe"
          )
          
          SIGNTOOL_EXE=""
          for path in "${SIGNTOOL_PATHS[@]}"; do
            if [ -f "$path" ]; then
              SIGNTOOL_EXE="$path"
              echo "✅ Found signtool.exe: $SIGNTOOL_EXE"
              break
            fi
          done
          
          if [ -z "$SIGNTOOL_EXE" ]; then
            echo "❌ signtool.exe not found"
            echo "Searching for any signtool.exe..."
            find /c/Program* -name "signtool.exe" 2>/dev/null | head -5 || echo "No signtool.exe found"
            exit 1
          fi
          
          # Test signtool version
          echo "Testing signtool version..."
          "$SIGNTOOL_EXE" /? | head -10 || echo "Signtool help completed"
          
          # Verify binary to sign exists
          BINARY_TO_SIGN="dist/entrypoint.exe"
          if [ ! -f "$BINARY_TO_SIGN" ]; then
            echo "❌ Binary to sign not found: $BINARY_TO_SIGN"
            ls -la dist/
            exit 1
          fi
          
          echo "✅ Binary to sign: $BINARY_TO_SIGN"
          echo "Binary size: $(stat -c%s "$BINARY_TO_SIGN" 2>/dev/null || echo "unknown") bytes"
          
          # Check available certificates
          echo ""
          echo "=== CHECKING AVAILABLE CERTIFICATES ==="
          echo "Listing certificates in CurrentUser\\My store..."
          
          CERT_COUNT=$(powershell -Command "try { (Get-ChildItem -Path 'Cert:\\CurrentUser\\My' | Measure-Object).Count } catch { 0 }" 2>/dev/null || echo "0")
          echo "Total certificates available: $CERT_COUNT"
          
          if [ "$CERT_COUNT" -gt "0" ]; then
            echo "Available certificates:"
            powershell -Command "Get-ChildItem -Path 'Cert:\\CurrentUser\\My' | Select-Object Thumbprint, Subject, NotAfter | Format-Table -AutoSize" 2>/dev/null | head -20 || echo "Certificate listing completed"
          fi
          
          # Try signing with target certificate if available
          if [[ -n "$CERTUM_CERTIFICATE_SHA1" ]]; then
            echo ""
            echo "=== ATTEMPTING CODE SIGNING WITH TARGET CERTIFICATE ==="
            echo "Target certificate: $CERTUM_CERTIFICATE_SHA1"
            
            # Check if target certificate exists
            TARGET_CERT_EXISTS=$(powershell -Command "Get-ChildItem -Path 'Cert:\\CurrentUser\\My' | Where-Object { \$_.Thumbprint -eq '$CERTUM_CERTIFICATE_SHA1' }" 2>/dev/null)
            
            if [ -n "$TARGET_CERT_EXISTS" ]; then
              echo "✅ Target certificate found in store"
              
              # Attempt signing
              echo "Attempting to sign binary with target certificate..."
              SIGNED_BINARY="dist/entrypoint_signed.exe"
              cp "$BINARY_TO_SIGN" "$SIGNED_BINARY"
              
              # Sign the binary
              echo "Running signtool sign command..."
              SIGN_RESULT=$("$SIGNTOOL_EXE" sign /sha1 "$CERTUM_CERTIFICATE_SHA1" /t http://timestamp.digicert.com /v "$SIGNED_BINARY" 2>&1)
              SIGN_EXIT_CODE=$?
              
              echo "Signing result (exit code: $SIGN_EXIT_CODE):"
              echo "$SIGN_RESULT"
              
              if [ $SIGN_EXIT_CODE -eq 0 ]; then
                echo "✅ CODE SIGNING SUCCESSFUL!"
                echo "Signed binary: $SIGNED_BINARY"
                
                # Verify signature
                echo "Verifying signature..."
                VERIFY_RESULT=$("$SIGNTOOL_EXE" verify /pa /v "$SIGNED_BINARY" 2>&1)
                echo "Verification result:"
                echo "$VERIFY_RESULT"
                
                # Save successful signing info
                echo "SIGNING_SUCCESSFUL=true" >> $GITHUB_ENV
                echo "SIGNED_BINARY_PATH=$SIGNED_BINARY" >> $GITHUB_ENV
                
              else
                echo "❌ Code signing failed"
                echo "Will try alternative signing methods..."
                echo "SIGNING_SUCCESSFUL=false" >> $GITHUB_ENV
              fi
              
            else
              echo "❌ Target certificate not found in store"
              echo "Available certificates do not include target SHA1"
              echo "SIGNING_SUCCESSFUL=false" >> $GITHUB_ENV
            fi
            
          else
            echo "⚠️ No target certificate SHA1 provided"
            echo "Cannot attempt specific certificate signing"
            echo "SIGNING_SUCCESSFUL=false" >> $GITHUB_ENV
          fi
          
          # Alternative: Try signing with any available certificate
          if [ "$CERT_COUNT" -gt "0" ] && [ "${SIGNING_SUCCESSFUL:-false}" != "true" ]; then
            echo ""
            echo "=== ALTERNATIVE: SIGNING WITH ANY AVAILABLE CERTIFICATE ==="
            
            FIRST_CERT_SHA1=$(powershell -Command "Get-ChildItem -Path 'Cert:\\CurrentUser\\My' | Select-Object -First 1 -ExpandProperty Thumbprint" 2>/dev/null | tr -d '\r\n' || echo "")
            
            if [ -n "$FIRST_CERT_SHA1" ]; then
              echo "Trying first available certificate: $FIRST_CERT_SHA1"
              
              ALTERNATIVE_SIGNED="dist/entrypoint_alt_signed.exe"
              cp "$BINARY_TO_SIGN" "$ALTERNATIVE_SIGNED"
              
              ALT_SIGN_RESULT=$("$SIGNTOOL_EXE" sign /sha1 "$FIRST_CERT_SHA1" /t http://timestamp.digicert.com /v "$ALTERNATIVE_SIGNED" 2>&1)
              ALT_SIGN_EXIT_CODE=$?
              
              echo "Alternative signing result (exit code: $ALT_SIGN_EXIT_CODE):"
              echo "$ALT_SIGN_RESULT" | head -10
              
              if [ $ALT_SIGN_EXIT_CODE -eq 0 ]; then
                echo "✅ ALTERNATIVE SIGNING SUCCESSFUL!"
                echo "SIGNING_SUCCESSFUL=true" >> $GITHUB_ENV
                echo "SIGNED_BINARY_PATH=$ALTERNATIVE_SIGNED" >> $GITHUB_ENV
              else
                echo "❌ Alternative signing also failed"
              fi
            fi
          fi

      - name: Generate final results
        id: signing-results
        run: |
          echo "=== GENERATING FINAL RESULTS ==="
          
          if [ "${SIGNING_SUCCESSFUL:-false}" = "true" ]; then
            echo "signing-successful=true" >> $GITHUB_OUTPUT
            echo "signed-binary-path=${SIGNED_BINARY_PATH:-none}" >> $GITHUB_OUTPUT
            
            echo "🎉 SIGNING PIPELINE SUCCESSFUL!"
            echo "✅ Binary signed successfully"
            echo "📁 Signed binary: ${SIGNED_BINARY_PATH:-none}"
            
            if [ "${{ inputs.working-algorithm }}" != "none" ]; then
              echo "🔬 Checksum algorithm: ${{ inputs.working-algorithm }}"
              echo "🔐 Activation code: ${{ inputs.valid-activation-code }}"
            fi
            
          else
            echo "signing-successful=false" >> $GITHUB_OUTPUT
            echo "signed-binary-path=none" >> $GITHUB_OUTPUT
            
            echo "❌ SIGNING PIPELINE INCOMPLETE"
            echo "⚠️ Binary signing failed or no certificates available"
            
            if [ "${{ inputs.working-algorithm }}" != "none" ]; then
              echo "✅ But checksum breakthrough achieved: ${{ inputs.working-algorithm }}"
            fi
          fi
          
          echo ""
          echo "=== PIPELINE SUMMARY ==="
          echo "🏗️ Build: ✅ Successful"
          echo "🔧 Setup: ✅ Successful"
          echo "🔐 Auth: Completed (certificates checked)"
          echo "🔬 Checksum: ${{ inputs.algorithms-tested }} algorithms tested"
          if [ "${{ inputs.working-algorithm }}" != "none" ]; then
            echo "  └─ ✅ Working algorithm: ${{ inputs.working-algorithm }}"
          else
            echo "  └─ ❌ No working algorithm found"
          fi
          echo "📝 Signing: ${SIGNING_SUCCESSFUL:-false}"

      - name: Upload final signed binary
        if: env.SIGNING_SUCCESSFUL == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: signed-binary-final-${{ github.run_id }}
          path: ${{ env.SIGNED_BINARY_PATH }}
          retention-days: 7

      - name: Upload pipeline summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-summary-${{ github.run_id }}
          path: |
            *.log
          retention-days: 5
