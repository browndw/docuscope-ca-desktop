name: "Clean Signing Pipeline with Modular Scripts"

on:
  workflow_dispatch:
    inputs:
      use_mock_binary:
        description: 'Use mock binary for fast certificate testing'
        required: false
        default: false
        type: boolean
      require_manual_approval:
        description: 'Require manual approval before certificate signing (recommended for production)'
        required: false
        default: true
        type: boolean
      certum_totp_seed:
        description: 'TOTP Code from mobile app (6 digits) - Leave empty to pause for manual entry'
        required: false
        default: ''
        type: string

defaults:
  run:
    shell: bash

jobs:
  # Step 1: Build Binary (separate job)
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      binary-path: ${{ steps.set-output.outputs.binary-path }}
      binary-size: ${{ steps.set-output.outputs.binary-size }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Mock Binary
        if: inputs.use_mock_binary == true
        run: |
          echo "Creating mock binary for fast testing..."
          
          # Create a simple C program
          cat > test_binary.c << 'EOF'
          #include <stdio.h>
          int main() {
              printf("DocuScope Test Binary v1.0\n");
              printf("Mock binary for certificate testing\n");
              return 0;
          }
          EOF
          
          # Compile with gcc (available on GitHub runners)
          gcc test_binary.c -o docuscope-test.exe
          
          if [ -f "docuscope-test.exe" ]; then
            echo "✅ Mock binary created successfully"
            ls -la docuscope-test.exe
            echo "BINARY_FILE=docuscope-test.exe" >> "$GITHUB_ENV"
          else
            echo "❌ Failed to create mock binary"
            exit 1
          fi

      - name: Build Real Binary
        if: inputs.use_mock_binary != true
        run: |
          echo "Building real PyInstaller binary..."
          echo "⚠️ This is a placeholder - implement actual build process"
          echo "For testing, we'll create a mock binary"
          
          # Temporary: Create mock binary even for "real" build
          gcc -xc - -o docuscope-real.exe << 'EOF'
          #include <stdio.h>
          int main() {
              printf("DocuScope Real Binary (Mock) v1.0\n");
              return 0;
          }
          EOF
          
          echo "BINARY_FILE=docuscope-real.exe" >> "$GITHUB_ENV"

      - name: Set Build Outputs
        id: set-output
        run: |
          echo "binary-path=$BINARY_FILE" >> "$GITHUB_OUTPUT"
          echo "binary-size=$(stat -c%s "$BINARY_FILE")" >> "$GITHUB_OUTPUT"

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-binary
          path: "*.exe"
          retention-days: 1

  # Steps 2-5: All Certificate Operations (single job to avoid runner isolation)
  certificate-operations:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Binary Artifact
        uses: actions/download-artifact@v4
        with:
          name: unsigned-binary

      - name: Prepare Binary for Signing
        run: |
          echo "Preparing binary for signing..."
          
          # Find the downloaded binary
          BINARY_FILE=$(find . -name "*.exe" -type f | head -1)
          if [ -n "$BINARY_FILE" ]; then
            echo "✅ Found binary: $BINARY_FILE"
            
            # Create a standard name for signing
            cp "$BINARY_FILE" "binary-to-sign.exe"
            echo "BINARY_PATH=$(pwd)/binary-to-sign.exe" >> "$GITHUB_ENV"
            
            # Test the binary
            echo "Testing binary functionality..."
            timeout 5 ./binary-to-sign.exe || echo "Binary test completed"
          else
            echo "❌ No binary file found"
            exit 1
          fi

      - name: Step 2 - Install SimplySign Desktop
        env:
          CERTUM_USERNAME: ${{ secrets.CERTUM_USERNAME }}
          CERTUM_PASSWORD: ${{ secrets.CERTUM_PASSWORD }}
          CERTUM_CERTIFICATE_SHA1: ${{ secrets.CERTUM_CERTIFICATE_SHA1 }}
        run: |
          echo "=== Step 2: Installing SimplySign Desktop ==="
          
          # Use our modular script
          chmod +x .github/scripts/install-simplysign.sh
          ./.github/scripts/install-simplysign.sh
          
          echo "✅ Step 2 completed"

      - name: Step 3 - Test Authentication
        env:
          CERTUM_USERNAME: ${{ secrets.CERTUM_USERNAME }}
          CERTUM_PASSWORD: ${{ secrets.CERTUM_PASSWORD }}
          CERTUM_CERTIFICATE_SHA1: ${{ secrets.CERTUM_CERTIFICATE_SHA1 }}
        run: |
          echo "=== Step 3: Testing Authentication ==="
          
          # Install Windows SDK for signtool (avoiding problematic versions)
          echo "Installing Windows SDK for signtool..."
          echo "🔧 CRITICAL: Avoiding Windows SDK 10.0.22621.0 due to /fd parameter parsing regression"
          echo "🔧 Using older, stable SDK versions that work with /fd parameter"
          
          # Try multiple working SDK versions in order of preference
          # These versions are confirmed to work with /fd parameter for code signing
          choco install windows-sdk-8.1 --yes --no-progress --limit-output || \
          choco install windows-sdk-10.0 --version 10.0.19041.685 --yes --no-progress --limit-output || \
          choco install windows-sdk-10.0 --version 10.0.18362.1 --yes --no-progress --limit-output || \
          choco install windows-sdk-10.0 --version 10.0.17763.132 --yes --no-progress --limit-output || \
          echo "⚠️ SDK install attempted - signtool may already be available"
          
          # Use our modular script
          chmod +x .github/scripts/test-authentication.sh
          ./.github/scripts/test-authentication.sh
          
          echo "✅ Step 3 completed"

      # Step 4: Enable RDP Access for Interactive Authentication
      - name: Enable RDP Access for OAuth2 Authentication
        if: inputs.require_manual_approval == true
        run: |
          echo '🎉 BREAKTHROUGH: Automatic Authentication Configured!'
          echo '🔐 SimplySign Desktop is ready with automatic OAuth2 trigger'
          echo ''
          echo '�️ ENABLING RDP ACCESS FOR INTERACTIVE AUTHENTICATION'
          echo '━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━'
          echo ''
          
          # Set RDP password
          RDP_PASSWORD=$(openssl rand -base64 32 | tr -d '=/+' | cut -c1-16)
          echo "RDP_PASSWORD=$RDP_PASSWORD" >> "$GITHUB_ENV"
          
          # Enable RDP
          echo '🔧 Configuring Windows Remote Desktop...'
          powershell -Command "
          # Enable RDP
          Set-ItemProperty -Path 'HKLM:\\System\\CurrentControlSet\\Control\\Terminal Server' -Name 'fDenyTSConnections' -Value 0
          
          # Enable RDP through Windows Firewall
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'
          
          # Set authentication level
          Set-ItemProperty -Path 'HKLM:\\System\\CurrentControlSet\\Control\\Terminal Server\\WinStations\\RDP-Tcp' -Name 'UserAuthentication' -Value 0
          
          # Create RDP user
          net user rdpuser '$RDP_PASSWORD' /add
          net localgroup 'Remote Desktop Users' rdpuser /add
          net localgroup 'Administrators' rdpuser /add
          
          Write-Host '✅ RDP enabled and user created'
          "
          
          # Get public IP for RDP connection
          echo '🌐 Getting runner public IP address...'
          PUBLIC_IP=$(curl -s https://api.ipify.org || curl -s https://ipecho.net/plain || curl -s https://icanhazip.com)
          echo "Runner Public IP: $PUBLIC_IP"
          
          echo ''
          echo '🔐 RDP CONNECTION DETAILS:'
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🖥️  IP Address: $PUBLIC_IP"
          echo "👤 Username: rdpuser"
          echo "🔑 Password: $RDP_PASSWORD"
          echo "🚪 Port: 3389 (default RDP port)"
          echo ''
          echo '📱 MOBILE TOTP APP: Have your Certum mobile app ready!'
          echo ''
          echo '🎯 AUTHENTICATION INSTRUCTIONS:'
          echo '1. � Connect to RDP using the credentials above'
          echo '2. 🖥️  You should see Windows desktop with SimplySign Desktop running'
          echo '3. 🚀 OAuth2 dialog should be visible (from Step 3 auto-trigger)'
          echo '4. 👤 Enter your Certum email in the OAuth2 dialog'
          echo '5. 📱 Generate TOTP code on mobile and enter it'
          echo '6. ✅ Complete authentication (virtual smart card activates)'
          echo '7. ❌ CLOSE this RDP session (workflow will continue automatically)'
          echo ''
          echo '⚠️  IMPORTANT TIMING:'
          echo '• You have 45 minutes to complete authentication'
          echo '• OAuth2 dialog may timeout - if so, signing step will re-trigger it'
          echo '• Once authenticated, signing will happen automatically'
          echo '• Do NOT stay connected - close RDP after authentication'
          echo ''
          echo '🔄 WORKFLOW STATUS: Pausing for 45 minutes for manual authentication'
          echo 'The workflow will automatically continue after the timeout or when you close RDP'
          echo ''
          
          # Wait for authentication - 45 minute window
          echo "⏳ Waiting 45 minutes for interactive authentication..."
          echo "$(date): Authentication window started"
          
          # Monitor for authentication completion
          for i in {1..2700}; do  # 45 minutes = 2700 seconds
            sleep 1
            
            # Check every minute
            if [ $((i % 60)) -eq 0 ]; then
              minutes_remaining=$(((2700 - i) / 60))
              echo "⏱️  Authentication time remaining: $minutes_remaining minutes"
              
              # Check if user has disconnected (sign they completed auth)
              active_sessions=$(powershell -Command "quser 2>$null | Select-String 'rdpuser' | Measure-Object | Select-Object -ExpandProperty Count")
              if [ "$active_sessions" -eq "0" ]; then
                echo "✅ RDP session closed - assuming authentication completed!"
                echo "🚀 Proceeding with certificate signing..."
                break
              fi
            fi
          done
          
          echo "$(date): Authentication window ended"
          echo "🔄 Proceeding with certificate signing phase..."

      - name: Step 5 - Certum Desktop Signing
        env:
          CERTUM_USERNAME: ${{ secrets.CERTUM_USERNAME }}
          CERTUM_PASSWORD: ${{ secrets.CERTUM_PASSWORD }}
          CERTUM_CERTIFICATE_SHA1: ${{ secrets.CERTUM_CERTIFICATE_SHA1 }}
          CERTUM_TOTP_SEED: ${{ inputs.certum_totp_seed }}
        run: |
          echo "=== Step 5: Certum Desktop Signing ==="
          echo "🔐 Ready for OAuth2-based signing"
          echo "📱 TOTP status: ${{ inputs.certum_totp_seed != '' && 'Provided via workflow input' || 'Manual entry required in OAuth2 dialog' }}"
          echo "🎯 AUTOMATIC AUTHENTICATION: OAuth2 dialog should open automatically!"
          echo "💡 Based on macOS discovery - no manual trigger required"
          
          # Use our modular script
          chmod +x .github/scripts/certum-desktop-signing.sh
          ./.github/scripts/certum-desktop-signing.sh
          
          echo "✅ Step 5 completed"

      - name: Step 6 - Code Signing
        env:
          CERTUM_USERNAME: ${{ secrets.CERTUM_USERNAME }}
          CERTUM_PASSWORD: ${{ secrets.CERTUM_PASSWORD }}
          CERTUM_CERTIFICATE_SHA1: ${{ secrets.CERTUM_CERTIFICATE_SHA1 }}
        run: |
          echo "=== Step 6: Code Signing ==="
          
          # Use our modular script
          chmod +x .github/scripts/sign-binary.sh
          ./.github/scripts/sign-binary.sh
          
          echo "✅ Step 6 completed"

      - name: Verify Signed Binary
        run: |
          echo "Verifying signed binary..."
          
          if [ -f "$BINARY_PATH" ]; then
            echo "✅ Signed binary exists: $BINARY_PATH"
            ls -la "$BINARY_PATH"
            
            # Test the signed binary
            echo "Testing signed binary..."
            timeout 5 "$BINARY_PATH" || echo "Signed binary test completed"
            
          else
            echo "❌ Signed binary not found"
            exit 1
          fi

      - name: Upload Signed Binary
        uses: actions/upload-artifact@v4
        with:
          name: signed-binary
          path: "binary-to-sign.exe"
          retention-days: 7

  # Summary job
  summary:
    needs: [build, certificate-operations]
    runs-on: windows-latest
    if: always()
    
    steps:
      - name: Pipeline Summary
        run: |
          echo "=== Clean Signing Pipeline Summary ==="
          echo ""
          echo "Build Job: ${{ needs.build.result }}"
          echo "Certificate Operations: ${{ needs.certificate-operations.result }}"
          echo ""
          
          if [ "${{ needs.build.result }}" = "success" ] && [ "${{ needs.certificate-operations.result }}" = "success" ]; then
            echo "🎉 Pipeline completed successfully!"
            echo "✅ Binary built and signed with Certum certificate"
          else
            echo "❌ Pipeline failed"
            echo "Check the logs for details"
          fi
