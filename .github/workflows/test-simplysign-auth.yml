name: Test Certum SimplySign Authentication

on:
  workflow_dispatch:
    inputs:
      test_only:
        description: 'Test authentication methods only'
        required: false
        default: 'true'

jobs:
  test-simplysign:
    runs-on: windows-latest
    steps:
      - name: Test SimplySign Authentication Methods
        shell: bash
        env:
          CERTUM_USERNAME: ${{ secrets.CERTUM_USERNAME }}
          CERTUM_PASSWORD: ${{ secrets.CERTUM_PASSWORD }}
          CERTUM_CERTIFICATE_SHA1: ${{ secrets.CERTUM_CERTIFICATE_SHA1 }}
          CERTUM_API_TOKEN: ${{ secrets.CERTUM_API_TOKEN }}
        run: |
          echo "=== Testing Current Certum Cloud Signing ==="
          
          # Install proCertum SmartSign Software (includes SimplySign cloud module)
          echo "Installing proCertum SmartSign Software..."
          
          # Try downloading the current proCertum SmartSign installer
          DOWNLOAD_URLS=(
            "https://www.certum.eu/downloads/software/proCertumSmartSign.exe"
            "https://www.certum.pl/downloads/software/proCertumSmartSign.exe"
            "https://download.certum.pl/proCertumSmartSign.exe"
            "https://files.certum.pl/proCertumSmartSign.exe"
          )
          
          INSTALLER_DOWNLOADED=false
          for url in "${DOWNLOAD_URLS[@]}"; do
            echo "Trying: $url"
            if curl -L "$url" -o proCertumSmartSign.exe --fail; then
              # Check if it's actually an executable
              if file proCertumSmartSign.exe | grep -q "executable\|PE32"; then
                echo "✅ Successfully downloaded proCertum SmartSign from: $url"
                INSTALLER_DOWNLOADED=true
                break
              else
                echo "Downloaded file is not an executable, trying next URL..."
                rm -f proCertumSmartSign.exe
              fi
            else
              echo "Failed to download from: $url"
            fi
          done
          
          if [ "$INSTALLER_DOWNLOADED" = false ]; then
            echo "⚠️ Could not download proCertum SmartSign installer"
            echo "Trying alternative approach: using jsign for cloud signing..."
            
            # Install jsign as alternative for cloud signing
            echo "Installing jsign (Java-based code signing tool)..."
            curl -L "https://github.com/ebourg/jsign/releases/download/5.0/jsign-5.0.jar" -o jsign.jar
            
            # Test jsign cloud signing with Certum
            echo ""
            echo "=== Testing Cloud Signing with jsign ==="
            
            if [[ -n "$CERTUM_USERNAME" && -n "$CERTUM_PASSWORD" && -n "$CERTUM_CERTIFICATE_SHA1" ]]; then
              echo "Testing Certum cloud signing authentication..."
              
              # Create a dummy executable file to test signing (jsign only works with executables)
              echo "Creating test executable for signing..."
              # Download a small Windows executable for testing
              curl -L "https://github.com/microsoft/vscode/releases/download/1.85.0/VSCodeUserSetup-x64-1.85.0.exe" -o test_executable.exe --fail || \
              curl -L "https://notepad-plus-plus.org/downloads/v8.6/npp.8.6.Installer.exe" -o test_executable.exe --fail || \
              echo "echo 'test'" > test_script.bat
              
              # If we couldn't download an exe, create a simple batch file
              if [ ! -f "test_executable.exe" ]; then
                echo "Using batch file for testing..."
                TEST_FILE="test_script.bat"
              else
                echo "Using downloaded executable for testing..."
                TEST_FILE="test_executable.exe"
              fi
              
              # Check jsign help for keystore types
              echo "Available jsign keystore types:"
              java -jar jsign.jar --help | grep -A1 -B1 "ESIGNER\|DIGICERT\|keystore type"
              
              echo ""
              echo "Testing different jsign approaches for Certum cloud signing..."
              
              # Test Method 1: ESIGNER keystore (likely for SSL.com/Certum cloud signing)
              echo "Method 1: ESIGNER keystore approach"
              java -jar jsign.jar \
                --storetype ESIGNER \
                --storepass "$CERTUM_USERNAME|$CERTUM_PASSWORD" \
                --alias "$CERTUM_CERTIFICATE_SHA1" \
                --tsaurl "http://time.certum.pl" \
                "$TEST_FILE" 2>&1 && echo "✅ Method 1 SUCCESS" || echo "❌ Method 1 failed"
              
              # Test Method 2: ESIGNER with different credential format
              echo ""
              echo "Method 2: ESIGNER with different credential format"
              java -jar jsign.jar \
                --storetype ESIGNER \
                --storepass "$CERTUM_USERNAME" \
                --keypass "$CERTUM_PASSWORD" \
                --alias "$CERTUM_CERTIFICATE_SHA1" \
                --tsaurl "http://time.certum.pl" \
                "$TEST_FILE" 2>&1 && echo "✅ Method 2 SUCCESS" || echo "❌ Method 2 failed"
              
              # Test Method 3: Try with certificate SHA1 as keystore reference
              echo ""
              echo "Method 3: Direct certificate reference"
              java -jar jsign.jar \
                --storetype ESIGNER \
                --keystore "$CERTUM_CERTIFICATE_SHA1" \
                --storepass "$CERTUM_USERNAME:$CERTUM_PASSWORD" \
                --tsaurl "http://time.certum.pl" \
                "$TEST_FILE" 2>&1 && echo "✅ Method 3 SUCCESS" || echo "❌ Method 3 failed"
              
              # Test Method 4: PKCS11 with Certum cloud endpoint
              echo ""
              echo "Method 4: PKCS11 cloud approach"
              java -jar jsign.jar \
                --storetype PKCS11 \
                --keystore "https://api.certum.eu/pkcs11" \
                --storepass "$CERTUM_USERNAME:$CERTUM_PASSWORD" \
                --alias "$CERTUM_CERTIFICATE_SHA1" \
                --tsaurl "http://time.certum.pl" \
                "$TEST_FILE" 2>&1 && echo "✅ Method 4 SUCCESS" || echo "❌ Method 4 failed"
              
              # Test Method 5: Check if we need to specify cloud endpoint
              echo ""
              echo "Method 5: ESIGNER with cloud endpoint"
              java -jar jsign.jar \
                --storetype ESIGNER \
                --keystore "https://api.ssl.com" \
                --storepass "$CERTUM_USERNAME|$CERTUM_PASSWORD|https://api.certum.eu" \
                --alias "$CERTUM_CERTIFICATE_SHA1" \
                --tsaurl "http://time.certum.pl" \
                "$TEST_FILE" 2>&1 && echo "✅ Method 5 SUCCESS" || echo "❌ Method 5 failed"
              
              echo ""
              echo "=== jsign Testing Complete ==="
              echo "If any method succeeded, we can use jsign for code signing."
              echo "If all failed, we may need to find the correct Certum cloud signing API endpoint."
            else
              echo "❌ Missing required credentials for cloud signing test"
            fi
            
            exit 0
          fi
          
          # Install proCertum SmartSign
          echo ""
          echo "Installing proCertum SmartSign..."
          ./proCertumSmartSign.exe /S
          
          # Wait for installation
          echo "Waiting for installation..."
          sleep 30
          
          # Wait for installation
          echo "Waiting for installation..."
          sleep 30
          
          # Find the cloud signing CLI - check multiple possible locations
          SMARTSIGN_CLI=""
          POSSIBLE_PATHS=(
            "C:/Program Files/Certum/proCertum SmartSign/proCertumSmartSign.exe"
            "C:/Program Files (x86)/Certum/proCertum SmartSign/proCertumSmartSign.exe"
            "C:/Program Files/Certum/SmartSign/SmartSignCLI.exe"
            "C:/Program Files (x86)/Certum/SmartSign/SmartSignCLI.exe"
            "C:/Program Files/Certum/SimplySign Desktop/SimplySignCLI.exe"
            "C:/Program Files (x86)/Certum/SimplySign Desktop/SimplySignCLI.exe"
          )
          
          echo ""
          echo "=== Searching for Certum Signing CLI ==="
          for path in "${POSSIBLE_PATHS[@]}"; do
            echo "Checking: $path"
            if [ -f "$path" ]; then
              SMARTSIGN_CLI="$path"
              echo "✅ Found CLI at: $path"
              break
            else
              echo "Not found: $path"
            fi
          done
          
          if [ -z "$SMARTSIGN_CLI" ]; then
            echo "❌ Could not find any Certum signing CLI"
            echo "Listing installed programs..."
            ls -la "C:/Program Files/Certum/" 2>/dev/null || echo "No Certum programs found in Program Files"
            ls -la "C:/Program Files (x86)/Certum/" 2>/dev/null || echo "No Certum programs found in Program Files (x86)"
            echo ""
            echo "This suggests that cloud signing may require a different approach"
            echo "or that the current proCertum SmartSign installation doesn't include CLI tools"
            exit 1
          fi
          
          # Test CLI capabilities
          echo ""
          echo "=== Testing Certum Cloud Signing CLI ==="
          echo "CLI Path: $SMARTSIGN_CLI"
          
          "$SMARTSIGN_CLI" --help 2>&1 || echo "No --help available"
          "$SMARTSIGN_CLI" -h 2>&1 || echo "No -h available"
          "$SMARTSIGN_CLI" help 2>&1 || echo "No help command available"
          "$SMARTSIGN_CLI" version 2>&1 || echo "No version command available"
          
          # Test cloud signing authentication
          echo ""
          echo "=== Testing Cloud Signing Authentication ==="
          
          if [[ -n "$CERTUM_USERNAME" && -n "$CERTUM_PASSWORD" ]]; then
            echo "Testing cloud authentication with username/password..."
            
            # Try various authentication command formats
            AUTH_COMMANDS=(
              "$SMARTSIGN_CLI auth --username $CERTUM_USERNAME --password $CERTUM_PASSWORD"
              "$SMARTSIGN_CLI login --username $CERTUM_USERNAME --password $CERTUM_PASSWORD"
              "$SMARTSIGN_CLI authenticate --user $CERTUM_USERNAME --pass $CERTUM_PASSWORD"
              "$SMARTSIGN_CLI --username $CERTUM_USERNAME --password $CERTUM_PASSWORD auth"
            )
            
            for cmd in "${AUTH_COMMANDS[@]}"; do
              echo "Trying: $cmd"
              if eval "$cmd" 2>&1; then
                echo "✅ Authentication successful with: $cmd"
                break
              else
                echo "❌ Failed: $cmd"
              fi
            done
            
            if [[ -n "$CERTUM_CERTIFICATE_SHA1" ]]; then
              echo ""
              echo "Testing with certificate SHA1: $CERTUM_CERTIFICATE_SHA1"
              "$SMARTSIGN_CLI" --certificate-sha1 "$CERTUM_CERTIFICATE_SHA1" 2>&1 || echo "Certificate SHA1 option not recognized"
            fi
          else
            echo "❌ Missing username/password for cloud signing test"
          fi
          
          echo ""
          echo "=== Test Complete ==="
          echo "Check the output above to see which authentication method works"
