name: Test Certum SimplySign Authentication

on:
  workflow_dispatch:
    inputs:
      test_only:
        description: 'Test authentication methods only'
        required: false
        default: 'true'

jobs:
  test-simplysign:
    runs-on: windows-latest
    steps:
      - name: Test SimplySign Authentication Methods
        shell: bash
        env:
          CERTUM_USERNAME: ${{ secrets.CERTUM_USERNAME }}
          CERTUM_PASSWORD: ${{ secrets.CERTUM_PASSWORD }}
          CERTUM_CERTIFICATE_SHA1: ${{ secrets.CERTUM_CERTIFICATE_SHA1 }}
          CERTUM_API_TOKEN: ${{ secrets.CERTUM_API_TOKEN }}
        run: |
          echo "=== Testing Current SimplySign Authentication ==="
          
          # Install SimplySign client - try multiple download sources
          echo "Installing SimplySign client..."
          
          # Method 1: Try direct download from Certum
          echo "Attempting download from Certum website..."
          if curl -L "https://www.certum.eu/en/simply-sign-desktop/" -o certum_page.html; then
            echo "Downloaded Certum page, checking for download links..."
            cat certum_page.html | grep -i "download" | head -5 || echo "No obvious download links found"
          fi
          
          # Method 2: Try alternative download URLs
          echo ""
          echo "Trying alternative download methods..."
          
          # Common SimplySign download URLs to try
          DOWNLOAD_URLS=(
            "https://www.certum.eu/downloads/SimplySignDesktop.exe"
            "https://www.certum.eu/en/downloads/SimplySignDesktop.exe"
            "https://download.certum.eu/SimplySignDesktop.exe"
            "https://files.certum.eu/SimplySignDesktop.exe"
          )
          
          INSTALLER_DOWNLOADED=false
          for url in "${DOWNLOAD_URLS[@]}"; do
            echo "Trying: $url"
            if curl -L "$url" -o SimplySignDesktop.exe --fail; then
              # Check if it's actually an executable (not HTML)
              if file SimplySignDesktop.exe | grep -q "executable\|PE32"; then
                echo "✅ Successfully downloaded SimplySign installer from: $url"
                INSTALLER_DOWNLOADED=true
                break
              else
                echo "Downloaded file is not an executable, trying next URL..."
                rm -f SimplySignDesktop.exe
              fi
            else
              echo "Failed to download from: $url"
            fi
          done
          
          if [ "$INSTALLER_DOWNLOADED" = false ]; then
            echo "❌ Could not download SimplySign installer from any source"
            echo "This might mean:"
            echo "1. The download URLs have changed"
            echo "2. SimplySign Desktop is no longer available for download"
            echo "3. We need to use a different approach"
            echo ""
            echo "Please check Certum's website manually for the current download link:"
            echo "https://www.certum.eu/en/simply-sign-desktop/"
            exit 1
          fi
          
          # Install SimplySign Desktop
          echo ""
          echo "Installing SimplySign Desktop..."
          ./SimplySignDesktop.exe /S
          
          # Wait for installation to complete
          echo "Waiting for installation to complete..."
          sleep 20
          
          # Find SimplySign CLI
          SIMPLYSIGN_PATH=""
          if [ -f "C:/Program Files/Certum/SimplySign Desktop/SimplySignCLI.exe" ]; then
            SIMPLYSIGN_PATH="C:/Program Files/Certum/SimplySign Desktop/SimplySignCLI.exe"
          elif [ -f "C:/Program Files (x86)/Certum/SimplySign Desktop/SimplySignCLI.exe" ]; then
            SIMPLYSIGN_PATH="C:/Program Files (x86)/Certum/SimplySign Desktop/SimplySignCLI.exe"
          else
            echo "ERROR: SimplySign CLI not found"
            exit 1
          fi
          
          echo "Found SimplySign CLI at: $SIMPLYSIGN_PATH"
          
          # Test CLI capabilities
          echo ""
          echo "=== SimplySign CLI Help ==="
          "$SIMPLYSIGN_PATH" --help || echo "No general help available"
          
          echo ""
          echo "=== SimplySign Auth Help ==="
          "$SIMPLYSIGN_PATH" auth --help || echo "No auth help available"
          
          echo ""
          echo "=== SimplySign Version ==="
          "$SIMPLYSIGN_PATH" --version || "$SIMPLYSIGN_PATH" version || echo "No version command"
          
          # Test authentication methods
          echo ""
          echo "=== Testing Authentication Methods ==="
          
          if [[ -n "$CERTUM_USERNAME" && -n "$CERTUM_PASSWORD" ]]; then
            echo "Testing Method 1: Username + Password only"
            if "$SIMPLYSIGN_PATH" auth --username "$CERTUM_USERNAME" --password "$CERTUM_PASSWORD"; then
              echo "✅ Method 1 SUCCESS: Username + Password"
            else
              echo "❌ Method 1 FAILED: Username + Password"
            fi
            
            if [[ -n "$CERTUM_API_TOKEN" ]]; then
              echo ""
              echo "Testing Method 2: Username + Password + API Token"
              if "$SIMPLYSIGN_PATH" auth --username "$CERTUM_USERNAME" --password "$CERTUM_PASSWORD" --api-token "$CERTUM_API_TOKEN"; then
                echo "✅ Method 2 SUCCESS: Username + Password + API Token"
              else
                echo "❌ Method 2 FAILED: Username + Password + API Token"
              fi
            else
              echo "No API token provided, skipping Method 2"
            fi
            
            if [[ -n "$CERTUM_CERTIFICATE_SHA1" ]]; then
              echo ""
              echo "Testing Method 3: Certificate SHA1 only"
              if "$SIMPLYSIGN_PATH" auth --certificate-sha1 "$CERTUM_CERTIFICATE_SHA1"; then
                echo "✅ Method 3 SUCCESS: Certificate SHA1"
              else
                echo "❌ Method 3 FAILED: Certificate SHA1"
              fi
            else
              echo "No certificate SHA1 provided, skipping Method 3"
            fi
          else
            echo "Missing username/password, cannot test authentication"
          fi
          
          echo ""
          echo "=== Test Complete ==="
          echo "Check the output above to see which authentication method works"
