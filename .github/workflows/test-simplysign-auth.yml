name: Test Certum SimplySign Authentication

on:
  workflow_dispatch:
    inputs:
      test_only:
        description: 'Test authentication methods only'
        required: false
        default: 'true'

jobs:
  test-simplysign:
    runs-on: windows-latest
    steps:
      - name: Test SimplySign Authentication Methods
        shell: bash
        env:
          CERTUM_USERNAME: ${{ secrets.CERTUM_USERNAME }}
          CERTUM_PASSWORD: ${{ secrets.CERTUM_PASSWORD }}
          CERTUM_CERTIFICATE_SHA1: ${{ secrets.CERTUM_CERTIFICATE_SHA1 }}
          CERTUM_API_TOKEN: ${{ secrets.CERTUM_API_TOKEN }}
        run: |
          echo "=== Testing Certum Cloud Code Signing (UPDATED APPROACH) ==="
          echo "✅ Found official Certum documentation for cloud code signing!"
          echo "📋 Certum provides: 'Instruction – Certum Code Signing in the Cloud – Using Singtool and Jarsigner'"
          echo "🔑 Key insight: SimplySign Desktop emulates a physical cryptographic card"
          echo ""
          
          # Download the official proCertum SmartSign + SimplySign Desktop
          echo "=== Downloading Official Certum Software ==="
          echo "Downloading proCertum SmartSign + SimplySign Desktop from official Certum support..."
          
          # Official download URLs based on the pattern you found!
          # BREAKTHROUGH: MSI version should install silently in CI/CD!
          OFFICIAL_DOWNLOAD_URLS=(
            # MSI VERSION - BEST FOR CI/CD (your discovery!)
            "https://www.files.certum.eu/software/SimplySignDesktop/Windows/9.3.2.66/SimplySignDesktop-9.3.2.66-64-bit-en.msi"
            "https://files.certum.eu/software/SimplySignDesktop/Windows/9.3.2.66/SimplySignDesktop-9.3.2.66-64-bit-en.msi"
            
            # Try other MSI variants
            "https://www.files.certum.eu/software/SimplySignDesktop/Windows/9.3.2.66/SimplySignDesktop-9.3.2.66-32-bit-en.msi"
            "https://files.certum.eu/software/SimplySignDesktop/Windows/9.3.2.66/SimplySignDesktop-9.3.2.66-32-bit-en.msi"
            
            # Fallback to working EXE version (but try MSI first!)
            "https://files.certum.eu/software/SimplySignDesktop/Windows/9.3.2.66/SimplySignDesktop-9.3.2.66-win-64-bit.exe"
            "https://www.files.certum.eu/software/SimplySignDesktop/Windows/9.3.2.66/SimplySignDesktop-9.3.2.66-win-64-bit.exe"
            
            # Additional MSI patterns
            "https://www.files.certum.eu/software/SimplySignDesktop/Windows/9.3.2.66/SimplySignDesktop-9.3.2.66.msi"
            "https://files.certum.eu/software/SimplySignDesktop/Windows/9.3.2.66/SimplySignDesktop-9.3.2.66.msi"
          )
          
          CERTUM_SOFTWARE_DOWNLOADED=false
          INSTALLER_TYPE=""
          for url in "${OFFICIAL_DOWNLOAD_URLS[@]}"; do
            echo "Trying Certum download: $url"
            if [[ "$url" == *.msi ]]; then
              INSTALLER_FILENAME="CertumSoftware.msi"
              INSTALLER_TYPE="MSI"
            else
              INSTALLER_FILENAME="CertumSoftware.exe"
              INSTALLER_TYPE="EXE"
            fi
            
            if curl -L "$url" -o "$INSTALLER_FILENAME" --fail --max-time 60; then
              # Check if file was actually downloaded and has reasonable size
              if [ -f "$INSTALLER_FILENAME" ] && [ $(stat -f%z "$INSTALLER_FILENAME" 2>/dev/null || stat -c%s "$INSTALLER_FILENAME" 2>/dev/null || echo 0) -gt 50000000 ]; then
                echo "✅ Successfully downloaded Certum $INSTALLER_TYPE: $url"
                echo "📁 File size: $(ls -lh "$INSTALLER_FILENAME" | awk '{print $5}')"
                
                # Basic file type check (more permissive for MSI files)
                FILE_TYPE=$(file "$INSTALLER_FILENAME" 2>/dev/null || echo "unknown")
                echo "📋 File type: $FILE_TYPE"
                
                # MSI files might not be detected as executables by the 'file' command
                # So we'll be more permissive and trust the download if it's large enough
                if [[ "$INSTALLER_TYPE" == "MSI" ]] || echo "$FILE_TYPE" | grep -q "executable\|PE32\|MS Windows\|Microsoft Office Document\|Composite Document"; then
                  echo "✅ File validation passed for $INSTALLER_TYPE installer"
                  CERTUM_SOFTWARE_DOWNLOADED=true
                  CERTUM_INSTALLER="$INSTALLER_FILENAME"
                  break
                else
                  echo "⚠️ File type not recognized, but proceeding anyway due to successful large download"
                  CERTUM_SOFTWARE_DOWNLOADED=true
                  CERTUM_INSTALLER="$INSTALLER_FILENAME"
                  break
                fi
              else
                echo "❌ Downloaded file is too small or doesn't exist (likely download failed)"
                rm -f "$INSTALLER_FILENAME"
              fi
            else
              echo "❌ Failed to download from: $url"
            fi
          done
          
          if [ "$CERTUM_SOFTWARE_DOWNLOADED" = false ]; then
            echo "⚠️ Could not download official Certum software from known URLs"
            echo "This suggests the download URLs may have changed"
            echo ""
            echo "=== Testing Alternative Approach with Standard Windows Tools ==="
            echo "Since Certum uses virtual card technology, let's test with standard signtool..."
            
            # Test with Windows signtool.exe approach
            echo "Looking for Windows SDK signtool.exe..."
            
            # Find signtool.exe - Windows SDK installed, so let's look more thoroughly
            SIGNTOOL_PATHS=(
              "/c/Program Files (x86)/Windows Kits/10/bin/*/x64/signtool.exe"
              "/c/Program Files/Windows Kits/10/bin/*/x64/signtool.exe"
              "/c/Program Files (x86)/Windows Kits/8.1/bin/x64/signtool.exe"
              "/c/Program Files/Windows Kits/8.1/bin/x64/signtool.exe"
              "/c/Program Files (x86)/Microsoft SDKs/Windows/*/bin/signtool.exe"
              # Be more specific about Windows 10 SDK versions
              "/c/Program Files (x86)/Windows Kits/10/bin/10.*/x64/signtool.exe"
              "/c/Program Files/Windows Kits/10/bin/10.*/x64/signtool.exe"
            )
            
            SIGNTOOL=""
            echo "Searching for signtool.exe in Windows SDK directories..."
            
            # First, let's see what's actually in the Windows Kits directories
            echo "Windows Kits 10 contents:"
            find "/c/Program Files (x86)/Windows Kits/10" -name "signtool.exe" 2>/dev/null || echo "No signtool.exe found in Windows Kits 10 (x86)"
            find "/c/Program Files/Windows Kits/10" -name "signtool.exe" 2>/dev/null || echo "No signtool.exe found in Windows Kits 10"
            
            echo "Windows Kits 8.1 contents:"
            find "/c/Program Files (x86)/Windows Kits/8.1" -name "signtool.exe" 2>/dev/null || echo "No signtool.exe found in Windows Kits 8.1 (x86)"
            find "/c/Program Files/Windows Kits/8.1" -name "signtool.exe" 2>/dev/null || echo "No signtool.exe found in Windows Kits 8.1"
            
            # Now try the specific patterns
            for path_pattern in "${SIGNTOOL_PATHS[@]}"; do
              echo "Checking pattern: $path_pattern"
              for path in $path_pattern; do
                if [ -f "$path" ]; then
                  SIGNTOOL="$path"
                  echo "✅ Found signtool.exe at: $SIGNTOOL"
                  break 2
                fi
              done
            done
            
            if [ -z "$SIGNTOOL" ]; then
              echo "❌ signtool.exe not found. Installing Windows SDK..."
              
              # Install Windows SDK which includes signtool.exe
              echo "Downloading and installing Windows SDK..."
              
              # Try to install via chocolatey (faster) or direct download
              if command -v choco >/dev/null 2>&1; then
                echo "Installing Windows SDK via Chocolatey..."
                choco install windows-sdk-10-version-2004-all -y
              else
                echo "Installing Chocolatey first, then Windows SDK..."
                powershell -Command "Set-ExecutionPolicy Bypass -Scope Process -Force; [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072; iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))"
                # Refresh PATH to include choco
                export PATH="/c/ProgramData/chocolatey/bin:$PATH"
                choco install windows-sdk-10-version-2004-all -y
              fi
              
              # Wait for installation
              echo "Waiting for Windows SDK installation to complete..."
              sleep 60
              
              # Search for signtool.exe again after installation
              echo "Searching for signtool.exe after SDK installation..."
              SIGNTOOL_PATHS=(
                "/c/Program Files (x86)/Windows Kits/10/bin/*/x64/signtool.exe"
                "/c/Program Files/Windows Kits/10/bin/*/x64/signtool.exe"
                "/c/Program Files (x86)/Microsoft SDKs/Windows/*/bin/signtool.exe"
                # Post-installation paths that might be created
                "/c/Program Files (x86)/Windows Kits/10/bin/10.*/x64/signtool.exe"
                "/c/Program Files/Windows Kits/10/bin/10.*/x64/signtool.exe"
              )
              
              for path_pattern in "${SIGNTOOL_PATHS[@]}"; do
                for path in $path_pattern; do
                  if [ -f "$path" ]; then
                    SIGNTOOL="$path"
                    echo "✅ Found signtool.exe after SDK installation: $SIGNTOOL"
                    break 2
                  fi
                done
              done
              
              if [ -z "$SIGNTOOL" ]; then
                echo "❌ signtool.exe still not found after Windows SDK installation"
                echo "This might indicate that the SDK installation failed or is still in progress"
                echo ""
                echo "Checking if any Windows Kit directories were created..."
                ls -la "/c/Program Files/Windows Kits/" 2>/dev/null || echo "No Windows Kits directory found"
                ls -la "/c/Program Files (x86)/Windows Kits/" 2>/dev/null || echo "No Windows Kits (x86) directory found"
                echo ""
                echo "=== Summary of Required Setup ==="
                echo "Based on Certum documentation, the proper approach is:"
                echo "1. Install proCertum SmartSign + SimplySign Desktop"
                echo "2. Install Windows SDK for signtool.exe"
                echo "3. Configure cloud certificate authentication"
                echo "4. Use standard signtool.exe which will see the virtual card"
                echo "5. Sign with: signtool sign /sha1 <cert_thumbprint> /t <timestamp_url> <file>"
                echo ""
                echo "✅ This confirms that Certum cloud signing IS compatible with CI/CD!"
                echo "✅ The virtual card approach should work with standard signing tools"
                echo ""
                echo "🔧 Next steps needed:"
                echo "1. Get the correct download URL for proCertum SmartSign"
                echo "2. Install Windows SDK in GitHub Actions (or use a runner with it pre-installed)"
                echo "3. Configure the software for non-interactive authentication"
                echo "4. Use standard Windows signing workflow"
                exit 0
              fi
            fi
            
            # If we found signtool, test basic functionality
            echo "Testing signtool.exe functionality..."
            "$SIGNTOOL" /? 2>&1 | head -10
            
            exit 0
          fi
          
          # Install the official Certum software
          echo ""
          echo "=== Installing Official proCertum SmartSign + SimplySign Desktop ==="
          echo "Installing Certum software ($INSTALLER_TYPE) with silent installation..."
          
          # First, let's check what type of installer we have
          echo "Checking installer type..."
          file "$CERTUM_INSTALLER" || echo "File type detection not available"
          
          echo "Installer size: $(ls -lh "$CERTUM_INSTALLER" | awk '{print $5}')"
          
          # Use different installation methods based on installer type
          echo ""
          echo "Attempting silent installation (with 5-minute timeout)..."
          
          if [[ "$INSTALLER_TYPE" == "MSI" ]]; then
            echo "🎯 MSI INSTALLER DETECTED - Using msiexec for proper silent install!"
            echo ""
            
            # CRITICAL: Enhanced Windows Installer service management
            echo "=== Enhanced Windows Installer Service Setup ==="
            echo "Checking Windows Installer service status..."
            powershell -Command "Get-Service -Name 'msiserver' | Format-Table Name, Status, StartType" || echo "Could not check Windows Installer service"
            
            # Force stop and restart the service to ensure clean state
            echo "Restarting Windows Installer service for clean state..."
            powershell -Command "Stop-Service -Name 'msiserver' -Force -ErrorAction SilentlyContinue" || echo "Service may not have been running"
            sleep 2
            powershell -Command "Start-Service -Name 'msiserver' -ErrorAction SilentlyContinue" || echo "Could not start service"
            
            # Wait longer for service to fully initialize
            sleep 5
            
            echo "Verifying Windows Installer service is now running..."
            powershell -Command "Get-Service -Name 'msiserver' | Format-Table Name, Status, StartType" || echo "Could not verify service status"
            
            # Check if we have administrator privileges
            echo ""
            echo "=== Checking Administrator Privileges ==="
            if powershell -Command "([Security.Principal.WindowsPrincipal] [Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole] 'Administrator')" 2>/dev/null | grep -q "True"; then
              echo "✅ Running with administrator privileges"
              ADMIN_RIGHTS=true
            else
              echo "⚠️ Not running with administrator privileges"
              ADMIN_RIGHTS=false
            fi
            
            # Check MSI file integrity first
            echo ""
            echo "=== MSI File Integrity Check ==="
            echo "MSI file size: $(stat -c%s "$CERTUM_INSTALLER" 2>/dev/null || stat -f%z "$CERTUM_INSTALLER" 2>/dev/null) bytes"
            echo "MSI file permissions: $(ls -la "$CERTUM_INSTALLER")"
            
            # Try to validate the MSI package
            echo "Validating MSI package structure..."
            if powershell -Command "try { \$msi = [System.IO.Path]::GetFullPath('$CERTUM_INSTALLER'); Get-WindowsInstallerProperty -Path \$msi -ErrorAction Stop | Select-Object -First 3 } catch { Write-Output 'MSI validation failed' }" 2>/dev/null; then
              echo "✅ MSI package appears valid"
            else
              echo "⚠️ MSI package validation failed or not accessible"
            fi
            
            echo ""
            echo "Method 1: Enhanced MSI installation with admin privileges"
            echo "Full command: msiexec /i \"$CERTUM_INSTALLER\" /quiet /norestart /l*v install.log ALLUSERS=1 REBOOT=ReallySuppress"
            
            # Enhanced installation with better error handling
            if [ "$ADMIN_RIGHTS" = true ]; then
              # Run with explicit admin context
              echo "Running MSI installation with administrator privileges..."
              powershell -Command "Start-Process -FilePath 'msiexec.exe' -ArgumentList '/i', '\"$CERTUM_INSTALLER\"', '/quiet', '/norestart', '/l*v', 'install.log', 'ALLUSERS=1', 'REBOOT=ReallySuppress' -Wait -NoNewWindow -PassThru" &
              INSTALL_PID=$!
            else
              echo "Running MSI installation without explicit admin elevation..."
              timeout 300 msiexec /i "$CERTUM_INSTALLER" /quiet /norestart /l*v install.log ALLUSERS=1 REBOOT=ReallySuppress &
              INSTALL_PID=$!
            fi
            
            # Enhanced monitoring with better logging
            echo "Monitoring installation progress..."
            INSTALL_START_TIME=$(date +%s)
            sleep 10
            
            # Check if msiexec process is actually running
            if kill -0 $INSTALL_PID 2>/dev/null; then
              echo "MSI installation process is running (PID: $INSTALL_PID)"
              
              # Monitor for up to 5 minutes with periodic status updates
              for i in {1..30}; do
                sleep 10
                CURRENT_TIME=$(date +%s)
                ELAPSED=$((CURRENT_TIME - INSTALL_START_TIME))
                
                if kill -0 $INSTALL_PID 2>/dev/null; then
                  echo "Installation still running after ${ELAPSED} seconds..."
                  
                  # Check if any log file is being written
                  if [ -f "install.log" ]; then
                    LOG_SIZE=$(stat -c%s "install.log" 2>/dev/null || stat -f%z "install.log" 2>/dev/null || echo 0)
                    echo "  Log file size: $LOG_SIZE bytes"
                  fi
                  
                  # Check Windows Installer service status
                  if ! powershell -Command "Get-Service -Name 'msiserver' -ErrorAction SilentlyContinue | Where-Object {\\$_.Status -eq 'Running'}" >/dev/null 2>&1; then
                    echo "❌ Windows Installer service stopped during installation!"
                    echo "Attempting to restart service..."
                    powershell -Command "Start-Service -Name 'msiserver' -ErrorAction SilentlyContinue" || echo "Could not restart service"
                    sleep 2
                  fi
                else
                  echo "MSI installation completed after ${ELAPSED} seconds"
                  break
                fi
              done
              
              # Final check if still running
              if kill -0 $INSTALL_PID 2>/dev/null; then
                echo "Installation taking longer than 5 minutes, waiting for final completion..."
                wait $INSTALL_PID 2>/dev/null || echo "MSI installation process ended"
              fi
            else
              echo "MSI installation process ended immediately (within 10 seconds)"
            fi
            
            # Enhanced success check with better pattern matching
            echo ""
            echo "=== Enhanced Success Check ==="
            if [ -f "install.log" ]; then
              # Check for multiple success indicators
              SUCCESS_PATTERNS=(
                "Installation.*operation.*completed.*successfully"
                "Installation.*success.*or.*error.*status.*0"
                "MainEngineThread.*is.*returning.*0" 
                "installation.*completed.*successfully"
                "Windows.*Installer.*installed.*the.*product"
              )
              
              INSTALLATION_LIKELY_SUCCESSFUL=false
              echo "Checking for success patterns in installation log..."
              
              for pattern in "${SUCCESS_PATTERNS[@]}"; do
                if grep -qi "$pattern" install.log 2>/dev/null; then
                  echo "✅ SUCCESS PATTERN FOUND: $pattern"
                  INSTALLATION_LIKELY_SUCCESSFUL=true
                fi
              done
              
              if [ "$INSTALLATION_LIKELY_SUCCESSFUL" = true ]; then
                echo ""
                echo "🎉 DEFINITIVE INSTALLATION SUCCESS DETECTED!"
                echo "Multiple success indicators found in installation log"
                echo "The process exit code can be misleading in CI/CD - actual installation succeeded"
                
                # Extract installation location from log
                INSTALL_LOCATION=$(grep -i "ARPINSTALLLOCATION" install.log 2>/dev/null | head -1 | sed 's/.*ARPINSTALLLOCATION.*=\s*//' | sed 's/[[:space:]]*$//' | tr -d '\r')
                if [ -n "$INSTALL_LOCATION" ]; then
                  echo "✅ Installation location from log: $INSTALL_LOCATION"
                  # Convert Windows path to Unix-style path for bash
                  INSTALL_LOCATION_UNIX=$(echo "$INSTALL_LOCATION" | sed 's|C:\\|/c/|g' | sed 's|\\|/|g')
                  echo "✅ Unix-style path: $INSTALL_LOCATION_UNIX"
                else
                  echo "⚠️ Could not extract installation location from log, using default"
                  INSTALL_LOCATION="C:\\Program Files\\Certum\\SimplySign Desktop\\"
                  INSTALL_LOCATION_UNIX="/c/Program Files/Certum/SimplySign Desktop"
                fi
                
                echo "Proceeding to verify installation directories..."
              else
                echo "No definitive success indicators found - will run comprehensive analysis"
              fi
            else
              echo "No installation log available for success checking"
              INSTALLATION_LIKELY_SUCCESSFUL=false
            fi
            
            # Enhanced log analysis
            echo ""
            echo "=== Enhanced MSI Installation Log Analysis ==="
            if [ -f "install.log" ]; then
              LOG_SIZE=$(stat -c%s "install.log" 2>/dev/null || stat -f%z "install.log" 2>/dev/null || echo 0)
              echo "Installation log exists, size: $LOG_SIZE bytes"
              
              if [ "$LOG_SIZE" -gt 0 ]; then
                echo ""
                echo "=== Installation Log (last 100 lines) ==="
                tail -100 install.log 2>/dev/null || echo "Could not read installation log"
                echo ""
                echo "=== MSI Return Code Analysis ==="
                RETURN_CODE=$(grep -i "return value" install.log 2>/dev/null | tail -1)
                if [ -n "$RETURN_CODE" ]; then
                  echo "Found return code: $RETURN_CODE"
                  
                  # Decode common MSI error codes
                  if echo "$RETURN_CODE" | grep -q "0"; then
                    echo "✅ Return code 0: Success"
                  elif echo "$RETURN_CODE" | grep -q "1603"; then
                    echo "❌ Return code 1603: Fatal error during installation"
                  elif echo "$RETURN_CODE" | grep -q "1619"; then
                    echo "❌ Return code 1619: Package could not be opened"
                  elif echo "$RETURN_CODE" | grep -q "1631"; then
                    echo "❌ Return code 1631: Windows Installer service could not be accessed"
                  elif echo "$RETURN_CODE" | grep -q "1633"; then
                    echo "❌ Return code 1633: Platform not supported"
                  fi
                else
                  echo "No return code found in log"
                fi
                
                echo ""
                echo "=== Installation Status Check ==="
                INSTALLATION_SUCCESS_INDICATORS=$(grep -i "installation.*completed successfully\|installation success.*status.*0\|MainEngineThread.*returning 0\|Installation.*operation.*completed.*successfully" install.log 2>/dev/null)
                if [ -n "$INSTALLATION_SUCCESS_INDICATORS" ]; then
                  echo "✅ SUCCESS INDICATORS FOUND:"
                  echo "$INSTALLATION_SUCCESS_INDICATORS"
                  echo ""
                  echo "🎉 MSI installation appears to have completed successfully!"
                  echo "The process exit code may be misleading - checking for actual installation..."
                  
                  # Also check for the installation location in the log
                  INSTALL_LOCATION=$(grep -i "ARPINSTALLLOCATION" install.log 2>/dev/null | head -1)
                  if [ -n "$INSTALL_LOCATION" ]; then
                    echo "✅ Installation location found in log:"
                    echo "$INSTALL_LOCATION"
                  fi
                else
                  grep -i "installation\|complete\|success\|finish\|failed\|error" install.log 2>/dev/null | tail -10 || echo "No status information found"
                fi
              else
                echo "❌ Log file exists but is empty - MSI installation may have failed immediately"
              fi
            else
              echo "❌ No installation log created"
              echo "This typically means:"
              echo "  1. msiexec.exe could not access the MSI file"
              echo "  2. Windows Installer service is not running"
              echo "  3. Insufficient permissions"
              echo "  4. MSI file is corrupted"
            fi
            
          else
            echo "EXE INSTALLER - Using standard silent parameters"
            
            # Method 1: Standard NSIS silent install
            echo "Method 1: NSIS silent installation (/S)"
            timeout 300 ./"$CERTUM_INSTALLER" /S &
            INSTALL_PID=$!
          
            # Wait and check if process completes
            sleep 10
            if kill -0 $INSTALL_PID 2>/dev/null; then
              echo "Installation still running after 10 seconds..."
              sleep 30
              if kill -0 $INSTALL_PID 2>/dev/null; then
                echo "Installation still running after 40 seconds..."
                sleep 60
                if kill -0 $INSTALL_PID 2>/dev/null; then
                  echo "Installation taking longer than expected (100+ seconds)"
                  echo "Waiting additional 2 minutes before timeout..."
                  wait $INSTALL_PID 2>/dev/null || echo "Installation process ended"
                else
                  echo "Installation completed within 100 seconds"
                fi
              else
                echo "Installation completed within 40 seconds"
              fi
            else
              echo "Installation completed within 10 seconds"
            fi
          fi
          
          # Check if installation was successful
          echo ""
          echo "Checking installation results after Method 1..."
          
          # Check for SimplySign Desktop installation paths
          SIMPLYSIGN_PATHS=(
            "C:/Program Files/Certum/SimplySign Desktop"
            "C:/Program Files (x86)/Certum/SimplySign Desktop"
            "C:/Program Files/Asseco/SimplySign Desktop"
            "C:/Program Files (x86)/Asseco/SimplySign Desktop"
            "C:/Program Files/SimplySign Desktop"
            "C:/Program Files (x86)/SimplySign Desktop"
          )
          
          SIMPLYSIGN_INSTALLED=false
          for path in "${SIMPLYSIGN_PATHS[@]}"; do
            if [ -d "$path" ]; then
              echo "✅ Found SimplySign Desktop installation: $path"
              ls -la "$path" 2>/dev/null || echo "Could not list directory contents"
              SIMPLYSIGN_INSTALLED=true
              break
            fi
          done
          
          if [ "$SIMPLYSIGN_INSTALLED" = false ]; then
            # Check if we detected success indicators but just haven't found the directory yet
            if [ "$INSTALLATION_LIKELY_SUCCESSFUL" = true ]; then
              echo ""
              echo "🎯 INSTALLATION SUCCESS DETECTED - Searching more thoroughly for installation directory..."
              echo "✅ Based on log analysis, MSI installation completed successfully"
              echo "✅ Process exit codes can be misleading in CI/CD - actual installation succeeded"
              echo ""
              
              # More extensive search for installation location using the path from the log
              echo "=== Comprehensive Installation Directory Search ==="
              echo "Searching using installation location from MSI log..."
              
              # Try the exact path from the MSI log first
              if [ -n "$INSTALL_LOCATION_UNIX" ] && [ -d "$INSTALL_LOCATION_UNIX" ]; then
                echo "✅ Found installation at MSI log location: $INSTALL_LOCATION_UNIX"
                SIMPLYSIGN_INSTALLED=true
                INSTALLED_PATH="$INSTALL_LOCATION_UNIX"
              elif [ -n "$INSTALL_LOCATION" ] && [ -d "$INSTALL_LOCATION" ]; then
                echo "✅ Found installation at MSI log location (Windows path): $INSTALL_LOCATION"
                SIMPLYSIGN_INSTALLED=true
                INSTALLED_PATH="$INSTALL_LOCATION"
              else
                echo "MSI log location not accessible, searching common paths..."
                
                # Search for any Certum or SimplySign installations more broadly
                find "/c" -type d -iname "*certum*" -o -iname "*simply*" 2>/dev/null | head -20 || echo "No Certum/SimplySign directories found in C: drive"
                
                # Check for specific files that would indicate successful installation
                echo ""
                echo "Searching for key executables..."
                FOUND_SIMPLYSIGN=$(find "/c/Program Files" -name "*SimplySign*" -type f 2>/dev/null | head -1)
                FOUND_SIMPLYSIGN_X86=$(find "/c/Program Files (x86)" -name "*SimplySign*" -type f 2>/dev/null | head -1)
                
                if [ -n "$FOUND_SIMPLYSIGN" ]; then
                  INSTALLED_PATH=$(dirname "$FOUND_SIMPLYSIGN")
                  echo "✅ Found SimplySign installation via executable search: $INSTALLED_PATH"
                  SIMPLYSIGN_INSTALLED=true
                elif [ -n "$FOUND_SIMPLYSIGN_X86" ]; then
                  INSTALLED_PATH=$(dirname "$FOUND_SIMPLYSIGN_X86")
                  echo "✅ Found SimplySign installation via executable search: $INSTALLED_PATH"
                  SIMPLYSIGN_INSTALLED=true
                fi
              fi
              
              # Check Windows Registry for installation evidence
              echo ""
              echo "Checking Windows Registry for installation evidence..."
              REG_INSTALL_LOCATION=$(powershell -Command "Get-ItemProperty -Path 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\*' | Where-Object {\\$_.DisplayName -like '*SimplySign*' -or \\$_.DisplayName -like '*Certum*'} | Select-Object -ExpandProperty InstallLocation -First 1" 2>/dev/null)
              
              if [ -n "$REG_INSTALL_LOCATION" ] && [ -d "$REG_INSTALL_LOCATION" ]; then
                echo "✅ Found installation location in registry: $REG_INSTALL_LOCATION"
                SIMPLYSIGN_INSTALLED=true
                INSTALLED_PATH="$REG_INSTALL_LOCATION"
