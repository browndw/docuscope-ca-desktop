name: Test Installers

on:
  workflow_dispatch:
  # TODO: Re-enable automatic triggering after Tauri build completes once everything is stable
  # workflow_run:
  #   workflows: ["Build Tauri App"]
  #   types: [completed]
  #   branches: [main]

defaults:
  run:
    shell: bash

jobs:
  test-installers:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows - Test MSI installer
          - os: windows-latest
            artifact-pattern: "*_x64_en-US.msi"
            install-command: |
              # Install MSI silently
              msiexec /i *.msi /quiet /qn /norestart
              # Wait for installation to complete
              timeout 30
            test-executable: "C:/Program Files/DocuScope CA/DocuScope CA.exe"
            uninstall-command: |
              # Uninstall via Windows Programs and Features
              wmic product where "name like '%DocuScope CA%'" call uninstall /nointeractive
          
          # Windows - Test NSIS installer
          - os: windows-latest
            artifact-pattern: "*_x64-setup.exe"
            install-command: |
              # Install NSIS installer silently
              ./*.exe /S
              # Wait for installation to complete
              timeout 30
            test-executable: "C:/Program Files/DocuScope CA/DocuScope CA.exe"
            uninstall-command: |
              # NSIS uninstaller
              if [ -f "C:/Program Files/DocuScope CA/Uninstall.exe" ]; then
                "C:/Program Files/DocuScope CA/Uninstall.exe" /S
              fi
          
          # macOS - Test DMG
          - os: macos-latest
            artifact-pattern: "*.dmg"
            install-command: |
              # Mount DMG and copy app
              hdiutil attach *.dmg -nobrowse
              MOUNT_POINT=$(hdiutil info | grep "/Volumes/DocuScope CA" | awk '{print $1}')
              cp -R "/Volumes/DocuScope CA/DocuScope CA.app" /Applications/
              hdiutil detach "$MOUNT_POINT"
            test-executable: "/Applications/DocuScope CA.app/Contents/MacOS/DocuScope CA"
            uninstall-command: |
              # Remove app from Applications
              rm -rf "/Applications/DocuScope CA.app"
          
          # Linux - Test AppImage
          - os: ubuntu-latest
            artifact-pattern: "*.AppImage"
            install-command: |
              # Make AppImage executable
              chmod +x *.AppImage
              # AppImages don't need installation, just execution
              echo "AppImage ready for testing"
            test-executable: "./*.AppImage"
            uninstall-command: |
              # AppImages don't need uninstallation
              echo "No uninstall needed for AppImage"
          
          # Linux - Test DEB package
          - os: ubuntu-latest
            artifact-pattern: "*.deb"
            install-command: |
              # Install DEB package
              sudo dpkg -i *.deb || sudo apt-get install -f -y
            test-executable: "/usr/bin/docuscope-ca"
            uninstall-command: |
              # Remove DEB package
              sudo dpkg -r docuscope-ca || true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifacts from Tauri build
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: tauri-artifacts-${{ matrix.os }}
          path: ./installers/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download artifacts (manual trigger)
        if: github.event_name != 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: tauri-artifacts-${{ matrix.os }}
          path: ./installers/

      - name: List downloaded artifacts
        run: |
          echo "Downloaded artifacts:"
          ls -la ./installers/
          echo ""
          echo "Looking for pattern: ${{ matrix.artifact-pattern }}"
          find ./installers/ -name "${{ matrix.artifact-pattern }}" -type f

      - name: Find and prepare installer
        id: find-installer
        run: |
          cd ./installers/
          
          # Find the installer file matching the pattern
          INSTALLER_FILE=$(find . -name "${{ matrix.artifact-pattern }}" -type f | head -1)
          
          if [ -z "$INSTALLER_FILE" ]; then
            echo "❌ No installer found matching pattern: ${{ matrix.artifact-pattern }}"
            echo "Available files:"
            ls -la
            exit 1
          fi
          
          echo "✅ Found installer: $INSTALLER_FILE"
          echo "installer-file=$INSTALLER_FILE" >> $GITHUB_OUTPUT
          
          # Copy to root for easier access
          cp "$INSTALLER_FILE" ../
          cd ..
          echo "Installer copied to: $(basename "$INSTALLER_FILE")"

      - name: Install application
        run: |
          echo "🚀 Installing application..."
          echo "Working directory: $(pwd)"
          echo "Available files:"
          ls -la
          
          cd ./installers/
          echo "Files in installers directory:"
          ls -la
          
          ${{ matrix.install-command }}
          
          echo "✅ Installation command completed"

      - name: Verify installation
        run: |
          echo "🔍 Verifying installation..."
          
          # Check if executable exists
          if [ -f "${{ matrix.test-executable }}" ] || [ -f ./*.AppImage ]; then
            echo "✅ Executable found"
            
            # For AppImage, use wildcard expansion
            if [[ "${{ matrix.test-executable }}" == ./*.AppImage ]]; then
              EXECUTABLE=$(find . -name "*.AppImage" -type f | head -1)
            else
              EXECUTABLE="${{ matrix.test-executable }}"
            fi
            
            echo "Testing executable: $EXECUTABLE"
            
            # Test that the executable can start (with timeout)
            # We'll just check it can be executed and exits cleanly
            timeout 10s "$EXECUTABLE" --help || echo "Help command may not be available"
            echo "✅ Executable test completed"
          else
            echo "❌ Executable not found: ${{ matrix.test-executable }}"
            echo "Checking common installation locations..."
            
            if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
              ls -la "C:/Program Files/" || true
              ls -la "C:/Program Files (x86)/" || true
            elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
              ls -la /Applications/ | grep -i docuscope || true
            else
              ls -la /usr/bin/ | grep -i docuscope || true
              ls -la /opt/ | grep -i docuscope || true
            fi
            exit 1
          fi

      - name: Test application startup (basic)
        continue-on-error: true
        run: |
          echo "🧪 Testing application startup..."
          
          # Use the local installation test script
          chmod +x .github/scripts/test-installation.sh
          ./.github/scripts/test-installation.sh

      - name: Test file associations (Windows only)
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        run: |
          echo "🔗 Checking Windows file associations..."
          # Check if application is registered in Windows
          reg query "HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Uninstall" | grep -i "docuscope" || echo "No registry entries found"

      - name: Test application metadata
        continue-on-error: true
        run: |
          echo "📋 Checking application metadata..."
          
          # For AppImage, use wildcard expansion
          if [[ "${{ matrix.test-executable }}" == ./*.AppImage ]]; then
            EXECUTABLE=$(find . -name "*.AppImage" -type f | head -1)
          else
            EXECUTABLE="${{ matrix.test-executable }}"
          fi
          
          # Try to get version information
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            # Windows version info
            powershell -Command "(Get-ItemProperty '$EXECUTABLE').VersionInfo" || echo "Version info not available"
          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            # macOS app bundle info
            if [ -f "/Applications/DocuScope CA.app/Contents/Info.plist" ]; then
              plutil -p "/Applications/DocuScope CA.app/Contents/Info.plist" | grep -E "(CFBundleVersion|CFBundleShortVersionString)" || true
            fi
          else
            # Linux - try to get version from executable
            "$EXECUTABLE" --version 2>/dev/null || echo "Version command not available"
          fi

      - name: Cleanup installation
        if: always()
        run: |
          echo "🧹 Cleaning up installation..."
          ${{ matrix.uninstall-command }}
          echo "✅ Cleanup completed"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ strategy.job-index }}
          path: |
            ./installers/
            *.log
          retention-days: 7

  test-summary:
    needs: test-installers
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Test Summary
        run: |
          echo "## 📊 Installer Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.test-installers.result }}" == "success" ]; then
            echo "✅ **All installer tests passed!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "All platform installers were successfully:" >> $GITHUB_STEP_SUMMARY
            echo "- Downloaded and verified" >> $GITHUB_STEP_SUMMARY
            echo "- Installed on fresh systems" >> $GITHUB_STEP_SUMMARY
            echo "- Tested for basic functionality" >> $GITHUB_STEP_SUMMARY
            echo "- Cleanly uninstalled" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Some installer tests failed**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Please check the individual job logs for details." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Common issues to check:" >> $GITHUB_STEP_SUMMARY
            echo "- Installer file naming or format" >> $GITHUB_STEP_SUMMARY
            echo "- Missing dependencies on target platform" >> $GITHUB_STEP_SUMMARY
            echo "- Permission or signing issues" >> $GITHUB_STEP_SUMMARY
            echo "- Installation path conflicts" >> $GITHUB_STEP_SUMMARY
          fi
