name: Test SimplySign Desktop Versions

on:
  workflow_dispatch:
    inputs:
      test_duration:
        description: 'How long to test each version (seconds)'
        required: false
        default: '60'
        type: string

jobs:
  test-simplysign-versions:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        version:
          - name: "9.1.5.52"
            url: "https://files.certum.eu/software/SimplySignDesktop/Windows/9.1.5.52/SimplySignDesktop-9.1.5.52-64-bit-en.msi"
          - name: "9.1.0.52"  
            url: "https://files.certum.eu/software/SimplySignDesktop/Windows/9.1.0.52/SimplySignDesktop-9.1.0.52-64-bit-en.msi"
          - name: "8.3.3.52"
            url: "https://files.certum.eu/software/SimplySignDesktop/Windows/8.3.3.52/SimplySignDesktop-8.3.3.52-64-bit-en.msi"
          - name: "8.1.25.49"
            url: "https://files.certum.eu/software/SimplySignDesktop/Windows/8.1.25.49/SimplySignDesktop-8.1.25.49-64-bit-en.msi"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download SimplySign Desktop ${{ matrix.version.name }}
        run: |
          Write-Host "Downloading SimplySign Desktop ${{ matrix.version.name }}..."
          $url = "${{ matrix.version.url }}"
          $fileName = "SimplySignDesktop-${{ matrix.version.name }}.msi"
          
          try {
            Invoke-WebRequest -Uri $url -OutFile $fileName -UseBasicParsing
            Write-Host "✅ Downloaded $fileName ($(Get-Item $fileName | Select-Object -ExpandProperty Length) bytes)"
          } catch {
            Write-Host "❌ Failed to download: $($_.Exception.Message)"
            exit 1
          }

      - name: Install SimplySign Desktop ${{ matrix.version.name }}
        run: |
          Write-Host "Installing SimplySign Desktop ${{ matrix.version.name }}..."
          $msiFile = "SimplySignDesktop-${{ matrix.version.name }}.msi"
          
          # Install silently
          $process = Start-Process -FilePath "msiexec.exe" -ArgumentList "/i", $msiFile, "/quiet", "/norestart" -Wait -PassThru
          
          if ($process.ExitCode -eq 0) {
            Write-Host "✅ Installation completed successfully"
          } else {
            Write-Host "❌ Installation failed with exit code: $($process.ExitCode)"
            exit 1
          }

      - name: Locate SimplySign Desktop Installation
        id: locate
        run: |
          Write-Host "Locating SimplySign Desktop installation..."
          
          # Use the same proven logic as install-simplysign.sh
          $installDirs = @(
            "${env:ProgramFiles}\Certum\SimplySign Desktop",
            "${env:ProgramFiles(x86)}\Certum\SimplySign Desktop",
            "${env:ProgramFiles}\SimplySign Desktop",
            "${env:ProgramFiles(x86)}\SimplySign Desktop"
          )
          
          $installPath = $null
          $exePath = $null
          
          foreach ($dir in $installDirs) {
            if (Test-Path $dir) {
              $installPath = $dir
              Write-Host "✅ Found SimplySign Desktop directory at: $dir"
              
              # Look for executable in the directory
              $possibleExes = @(
                "$dir\SimplySign Desktop.exe",
                "$dir\SimplySignDesktop.exe", 
                "$dir\simplysign.exe"
              )
              
              foreach ($exe in $possibleExes) {
                if (Test-Path $exe) {
                  $exePath = $exe
                  Write-Host "✅ Found executable at: $exe"
                  break
                }
              }
              
              if ($exePath) { break }
            }
          }
          
          if (-not $installPath) {
            Write-Host "❌ SimplySign Desktop installation directory not found"
            Write-Host "Searching for installation directories..."
            $foundDirs = Get-ChildItem -Path "C:\Program Files*" -Recurse -Directory -Name "*SimplySign*" -ErrorAction SilentlyContinue | Select-Object -First 10
            if ($foundDirs) {
              Write-Host "Found potential directories:"
              $foundDirs | ForEach-Object { Write-Host "  $_" }
            }
            exit 1
          }
          
          if (-not $exePath) {
            Write-Host "❌ SimplySign Desktop executable not found in: $installPath"
            Write-Host "Directory contents:"
            Get-ChildItem $installPath | ForEach-Object { Write-Host "  $($_.Name)" }
            exit 1
          }
          
          echo "SIMPLYSIGN_PATH=$exePath" >> $env:GITHUB_OUTPUT

      - name: Test SimplySign Desktop ${{ matrix.version.name }} Persistence
        run: |
          $exePath = "${{ steps.locate.outputs.SIMPLYSIGN_PATH }}"
          $testDuration = [int]"${{ github.event.inputs.test_duration || '60' }}"
          
          Write-Host "Testing SimplySign Desktop ${{ matrix.version.name }} persistence..."
          Write-Host "Executable: $exePath"
          Write-Host "Test duration: $testDuration seconds"
          Write-Host "Environment: Headless Windows Server"
          
          # Get baseline process count
          $initialProcesses = @(Get-Process -Name "*SimplySign*" -ErrorAction SilentlyContinue)
          Write-Host "Initial SimplySign processes: $($initialProcesses.Count)"
          
          # Start SimplySign Desktop
          Write-Host "Starting SimplySign Desktop..."
          try {
            $process = Start-Process -FilePath $exePath -PassThru -WindowStyle Hidden
            Write-Host "✅ Process started with PID: $($process.Id)"
          } catch {
            Write-Host "❌ Failed to start process: $($_.Exception.Message)"
            exit 1
          }
          
          # Monitor for specified duration
          $startTime = Get-Date
          $checkInterval = 5
          $checksPerformed = 0
          $processAliveChecks = 0
          $processStates = @()
          
          Write-Host "Monitoring process for $testDuration seconds (checking every $checkInterval seconds)..."
          
          while ((Get-Date) -lt $startTime.AddSeconds($testDuration)) {
            Start-Sleep -Seconds $checkInterval
            $checksPerformed++
            
            # Check if original process is still running
            $originalAlive = $false
            try {
              $processCheck = Get-Process -Id $process.Id -ErrorAction SilentlyContinue
              if ($processCheck) {
                $originalAlive = $true
                $processAliveChecks++
              }
            } catch {
              # Process not found
            }
            
            # Check for any SimplySign processes
            $allSimplySignProcesses = @(Get-Process -Name "*SimplySign*" -ErrorAction SilentlyContinue)
            $totalProcesses = $allSimplySignProcesses.Count
            
            # Get memory usage if processes exist
            $totalMemoryMB = 0
            if ($allSimplySignProcesses.Count -gt 0) {
              $totalMemoryMB = ($allSimplySignProcesses | Measure-Object -Property WorkingSet64 -Sum).Sum / 1MB
            }
            
            $state = @{
              Time = (Get-Date).ToString("HH:mm:ss")
              OriginalProcessAlive = $originalAlive
              TotalSimplySignProcesses = $totalProcesses
              TotalMemoryMB = [math]::Round($totalMemoryMB, 1)
            }
            $processStates += $state
            
            Write-Host "[$($state.Time)] Original: $($originalAlive) | Total processes: $($totalProcesses) | Memory: $($state.TotalMemoryMB)MB"
            
            # Detailed process info every 20 seconds
            if ($checksPerformed % 4 -eq 0) {
              if ($allSimplySignProcesses.Count -gt 0) {
                Write-Host "  Process details:"
                $allSimplySignProcesses | ForEach-Object {
                  $memMB = [math]::Round($_.WorkingSet64 / 1MB, 1)
                  Write-Host "    PID $($_.Id): $($_.ProcessName) - $($memMB)MB"
                }
              }
            }
          }
          
          # Final summary
          Write-Host ""
          Write-Host "=== TEST RESULTS FOR VERSION ${{ matrix.version.name }} ==="
          Write-Host "Total monitoring time: $testDuration seconds"
          Write-Host "Checks performed: $checksPerformed"
          Write-Host "Original process alive checks: $processAliveChecks"
          Write-Host "Persistence rate: $([math]::Round(($processAliveChecks / $checksPerformed) * 100, 1))%"
          
          # Final process count
          $finalProcesses = @(Get-Process -Name "*SimplySign*" -ErrorAction SilentlyContinue)
          Write-Host "Final SimplySign processes: $($finalProcesses.Count)"
          
          # Create summary
          $summary = @{
            Version = "${{ matrix.version.name }}"
            TestDurationSeconds = $testDuration
            ChecksPerformed = $checksPerformed
            ProcessAliveChecks = $processAliveChecks
            PersistenceRate = [math]::Round(($processAliveChecks / $checksPerformed) * 100, 1)
            InitialProcessCount = $initialProcesses.Count
            FinalProcessCount = $finalProcesses.Count
            Verdict = if ($processAliveChecks -gt ($checksPerformed * 0.8)) { "✅ STABLE" } 
                     elseif ($processAliveChecks -gt ($checksPerformed * 0.5)) { "⚠️ UNSTABLE" } 
                     else { "❌ FAILED" }
          }
          
          Write-Host ""
          Write-Host "VERDICT: $($summary.Verdict)"
          
          # Save detailed results
          $summary | ConvertTo-Json | Out-File "test-results-${{ matrix.version.name }}.json"
          
          # Set output for matrix summary
          echo "VERDICT=$($summary.Verdict)" >> $env:GITHUB_OUTPUT
          echo "PERSISTENCE_RATE=$($summary.PersistenceRate)" >> $env:GITHUB_OUTPUT

      - name: Cleanup SimplySign Processes
        if: always()
        run: |
          Write-Host "Cleaning up SimplySign processes..."
          $processes = Get-Process -Name "*SimplySign*" -ErrorAction SilentlyContinue
          if ($processes) {
            $processes | ForEach-Object {
              Write-Host "Terminating process: $($_.ProcessName) (PID: $($_.Id))"
              try {
                $_ | Stop-Process -Force
              } catch {
                Write-Host "Failed to terminate PID $($_.Id): $($_.Exception.Message)"
              }
            }
          } else {
            Write-Host "No SimplySign processes found to cleanup"
          }

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.version.name }}
          path: test-results-${{ matrix.version.name }}.json

  summary:
    needs: test-simplysign-versions
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Create Test Summary
        run: |
          echo "# SimplySign Desktop Version Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This workflow tested the persistence of different SimplySign Desktop versions in a headless Windows environment." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Version | Result | Persistence Rate |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|------------------|" >> $GITHUB_STEP_SUMMARY
          
          # Note: Individual job results would need to be collected via artifacts for a complete summary
          # For now, this provides the framework for summary reporting
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Interpretation:" >> $GITHUB_STEP_SUMMARY
          echo "- **✅ STABLE**: Process stayed alive >80% of test duration" >> $GITHUB_STEP_SUMMARY
          echo "- **⚠️ UNSTABLE**: Process stayed alive 50-80% of test duration" >> $GITHUB_STEP_SUMMARY  
          echo "- **❌ FAILED**: Process stayed alive <50% of test duration" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "If any version shows STABLE results, it may be suitable for headless automation." >> $GITHUB_STEP_SUMMARY
